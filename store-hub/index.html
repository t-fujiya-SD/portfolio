<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店舗ハブ｜店の連絡・共有ハブ（デモ）</title>
<meta name="description" content="多店舗の連絡と情報を1か所に。開けば今日ぶんにキャッチアップできる、店の連絡・共有ハブのデモです。データはすべてサンプルです。">
<meta name="robots" content="noindex">
<meta property="og:title" content="店舗ハブ｜店の連絡・共有ハブ（デモ）">
<meta property="og:description" content="連絡も情報も1か所に。相談の答えは「共有」に残る。5言語対応・写真つき。すべてサンプルデータで動きます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&family=Noto+Sans:wght@400;500;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#16a34a; --green-d:#166534; --green-dk:#0b3d1f; --green-soft:#f0fdf4;
    --orange:#f97316; --orange-soft:#fff7ed; --blue:#2563eb; --blue-soft:#eff6ff;
    --red:#dc2626; --red-soft:#fef2f2; --amber:#d97706; --purple:#7c3aed; --purple-soft:#f5f3ff;
    --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --line2:#d1d5db; --paper:#fff; --bg:#f3f4f6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg); color:var(--ink); line-height:1.6; -webkit-text-size-adjust:100%;
    font-family:'Noto Sans JP','Noto Sans','Noto Sans Devanagari',-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;}
  .wrap{width:min(1080px,100%); margin:0 auto; padding:0 12px 96px;}

  header{background:var(--green-dk); color:#fff; position:sticky; top:0; z-index:20; box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .head-in{width:min(1080px,100%); margin:0 auto; padding:10px 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .brand{font-weight:900; font-size:18px; display:flex; align-items:center; gap:8px;}
  .brand .mk{width:26px;height:26px;border-radius:7px;background:#fff;color:var(--green-d);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .brand small{font-weight:600; font-size:11px; opacity:.85; display:block; letter-spacing:0;}
  .head-right{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .actor-pick{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.14); padding:5px 8px; border-radius:10px;}
  .actor-pick label{font-size:11px; opacity:.9;}
  select.actor{font-size:14px; font-weight:800; border:none; border-radius:7px; padding:6px 8px; background:#fff; color:var(--green-d); max-width:150px;}
  .btn-reset{background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.3); padding:6px 10px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer;}
  .lang-pick{display:flex; align-items:center; gap:5px; background:rgba(255,255,255,.14); padding:5px 8px; border-radius:10px;}
  .lang-pick .gl{font-size:14px;}
  select.lang{font-size:13px; font-weight:800; border:none; border-radius:7px; padding:6px 7px; background:#fff; color:var(--green-d); max-width:150px;}
  .btn-orig{background:#fff; color:var(--green-d); border:none; padding:6px 10px; border-radius:8px; font-size:12px; font-weight:800; cursor:pointer;}
  .tr-tag{display:inline-block; font-size:10px; font-weight:800; background:var(--blue-soft); color:var(--blue); border-radius:999px; padding:1px 7px; margin-left:5px; vertical-align:middle;}
  .tr-tag.raw{background:#f3f4f6; color:var(--muted);}
  .tr-bar{background:var(--blue-soft); border:1px solid #bfdbfe; color:#1e40af; border-radius:10px; padding:8px 12px; font-size:12.5px; margin:0 2px 12px; line-height:1.6;}
  .tr-bar b{font-weight:900;}

  nav.tabs{display:flex; gap:4px; overflow-x:auto; padding:8px 4px 2px; scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; background:rgba(255,255,255,.12); color:#eafff0; border:none; padding:8px 13px; border-radius:11px 11px 0 0; font-size:14px; font-weight:800; cursor:pointer; white-space:nowrap; position:relative;}
  .tab.active{background:var(--bg); color:var(--green-d);}
  .tab .em{margin-right:4px;}
  .tab .ext{font-size:9px; background:#111827; color:#fff; border-radius:999px; padding:1px 5px; margin-left:4px; vertical-align:middle; font-weight:800;}
  .tab.active .ext{background:var(--muted);}
  .tab .bn{position:absolute; top:3px; right:4px; background:var(--red); color:#fff; border-radius:999px; font-size:9px; font-weight:800; min-width:15px; height:15px; line-height:15px; text-align:center; padding:0 3px;}

  h2.page{font-size:22px; font-weight:900; margin:16px 2px 4px;}
  .lede{color:var(--muted); font-size:13px; margin:0 2px 14px; line-height:1.55;}
  .lede b{color:var(--green-d);}
  .card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 15px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .card h3{margin:0 0 8px; font-size:16px; font-weight:900; display:flex; align-items:center; gap:7px;}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .grid{display:grid; gap:12px;}
  @media(min-width:620px){ .grid.g2{grid-template-columns:1fr 1fr;} }
  .muted{color:var(--muted);}
  .pill{display:inline-block; font-size:12px; font-weight:700; background:#f3f4f6; border-radius:8px; padding:3px 9px; margin:2px 4px 2px 0;}
  .badge{display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; vertical-align:middle;}
  .b-high{background:var(--red-soft); color:var(--red);}
  .b-all{background:var(--blue-soft); color:var(--blue);}
  .b-me{background:var(--green-soft); color:var(--green-d);}
  .b-hq{background:var(--purple-soft); color:var(--purple);}
  .b-open{background:var(--blue-soft); color:var(--blue);}
  .b-match{background:var(--orange-soft); color:var(--orange);}
  .b-book{background:var(--green-soft); color:var(--green-d);}
  .b-cancel{background:#f3f4f6; color:var(--muted);}
  .cat{display:inline-block; font-size:11px; font-weight:800; padding:2px 9px; border-radius:8px;}
  .cat-rule{background:var(--blue-soft); color:var(--blue);}
  .cat-manual{background:var(--green-soft); color:var(--green-d);}
  .cat-form{background:var(--orange-soft); color:var(--orange);}
  .cat-link{background:#eef2ff; color:#4f46e5;}
  .cat-decision{background:var(--purple-soft); color:var(--purple);}
  .cat-media{background:#fdf2f8; color:#be185d;}
  .cat-vendor{background:#f0f9ff; color:#0369a1;}
  .cat-promo{background:#fefce8; color:#a16207;}
  .tpl{display:inline-block;font-size:10px;font-weight:800;background:#111827;color:#fff;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:middle;}
  .sc{display:inline-block;font-size:10px;font-weight:800;border-radius:7px;padding:1px 7px;margin-left:4px;vertical-align:middle;}
  .sc-mgr{background:var(--orange-soft);color:var(--orange);} .sc-owner{background:var(--red-soft);color:var(--red);} .sc-all{background:#f3f4f6;color:var(--muted);}
  .pw{display:inline-block;font-family:ui-monospace,monospace;background:#f3f4f6;color:var(--muted);border-radius:7px;padding:3px 10px;font-size:12.5px;letter-spacing:1px;}
  .bt{display:inline-block; font-size:11px; font-weight:800; padding:2px 9px; border-radius:8px; vertical-align:middle;}
  .bt-soudan{background:var(--purple-soft); color:var(--purple);}
  .bt-q{background:var(--blue-soft); color:var(--blue);}
  .bt-share{background:var(--green-soft); color:var(--green-d);}
  .bt-req{background:var(--orange-soft); color:var(--orange);}
  .reply{background:#fafafa; border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin-top:6px;}
  .reply .who{font-size:11.5px; font-weight:800; color:var(--muted);}
  .reply .bd{font-size:13px; margin-top:2px;}
  .reply.tome{background:#fffdf5; border-color:#f0d9a0;}
  .reply.best{background:var(--green-soft); border-color:var(--green);}
  /* 入れ子返信（1段だけ。深くすると現場では追えなくなる） */
  .reply.sub{margin-left:22px; border-left:3px solid #c7d2fe; background:#fbfbff;}
  .reply .sub-to{display:inline-block; font-size:10.5px; font-weight:800; background:#eef2ff; color:#4f46e5; border-radius:6px; padding:1px 7px; margin-left:5px;}
  .re-bar{display:flex; align-items:center; gap:8px; background:#eef2ff; border:1px solid #c7d2fe; color:#4f46e5;
    border-radius:8px; padding:6px 10px; font-size:12px; font-weight:800; margin-bottom:6px;}
  .re-bar button{margin-left:auto;}
  /* A5 検索・タグ／B1 未読／B3 並び替え／C2 定型文 */
  .bq-row{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-bottom:8px;}
  .bq-row input{flex:1 1 240px; min-width:0; margin:0;}
  .bq-row select{width:auto; margin:0; font-size:13px; padding:8px 10px;}
  .tgchip{border:1px solid var(--line2); background:#fff; color:#4f46e5; border-radius:999px;
    padding:4px 11px; font-size:12.5px; font-weight:800; cursor:pointer; font-family:inherit;}
  .tgchip.on{background:#4f46e5; border-color:#4f46e5; color:#fff;}
  .tgchip.sm{font-size:11px; padding:2px 9px; margin:0 4px 3px 0;}
  .bn.soft{background:#9aa2ab;}
  .new-tag{display:inline-block; font-size:10.5px; font-weight:900; background:var(--orange); color:#fff;
    border-radius:6px; padding:1px 7px; margin-right:5px; vertical-align:middle;}
  .qr-row{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px;}
  .qrbtn{border:1px solid var(--green); background:var(--green-soft); color:var(--green-d); border-radius:999px;
    padding:5px 12px; font-size:12.5px; font-weight:800; cursor:pointer; font-family:inherit;}
  .qrbtn:hover{background:var(--green); color:#fff;}
  .best-tag{display:inline-block; font-size:10.5px; font-weight:900; background:var(--green); color:#fff; border-radius:999px; padding:1px 8px; margin-left:5px; vertical-align:middle;}
  .hint{background:#eff6ff; border:1px dashed #93c5fd; color:#1d4ed8; border-radius:9px; padding:7px 10px; font-size:12.5px; font-weight:700; margin-top:9px;}
  .prom{background:#f5f3ff; border:1px solid #ddd6fe; border-radius:10px; padding:10px; margin-top:9px;}
  .prom h4{margin:0 0 4px; font-size:13.5px; font-weight:900; color:var(--purple);}
  .prom .nt{font-size:11.5px; color:var(--muted); line-height:1.6; margin:0 0 8px;}
  .promoted{background:var(--purple-soft); color:var(--purple); border-radius:9px; padding:7px 10px; font-size:12.5px; font-weight:800; margin-top:9px;}
  .promoted a{color:var(--purple); text-decoration:underline; cursor:pointer;}
  .from-bd{display:inline-block;font-size:10px;font-weight:800;background:var(--purple-soft);color:var(--purple);border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:middle;}
  .card.hilite{box-shadow:0 0 0 3px var(--amber); }
  /* 写真添付 */
  .pgrid{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .pth{position:relative; width:104px; height:78px; border-radius:9px; overflow:hidden; border:1px solid var(--line2); background:#f3f4f6; cursor:zoom-in;}
  .pth img{width:100%; height:100%; object-fit:cover; display:block;}
  .pth .rm{position:absolute; top:2px; right:2px; width:22px; height:22px; border-radius:50%; border:none; background:rgba(15,23,42,.72); color:#fff; font-size:13px; font-weight:900; cursor:pointer; line-height:1; font-family:inherit;}
  .pcount{display:inline-block; font-size:10.5px; font-weight:800; background:#eef2ff; color:#4f46e5; border-radius:999px; padding:1px 7px; margin-left:5px; vertical-align:middle;}
  .lb{position:fixed; inset:0; background:rgba(15,23,42,.86); z-index:80; display:flex; align-items:center; justify-content:center; padding:22px; cursor:zoom-out;}
  .lb img{max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 18px 50px rgba(0,0,0,.5);}
  .phint{font-size:11.5px; color:var(--muted); line-height:1.6; margin:4px 0 0;}
  /* 連続達成（ストリーク）＋紙吹雪 */
  .cft{position:fixed; inset:0; pointer-events:none; z-index:90;}
  .streak{display:inline-flex; align-items:center; gap:8px; margin-top:11px; background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:7px 15px; font-size:14px; font-weight:900; color:#fff;}
  .streak .bst{font-size:11.5px; font-weight:800; color:#bbf7d0;}
  .streak.pop{animation:stpop .5s cubic-bezier(.2,1.4,.4,1);}
  @keyframes stpop{0%{transform:scale(.7); opacity:0;} 100%{transform:scale(1); opacity:1;}}
  .done-line{background:var(--green-soft); border:1px solid #bbf7d0; color:var(--green-d); border-radius:8px; padding:6px 10px; font-size:12.5px; font-weight:800; margin-bottom:8px;}
  .item.jump{cursor:pointer; border-radius:8px; transition:none;}
  .item.jump:hover{background:#f6f7f4;}
  .item.jump .t::after{content:" ›"; color:var(--muted); font-weight:900;}
  .mchip{display:inline-block; font-size:11.5px; font-weight:800; background:#eef2ff; color:#4f46e5; border-radius:7px; padding:2px 8px; margin:0 4px 2px 0;}
  .mchip.me{background:#fef3c7; color:#92400e;}
  .mrow{display:flex; flex-wrap:wrap; gap:5px;}
  .mpick{border:1px solid var(--line2); background:#fff; color:var(--muted); border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:800; cursor:pointer; font-family:inherit;}
  .mpick.on{background:#4f46e5; border-color:#4f46e5; color:#fff;}
  .rrow{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px;}
  .rbtn{border:1px solid var(--line2); background:#fff; border-radius:999px; padding:4px 11px; font-size:14px; cursor:pointer; font-family:inherit; line-height:1.4;}
  .rbtn b{font-size:12px; font-weight:800; color:var(--muted); margin-left:2px;}
  .rbtn.on{background:var(--green-soft); border-color:var(--green);}
  .rbtn.on b{color:var(--green-d);}
  .card.tome{border-left:5px solid var(--amber); background:#fffdf7;}
  .tome-tag{display:inline-block; font-size:11px; font-weight:900; background:#fef3c7; color:#92400e; border-radius:7px; padding:2px 9px; margin-bottom:6px;}

  /* ログイン画面デモ（オーバーレイ） */
  .ov{position:fixed; inset:0; background:rgba(15,23,42,.62); z-index:60; display:flex; align-items:flex-start; justify-content:center; padding:18px 12px; overflow:auto;}
  .ov-in{background:#fff; border-radius:18px; width:min(400px,100%); padding:22px 20px 18px; box-shadow:0 18px 50px rgba(0,0,0,.3);}
  .ov-in h3{margin:0 0 3px; font-size:21px; font-weight:900; text-align:center;}
  .ov-in .sb{text-align:center; color:var(--muted); font-size:12.5px; margin-bottom:16px;}
  .line-btn{display:flex; align-items:center; justify-content:center; gap:9px; width:100%; background:#06C755; color:#fff; border:none; border-radius:12px; padding:15px; font-size:17px; font-weight:800; cursor:pointer; font-family:inherit; min-height:56px;}
  .line-btn .lg{width:25px;height:25px;border-radius:6px;background:#fff;color:#06C755;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;}
  .or{display:flex; align-items:center; gap:9px; margin:18px 0 14px;}
  .or span{flex:1; height:1px; background:var(--line);} .or b{font-size:12px; color:#9ca3af; font-weight:800;}
  .tel-btn{width:100%; background:#fff; color:var(--green-d); border:2px solid var(--green); border-radius:12px; padding:13px; font-size:16px; font-weight:800; cursor:pointer; font-family:inherit; min-height:52px;}
  .ov-note{font-size:11.5px; color:var(--muted); line-height:1.65; margin-top:14px;}
  .ov-close{width:100%; background:#f3f4f6; border:none; border-radius:10px; padding:11px; font-weight:800; cursor:pointer; margin-top:12px; font-family:inherit; font-size:14px;}
  .otp{display:flex; gap:6px; justify-content:center; margin:12px 0;}
  .otp input{width:46px; text-align:center; font-size:22px; font-weight:900; padding:10px 0;}
  .lg-inv{background:var(--green-soft); border:1px solid #bbf7d0; border-radius:11px; padding:10px 12px; font-size:13.5px; color:var(--green-d); text-align:center; margin-bottom:14px; line-height:1.6;}
  .lg-inv span{font-size:11.5px; color:var(--muted);}
  .lg-hint{background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:12.5px; color:#374151; line-height:1.6;}
  .lg-swap{text-align:center; margin-top:12px;}
  .lg-swap button{background:none; border:none; color:var(--blue); font-size:12px; font-weight:800; cursor:pointer; font-family:inherit; text-decoration:underline;}

  /* メンバー */
  .ava{width:38px;height:38px;border-radius:50%;background:var(--green-d);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex:0 0 auto;}
  .rl{display:inline-block;font-size:11px;font-weight:800;background:#f3f4f6;color:var(--muted);border-radius:7px;padding:1px 8px;margin-left:4px;}
  .au{display:inline-block;font-size:11px;font-weight:800;border-radius:7px;padding:1px 8px;margin-right:3px;}
  .a-line{background:#e7f8ee;color:#06803c;} .a-l4{background:var(--blue-soft);color:var(--blue);} .a-inv{background:#f3f4f6;color:var(--muted);}
  /* 検索 */
  .sres-i{border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin-bottom:7px; cursor:pointer; background:#fff;}
  .sres-i:hover{background:var(--green-soft); border-color:var(--green);}
  .sres-i .t{font-weight:800; font-size:14px;} .sres-i .m{color:var(--muted); font-size:11.5px; margin-top:2px;}

  button.act{border:none; border-radius:9px; padding:9px 14px; font-size:14px; font-weight:800; cursor:pointer;}
  button.primary{background:var(--green); color:#fff;}
  button.warn{background:var(--orange); color:#fff;}
  button.blue{background:var(--blue); color:#fff;}
  button.ghost{background:#fff; color:var(--ink); border:1px solid var(--line2);}
  button.act:active{transform:translateY(1px);}
  button.act:disabled{opacity:.45; cursor:default;}
  .mini{padding:6px 11px; font-size:12.5px;}

  input,select,textarea{font-family:inherit; font-size:15px; padding:9px 10px; border:1px solid var(--line2); border-radius:9px; width:100%; background:#fff; color:var(--ink);}
  label.field{display:block; font-size:12px; font-weight:800; color:var(--muted); margin:8px 0 3px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px;}
  .form-grid .full{grid-column:1 / -1;}

  .catchup{background:linear-gradient(135deg,var(--green-d),var(--green-dk)); color:#fff; border-radius:16px; padding:16px 17px; margin:14px 0 12px;}
  .catchup .hi{font-size:13px; opacity:.9;}
  .catchup .big{font-size:20px; font-weight:900; margin:3px 0 10px;}
  .catchup .nums{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
  .catchup .n{background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.2); border-radius:11px; padding:9px; text-align:center;}
  .catchup .n .v{font-size:24px; font-weight:900;}
  .catchup .n .l{font-size:11px; opacity:.9;}
  .catchup .done{background:rgba(255,255,255,.13); border:1px dashed rgba(255,255,255,.4); border-radius:11px; padding:12px; text-align:center; font-weight:800;}

  .pain{background:var(--green-soft); border:1px dashed var(--green); border-radius:10px; padding:9px 12px; font-size:12.5px; color:var(--green-d); margin-bottom:12px;}
  .pain b{font-weight:900;}
  .note-ext{background:#0b3d1f; color:#eafff0; border-radius:10px; padding:9px 12px; font-size:12.5px; margin-bottom:12px; line-height:1.55;}
  .note-ext b{color:#fff;}

  .item{padding:10px 0; border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item .t{font-weight:800; font-size:14.5px;}
  .item .m{color:var(--muted); font-size:12px; margin-top:2px;}
  .stamp{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:800; padding:3px 8px; border-radius:8px; margin:2px 4px 2px 0;}
  .stamp.read{background:var(--blue-soft); color:var(--blue);}
  .stamp.handled{background:var(--green-soft); color:var(--green-d);}
  .stamp.unread{background:#f3f4f6; color:var(--muted);}

  table.pl{width:100%; border-collapse:collapse; font-size:13px;}

/* UI文言：L('key', 置換1, 置換2...)　※コード内で t を別用途に使っているため L */
function L(k){
  let s = (I18N[LANG]&&I18N[LANG][k]!==undefined) ? I18N[LANG][k] : (I18N.ja[k]!==undefined?I18N.ja[k]:k);
  for(let i=1;i<arguments.length;i++) s=String(s).split('{'+(i-1)+'}').join(arguments[i]);
  return s;
}
/* 投稿の中身：翻訳があればその言語で、無ければ原文 */
function tx(o,field){
  if(!o) return '';
  if(LANG==='ja'||SHOW_ORIG) return o[field]||'';
  const tr=o.i18n&&o.i18n[LANG];
  return (tr&&tr[field]) ? tr[field] : (o[field]||'');
}
/* この項目は翻訳済みか（バッジ表示用） */
/* キーワードが原文・全訳のどちらかに含まれるか（横断検索とボード内検索で共用） */
function hitTr(o,field,kk){
  if(!o) return false;
  const vals=[o[field]];
  if(o.i18n) LANGS.forEach(l=>{ const tr=o.i18n[l.id]; if(tr&&tr[field]) vals.push(tr[field]); });
  return vals.some(v=>String(v||'').toLowerCase().includes(kk));
}
function hasTr(o,field){
  if(LANG==='ja') return null;
  const tr=o&&o.i18n&&o.i18n[LANG];
  return !!(tr&&tr[field]);
}
function trTag(o,field){
  if(LANG==='ja'||!o) return '';
  if(!(o[field]||'')) return '';
  if(SHOW_ORIG) return `<span class="tr-tag raw">${L('show_orig')}</span>`;
  return hasTr(o,field) ? `<span class="tr-tag">${L('tr_tag')}</span>` : `<span class="tr-tag raw">${L('raw_tag')}</span>`;
}

/* ===== 写真（A3）=====
   デモなので実写は載せない（ダミー厳守）。SVGのdata URIで「それっぽい現場写真」を作る。
   実運用ではアップロード先のURLがここに入るだけなので、表示側のコードは変わらない。 */
function PH(bg,items,cap){
  const dots=items.map((it,i)=>`<circle cx="${90+i*95}" cy="205" r="${it.r}" fill="${it.c}" opacity=".92"/>`).join('');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360">
    <rect width="480" height="360" fill="${bg}"/>
    <rect x="28" y="30" width="424" height="270" rx="18" fill="#ffffff" opacity=".14"/>
    <ellipse cx="240" cy="205" rx="176" ry="96" fill="#ffffff" opacity=".9"/>
    <ellipse cx="240" cy="205" rx="150" ry="78" fill="#f6f1e7"/>
    ${dots}
    <text x="240" y="330" font-family="sans-serif" font-size="19" font-weight="700" fill="#ffffff" opacity=".85" text-anchor="middle">${cap}</text>
  </svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg.replace(/\s+/g,' '));
}
const PHOTO_MAX=3, PHOTO_PX=960;

function photoBadge(o){

/* 端末内で縮小してから data URL 化（localStorageに巨大な画像を入れないため） */
function readPhoto(file){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image();
      img.onload=()=>{ const s=Math.min(1,PHOTO_PX/Math.max(img.width,img.height));
        const w=Math.round(img.width*s), h=Math.round(img.height*s);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.72)); };
      img.onerror=()=>res(null); img.src=fr.result; };
    fr.onerror=()=>res(null); fr.readAsDataURL(file);
  });
}
function bindPhotoInput(btnId,inputId,onDone){
  const b=document.getElementById(btnId), f=document.getElementById(inputId);
  if(!b||!f) return;
  b.onclick=()=>f.click();
  f.onchange=async()=>{
    const files=[...(f.files||[])]; f.value='';
    for(const file of files){ const d=await readPhoto(file); if(d) onDone(d); }
    save(); render(); toast(L('ts_photo'));
  };
}

let S=load();
function load(){ try{const r=localStorage.getItem(LS_KEY); if(r){const d=JSON.parse(r); if(d&&d.stores) return d;}}catch(e){} const s=seed(); localStorage.setItem(LS_KEY,JSON.stringify(s)); return s; }
function save(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }
  catch(e){ toast(L('ts_photo_ng')); } }
function reset(){ if(confirm(L('cf_reset'))){ localStorage.removeItem(LS_KEY); S=load(); render(); } }

const storeName=id=> id==='hq'?L('hq'):(S.stores.find(s=>s.id===id)||{}).name||id;
const isHQ=()=> S.actor==='hq';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
const num=(id,d)=>{const e=document.getElementById(id);const n=e?parseFloat(e.value):NaN;return isNaN(n)?d:n;};
const sum=a=>a.reduce((p,c)=>p+c,0);
/* ===== 連続達成（ストリーク）と紙吹雪 =====
   毎日開く画面なので「今日ぶんを片付けた」に手応えを返す。
   ※デモなので前日かどうかの厳密な日付差判定はしない（last!==today なら +1）。 */
function streakOf(){
  if(!S.streaks) S.streaks={};
  if(!S.streaks[S.actor]) S.streaks[S.actor]={days:0,best:0,last:'',celebrated:''};
  return S.streaks[S.actor];
}
function markCatchUp(){
  const st=streakOf(), td=today();
  if(st.celebrated===td) return false;          // 今日はもう祝ったので静かにしておく
  if(st.last!==td){ st.days=(st.days||0)+1; st.last=td; }
  if(st.days>(st.best||0)) st.best=st.days;
  st.celebrated=td; save();
  return true;                                   // 初回だけ true ＝ 紙吹雪を出す
}
function confetti(){
  const c=document.createElement('canvas'); c.className='cft';
  const W=c.width=innerWidth, H=c.height=innerHeight;
  const ctx=c.getContext('2d'); document.body.appendChild(c);
  const cols=['#16a34a','#22c55e','#d97706','#f59e0b','#dc2626','#4f46e5','#ffffff'];
  const P=Array.from({length:150},()=>({
    x:Math.random()*W, y:-30-Math.random()*H*0.6,
    w:5+Math.random()*7, h:8+Math.random()*9,
    c:cols[Math.floor(Math.random()*cols.length)],
    vy:2.4+Math.random()*3.4, vx:-1.2+Math.random()*2.4,
    r:Math.random()*6.28, vr:-0.22+Math.random()*0.44, sw:Math.random()*6.28
  }));
  let t=0;
  (function loop(){
    t++; ctx.clearRect(0,0,W,H);
    const fade=t>190?Math.max(0,1-(t-190)/70):1;
    P.forEach(p=>{
      p.y+=p.vy; p.x+=p.vx+Math.sin(p.sw+t/18)*0.7; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.globalAlpha=fade; ctx.fillStyle=p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*(0.6+0.4*Math.abs(Math.cos(p.r))));
      ctx.restore();
    });
    if(t<260) requestAnimationFrame(loop); else c.remove();
  })();
}
function openLightbox(src){
  const o=document.createElement('div'); o.className='lb';
  o.innerHTML=`<img src="${src}" alt="">`;
  o.onclick=()=>o.remove();
  document.addEventListener('keydown',function esc(e){ if(e.key==='Escape'){ o.remove(); document.removeEventListener('keydown',esc); } });
  document.body.appendChild(o);
}
function toast(msg){ const d=document.createElement('div'); d.textContent=msg;
  d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 17px;border-radius:11px;font-weight:800;font-size:13px;z-index:99;box-shadow:0 6px 22px rgba(0,0,0,.32);max-width:90%;text-align:center';
  document.body.appendChild(d); setTimeout(()=>{d.style.transition='opacity .3s';d.style.opacity='0';},1800); setTimeout(()=>d.remove(),2200); }

/* ---- 連絡：関連性・未読判定 ---- */
function noticeRelevant(n){ const me=S.actor; return n.author===me || n.target==='all' || n.target===me; }
function noticeUnread(n){ const me=S.actor; return noticeRelevant(n) && n.author!==me && !(n.reads&&n.reads[me]); }
function noticeUnhandled(n){ const me=S.actor; return noticeRelevant(n) && n.author!==me && !(n.reads&&n.reads[me]&&n.reads[me].handled); }
/* ---- やること：自分の店に関係＆未完 ---- */
function todoMine(t){ return isHQ() || t.target==='all' || t.target===S.actor; }
function todoOpen(t){ return todoMine(t) && !isHQ() && !(t.done&&t.done[S.actor]); }

/* B2：ボードで「自分が返す番」のもの。
   単なる未解決だと自分が答えた後も残り続けて“追いつけない”ので、
   自分宛のメンションがあり、まだ自分が1件も返していない未解決だけを拾う。 */
/* B1：未読＝まだ見ていない投稿、または前回見たあとに返信が増えたもの */
function boardUnread(p){
  const me=S.actor;
  if(p.by===me) return false;                       // 自分の投稿は未読にしない
  const s=p.seen&&p.seen[me];
  if(s===undefined) return true;                    // 投稿そのものが新規
  return p.comments.length>s;                       // 見たあとに返信が増えた
}
function boardUnreadCount(){ return S.board.filter(boardUnread).length; }
function newReplies(p){ const s=p.seen&&p.seen[S.actor]; return (s===undefined)?0:Math.max(0,p.comments.length-s); }
/* 相談タブを描画したら既読にする（開いた回だけ NEW が見えて、次に開くと消えている） */
function markBoardSeen(){
  if(!PENDING_SEEN) return; PENDING_SEEN=false;
  const me=S.actor; let changed=false;
  S.board.forEach(p=>{ if(!p.seen) p.seen={};
    if(p.seen[me]!==p.comments.length){ p.seen[me]=p.comments.length; changed=true; } });
  if(changed) save();
}
function boardTodo(p){ return boardTodoKind(p)!==null; }
/* A4：最後に自分が@された位置より後に自分が返しているか、で判定する。
   「返信済みなら永久に対象外」だと、返したあとに@返信が来ても気づけないため。
   戻り値 'post'＝投稿で名指し / 'reply'＝返信で名指し / null＝返す番ではない */
function boardTodoKind(p){
  const me=S.actor;
  if(p.solved||p.type==='共有') return null;
  let lastM=null, kind=null;
  if(p.by!==me && mentionsMe(p.to)){ lastM=-1; kind='post'; }   // 投稿本体の宛先
  p.comments.forEach((c,i)=>{ if(c.by!==me && mentionsMe(c.to)){ lastM=i; kind='reply'; } });
  if(lastM===null) return null;
  const replied=p.comments.some((c,i)=>c.by===me && i>lastM);   // その@より後に自分が返したか
  return replied?null:kind;
}
function boardTodoCount(){ return S.board.filter(boardTodo).length; }
function unreadCount(){ return S.notices.filter(noticeUnread).length; }
function todoOpenCount(){ return S.todos.filter(todoOpen).length; }

function buildHead(){
  /* 言語 */
  const lsel=document.getElementById('langSel');
  lsel.innerHTML=LANGS.map(l=>`<option value="${l.id}">${l.label}</option>`).join('');
  lsel.value=LANG;
  lsel.onchange=()=>{ LANG=lsel.value; localStorage.setItem(LS_LANG,LANG);
    document.documentElement.lang=(LANGS.find(l=>l.id===LANG)||{}).html||'ja'; render(); };
  document.documentElement.lang=(LANGS.find(l=>l.id===LANG)||{}).html||'ja';
  /* 原文↔翻訳トグル（日本語のときは不要なので隠す） */
  const ob=document.getElementById('origBtn');
  ob.style.display = LANG==='ja' ? 'none' : '';
  ob.textContent = SHOW_ORIG ? '🌐 '+L('show_tr') : '📄 '+L('show_orig');
  ob.onclick=()=>{ SHOW_ORIG=!SHOW_ORIG; localStorage.setItem(LS_ORIG,SHOW_ORIG?'1':'0'); render(); };
  /* 固定ラベル */
  document.getElementById('brandSub').textContent=L('app_sub');
  document.getElementById('actorLbl').textContent=L('you');
  document.getElementById('searchLbl').textContent=L('search');
  document.getElementById('loginLbl').textContent=L('login_screen');
  document.getElementById('resetLbl').textContent=L('reset');
  const sel=document.getElementById('actorSel');
  sel.innerHTML=`<option value="hq">${L('hq')}（HQ）</option>`+S.stores.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  sel.value=S.actor; sel.onchange=()=>{S.actor=sel.value; NEW_SET=null; save(); render();};
  document.getElementById('resetBtn').onclick=reset;
  document.getElementById('loginBtn').onclick=()=>showLogin('invite');
  document.getElementById('searchBtn').onclick=()=>openSearch('');
  const nav=document.getElementById('tabs');
  const un=unreadCount();
  nav.innerHTML=TABS.map(tb=>{
    let bn=''; if(tb.id==='notice'&&un>0) bn=`<span class="bn">${un}</span>`;
    /* 返す相談があれば赤（自分が動くべき）、無ければ未読数を灰色（見るだけでよい） */
    if(tb.id==='board'){ const ub=boardTodoCount(), ur=boardUnreadCount();
      if(ub>0) bn=`<span class="bn">${ub}</span>`; else if(ur>0) bn=`<span class="bn soft">${ur}</span>`; }
    return `<button class="tab ${tb.id===TAB?'active':''}" data-tab="${tb.id}"><span class="em">${tb.em}</span>${L(tb.k)}${tb.ext?`<span class="ext">${L('ext')}</span>`:''}${bn}</button>`;
  }).join('');
  nav.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab; HILITE=null; PROMOTE=null; NEW_SET=null; render();});
}

function render(){
  buildHead();
  document.getElementById('app').innerHTML=({home:viewHome,notice:viewNotice,share:viewShare,board:viewBoard,todo:viewTodo,members:viewMembers,relay:viewRelay,pl:viewPL}[TAB])();
  bindActions();
  const h=HILITE&&(document.getElementById('bd-'+HILITE)||document.getElementById('sh-'+HILITE));
  if(h) h.scrollIntoView({block:'center'}); else window.scrollTo({top:0});
  if(TAB==='board') markBoardSeen();   // 描画後に既読化（この画面では NEW が見えたまま残る）
  if(CELEBRATE){ CELEBRATE=false; confetti(); }
}

function noticeCard(n){
  const me=S.actor;
  const targets=(n.target==='all')?['hq',...S.stores.map(s=>s.id)].filter(id=>id!==n.author):[n.target];
  const stamps=targets.map(id=>{
    const r=n.reads&&n.reads[id];
    if(!r) return `<span class="stamp unread">${storeName(id)} ${L('unread')}</span>`;
    if(r.handled) return `<span class="stamp handled">${storeName(id)} ${L('handled')}</span>`;
    return `<span class="stamp read">${storeName(id)} ${L('read')}</span>`;
  }).join('');
  const mine=n.author===me;
  const myRead=n.reads&&n.reads[me];
  let acts='';
  if(!mine && noticeRelevant(n)){
    acts=`<div class="row" style="margin-top:9px;">
      ${!myRead?`<button class="act blue mini" data-nt="read" data-id="${n.id}">${L('mark_read_f')}</button>`:''}
      ${!(myRead&&myRead.handled)?`<button class="act primary mini" data-nt="handle" data-id="${n.id}">${L('mark_handled_f')}</button>`:`<span class="muted" style="font-size:12.5px;align-self:center;">${L('you_handled')}</span>`}
    </div>`;
  }
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;gap:8px;">
      <h3 style="margin:0;">${n.priority==='high'?`<span class="badge b-high">${L('important')}</span> `:''}${esc(tx(n,'title'))}${trTag(n,'title')}</h3>
      <span class="muted" style="font-size:12px;white-space:nowrap;">${n.date}${n.due?'・'+L('due')+' '+n.due:''}</span>
    </div>
    <div class="m muted" style="font-size:12px;">${storeName(n.author)} → ${targetBadge(n.target)}</div>
    ${tx(n,'body')?`<p style="margin:8px 0 0;font-size:13.5px;">${esc(tx(n,'body'))}</p>`:''}
    <div style="margin-top:10px;">${stamps}</div>
    ${acts}
  </div>`;
}

/* A4：返信を親子に並べ替える。入れ子は1段だけ（深くすると現場では追えない）。
   孫以降が来ても、親をたどってトップの直下にぶら下げる。 */
function threadOrder(p){
  const cs=p.comments||[];
  const rootOf=i=>{ let n=i,guard=0; while(cs[n]&&typeof cs[n].re==='number'&&guard++<20) n=cs[n].re; return n; };
  const out=[];
  cs.forEach((c,i)=>{
    if(typeof c.re!=='number'){
      out.push({c,i,sub:false});
      cs.forEach((k,j)=>{ if(typeof k.re==='number'&&rootOf(j)===i) out.push({c:k,i:j,sub:true}); });
    }
  });
  return out;
}
function reactionBar(p){
  const me=S.actor; const r=p.reactions||{};

    return `<button class="rbtn${on?' on':''}" data-bd="react" data-id="${p.id}" data-emoji="${e}">${e}${users.length?` <b>${users.length}</b>`:''}</button>`;

}

function doBoard(a,id,emoji,idx){
  const p=S.board.find(o=>o.id===id); if(!p) return;
  if(a==='reply'){ const el=document.getElementById('rep-'+id); if(el) el.style.display=el.style.display==='none'?'block':'none'; return; }
  if(a==='quick'){ const q=QUICK_REPLIES[Number(idx)]; if(!q) return;
    // 原文は日本語で保存し、4言語の訳を丸ごと付ける＝押した人も相手も母語で読める
    const i18n={}; ['en','zh','vi','ne'].forEach(l=>{ if(q[l]) i18n[l]={body:q[l]}; });
    const c={by:S.actor,body:q.ja,date:today(),to:(REPLY_MENTIONS[id]||[]).slice(),photos:[],i18n};
    if(typeof RE_TO[id]==='number') c.re=RE_TO[id];
    p.comments.push(c);
    REPLY_MENTIONS[id]=[]; delete RE_TO[id]; save(); render(); toast(L('ts_qr')); return; }
  if(a==='replyTo'){ RE_TO[id]=Number(idx);
    // 返信相手を自動で宛先に入れる＝@を付け忘れて気づかれない事故を防ぐ
    const tgt=p.comments[Number(idx)]; const cur=REPLY_MENTIONS[id]||[];
    if(tgt&&tgt.by!==S.actor&&!cur.includes(tgt.by)) cur.push(tgt.by);
    REPLY_MENTIONS[id]=cur; render();
    const el=document.getElementById('rep-'+id); if(el) el.style.display='block'; return; }
  if(a==='replyToClear'){ delete RE_TO[id]; render();
    const el=document.getElementById('rep-'+id); if(el) el.style.display='block'; return; }
  if(a==='send'){ const t=document.getElementById('rt-'+id); const b=t?t.value.trim():'';
    const ph=(REPLY_PHOTOS[id]||[]).slice(); if(!b&&!ph.length) return;
    const c={by:S.actor,body:b,date:today(),to:(REPLY_MENTIONS[id]||[]).slice(),photos:ph};
    if(typeof RE_TO[id]==='number') c.re=RE_TO[id];
    p.comments.push(c);
    REPLY_MENTIONS[id]=[]; REPLY_PHOTOS[id]=[]; delete RE_TO[id]; save(); render(); toast(L('ts_replied')); return; }
  if(a==='react'){ if(!p.reactions) p.reactions={}; const u=p.reactions[emoji]||[]; const i=u.indexOf(S.actor);
    if(i>=0) u.splice(i,1); else u.push(S.actor); p.reactions[emoji]=u; if(!u.length) delete p.reactions[emoji]; }
  if(a==='best'){ p.best=Number(idx); save(); render(); toast(L('ts_best')); return; }
  if(a==='unbest'){ delete p.best; }
  if(a==='promote'){ PROMOTE=id; render(); return; }
  if(a==='promoteNo'){ PROMOTE=null; render(); return; }
  if(a==='promoteGo'){ promoteToShare(p); return; }
  if(a==='solve') p.solved=true;
  if(a==='unsolve'){ p.solved=false; if(PROMOTE===id) PROMOTE=null; }
  save(); render();
}
/* A1：解決した相談を「共有」へ昇格（出典リンク付き・翻訳は無編集なら引き継ぐ） */
function promoteToShare(p){
  const title=val('pt-'+p.id), body=val('pb-'+p.id);
  if(!title){ alert(L('al_title')); return; }
  const bi=(typeof p.best==='number')?p.best:-1;
  const src=(bi>=0&&p.comments[bi])?p.comments[bi]:null;
  // 表示中の言語で編集せずに登録した場合は、原文＋既存の訳をそのまま引き継ぐ
  const keepT = title===tx(p,'title');
  const keepB = body===(src?tx(src,'body'):tx(p,'body'));
  const i18n={};
  ['en','zh','vi','ne'].forEach(l=>{
    const t=keepT&&p.i18n&&p.i18n[l]?p.i18n[l].title:null;
    const b=keepB&&src&&src.i18n&&src.i18n[l]?src.i18n[l].body:(keepB&&!src&&p.i18n&&p.i18n[l]?p.i18n[l].body:null);
    if(t||b) i18n[l]=Object.assign({},t?{title:t}:{},b?{body:b}:{});
  });
  const sid=g();
  S.shares.unshift({id:sid,cat:val('pc-'+p.id),
    title:keepT?p.title:title,
    body:keepB?(src?src.body:(p.body||'')):body,
    url:'',pinned:false,scope:val('ps-'+p.id)||'all',origin:'promoted',
    by:storeName(src?src.by:p.by),date:today(),
    src:{postId:p.id,type:p.type,by:p.by,date:p.date},
    photos:((src&&src.photos&&src.photos.length)?src.photos:(p.photos||[])).slice(),
    i18n:Object.keys(i18n).length?i18n:undefined});
  p.promoted={shareId:sid,title:keepT?p.title:title,date:today()};
  PROMOTE=null; save(); render(); toast(L('ts_promoted'));
}

function openSearch(q){
  document.querySelectorAll('.ov').forEach(e=>e.remove());
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="ov-in" style="max-width:520px;">
    <h3 style="text-align:left;font-size:18px;">${L('search_head')}</h3>
    <div class="sb" style="text-align:left;">${L('search_sub')}</div>
    <input id="sq" placeholder="${L('search_ph')}" value="${esc(q||'')}" autofocus>
    <div id="sres" style="margin-top:12px;"></div>
    <button class="ov-close" data-sc="close">${L('close')}</button>
  </div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  ov.querySelector('[data-sc]').onclick=()=>ov.remove();
  const inp=ov.querySelector('#sq'), res=ov.querySelector('#sres');
  const run=()=>{
    const k=inp.value.trim(); if(!k){ res.innerHTML=`<div class="empty">${L('search_hint')}</div>`; return; }
    const kk=k.toLowerCase();
    /* 原文でも翻訳でもヒットさせる（母語で探して、母語で読める） */
    const hit=(o,f)=>hitTr(o,f,kk);
    const out=[];
    S.notices.filter(n=>hit(n,'title')||hit(n,'body')).forEach(n=>out.push({tab:'notice',ic:'📣',cat:L('notice_head'),t:tx(n,'title'),m:`${storeName(n.author)}・${n.date}`}));
    S.shares.filter(s=>hit(s,'title')||hit(s,'body')).forEach(s=>out.push({tab:'share',ic:'📚',cat:catL(s.cat),t:tx(s,'title'),m:`${s.by}・${s.date}`}));
    S.board.filter(p=>hit(p,'title')||hit(p,'body')||p.comments.some(c=>hit(c,'body'))).forEach(p=>out.push({tab:'board',ic:'💬',cat:btL(p.type),t:tx(p,'title'),m:`${storeName(p.by)}・${p.date}`}));
    S.todos.filter(o=>hit(o,'title')||hit(o,'note')).forEach(o=>out.push({tab:'todo',ic:'✅',cat:L('search_todo'),t:tx(o,'title'),m:`${L('due')} ${o.due||'—'}`}));
    res.innerHTML = out.length
      ? `<div class="muted" style="font-size:12px;font-weight:800;margin-bottom:6px;">${L('search_n',out.length)}</div>`+
        out.map(o=>`<div class="sres-i" data-go2="${o.tab}">
          <div class="t">${o.ic} ${esc(o.t)}</div><div class="m"><span class="pill" style="font-size:10.5px;">${esc(o.cat)}</span>${esc(o.m)}</div></div>`).join('')
      : `<div class="empty">${L('search_none',esc(k))}</div>`;
    res.querySelectorAll('[data-go2]').forEach(b=>b.onclick=()=>{ TAB=b.dataset.go2; ov.remove(); render(); });
  };
  inp.oninput=run; if(q) run();
  setTimeout(()=>inp.focus(),50);
}

function computePL(){
  const o={};
  for(const s of S.stores){
    const b=S.baseline[s.id];
    const gO=sum(S.goods.filter(x=>x.status==='booked'&&x.from===s.id).map(amtGoods));
    const gI=sum(S.goods.filter(x=>x.status==='booked'&&x.to===s.id).map(amtGoods));
    const hO=sum(S.help.filter(x=>x.status==='booked'&&x.from===s.id).map(amtHelp));
    const hI=sum(S.help.filter(x=>x.status==='booked'&&x.to===s.id).map(amtHelp));
    o[s.id]={id:s.id,name:s.name,sales:b.sales,baseCost:b.cost,baseLabor:b.labor,cost:b.cost-gO+gI,labor:b.labor-hO+hI,gOut:gO,gIn:gI,hOut:hO,hIn:hI,net:(gO+hO)-(gI+hI)};
  }
  return o;
}

      <div class="k"><div class="l">${L('k_hp')}</div><div class="v">${m.hotpepper.reserv}<small> ${L('u_reserv')}</small></div><div class="sub">${L('u_views')} ${m.hotpepper.views.toLocaleString()}</div></div>
      <div class="k"><div class="l">${L('k_ig')}</div><div class="v">${(m.instagram.followers/1000).toFixed(1)}k<small> ${L('u_follow')}</small></div><div class="sub">${L('u_reach')} ${m.instagram.reach.toLocaleString()}</div></div>
      <div class="k"><div class="l">${L('k_google')}</div><div class="v">${m.google.rating}<small> ★</small></div><div class="sub">${m.google.reviews} ${L('u_reviews')}</div></div>
    </div>
    <p class="muted" style="font-size:12px;margin-top:10px;">${L('pl_mkpi_note')}</p>
  </div>

  <div class="card">
    <h3>${L('pl_table')}</h3>
    <div style="overflow-x:auto;"><table class="pl">
      <thead><tr><th class="n">${L('th_store')}</th><th>${L('k_sales')}</th><th>${L('k_guests')}</th><th>${L('th_cost')}</th><th>${L('th_labor')}</th><th>${L('th_net')}</th></tr></thead>
      <tbody>${st.map(row).join('')}</tbody>
      <tfoot><tr style="border-top:2px solid var(--line2);"><td class="n">${L('th_total')}</td><td>${yen(T.sales)}</td><td>${guests.toLocaleString()}</td>
        <td>${pct(T.baseCost/T.sales)} <span class="arrow">→</span> <b>${pct(T.cost/T.sales)}</b></td>
        <td>${pct(T.baseLabor/T.sales)} <span class="arrow">→</span> <b>${pct(T.labor/T.sales)}</b></td><td>±0</td></tr></tfoot>
    </table></div>
    <p class="muted" style="font-size:12px;margin-top:10px;">${L('pl_note')}</p>
  </div>`;
}

/* ===================== ログイン画面デモ ===================== */
function showLogin(step){
  document.querySelectorAll('.ov').forEach(e=>e.remove());
  const ov=document.createElement('div'); ov.className='ov';
  const swap = s=>`<div class="lg-swap"><button data-lg="${s==='invite'?'again':'invite'}">${s==='invite'?L('lg_swap_again'):L('lg_swap_inv')}</button></div>`;
  /* ログイン画面だけは、その場で言語を選べるようにする（招待された本人はまだ設定できないため） */
  const langRow=`<div class="lg-swap" style="margin:0 0 12px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap;">
    ${LANGS.map(l=>`<button class="mpick${LANG===l.id?' on':''}" data-lgset="${l.id}">${l.label}</button>`).join('')}</div>`;
  let body;
  if(step==='last4'){
    body=`${langRow}<h3>${L('lg_tel')}</h3>
    <div class="sb">${L('lg_tel_sub')}</div>
    <div class="lg-hint">${L('lg_tel_hint')}</div>
    <div class="otp">${[1,2,3,4].map(()=>'<input maxlength="1" inputmode="numeric">').join('')}</div>
    <button class="line-btn" style="background:var(--green)" data-lg="done4">${L('lg_tel_go')}</button>
    <div class="ov-note">${L('lg_tel_note')}</div>
    <button class="ov-close" data-lg="back">${L('back')}</button>`;
  } else if(step==='again'){
    body=`${langRow}<h3>店舗ハブ</h3>
    <div class="sb">${L('lg_back')}</div>
    <button class="line-btn" data-lg="line"><span class="lg">L</span>${L('lg_line_login')}</button>
    <div class="ov-note" style="text-align:center;margin-top:9px;">${L('lg_note_line')}</div>
    <div class="or"><span></span><b>${L('lg_or')}</b><span></span></div>
    <button class="tel-btn" data-lg="last4">${L('lg_link4')}</button>
    <div class="ov-note">${L('lg_note3')}</div>
    ${swap('again')}
    <button class="ov-close" data-lg="close">${L('close')}</button>`;
  } else {
    body=`${langRow}<div class="lg-inv">${L('lg_inv','本店')}<br><span>${L('lg_inv_sub')}</span></div>
    <h3>店舗ハブ</h3>
    <div class="sb">${L('lg_first')}</div>
    <button class="line-btn" data-lg="line"><span class="lg">L</span>${L('lg_line_start')}</button>
    <div class="ov-note" style="text-align:center;margin-top:9px;">${L('lg_note1')}</div>
    <div class="or"><span></span><b>${L('lg_or')}</b><span></span></div>
    <button class="tel-btn" data-lg="last4">${L('lg_last4')}</button>
    <div class="ov-note">${L('lg_note2')}</div>
    ${swap('invite')}
    <button class="ov-close" data-lg="close">${L('close')}</button>`;
  }
  ov.innerHTML=`<div class="ov-in">${body}</div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  ov.querySelectorAll('[data-lgset]').forEach(b=>b.onclick=()=>{
    LANG=b.dataset.lgset; localStorage.setItem(LS_LANG,LANG);
    document.documentElement.lang=(LANGS.find(l=>l.id===LANG)||{}).html||'ja';
    render(); showLogin(step);
  });
  ov.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.lg;
    if(a==='close') ov.remove();
    else if(a==='back') showLogin('invite');
    else if(a==='invite') showLogin('invite');
    else if(a==='again') showLogin('again');
    else if(a==='last4') showLogin('last4');
    else if(a==='line'){ ov.remove(); toast(L('ts_line')); }
    else if(a==='done4'){ ov.remove(); toast(L('ts_last4')); }
  });
}

/* ===================== actions ===================== */
function bindActions(){
  const app=document.getElementById('app');
  const meSel=document.getElementById('f_me'); if(meSel) meSel.value=isHQ()?S.stores[0].id:S.actor;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{TAB=b.dataset.go; HILITE=null; PROMOTE=null; NEW_SET=null; render();});
  app.querySelectorAll('[data-nt]').forEach(b=>b.onclick=()=>doNotice(b.dataset.nt,b.dataset.id));
  app.querySelectorAll('[data-sf]').forEach(b=>b.onclick=()=>{SHARE_FILTER=b.dataset.sf; HILITE=null; render();});
  app.querySelectorAll('[data-va]').forEach(b=>b.onclick=()=>{VIEW_AS=b.dataset.va; render();});
  app.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>toast(L('ts_acc')));
  app.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>doShare(b.dataset.share,b.dataset.id));
  app.querySelectorAll('[data-bf]').forEach(b=>b.onclick=()=>{
    if(b.dataset.bf==='__clear'){ BOARD_FILTER='すべて'; BOARD_Q=''; BOARD_TAG=''; }
    else BOARD_FILTER=b.dataset.bf;
    HILITE=null; render(); });
  app.querySelectorAll('[data-btag]').forEach(b=>b.onclick=()=>{
    BOARD_TAG = BOARD_TAG===b.dataset.btag ? '' : b.dataset.btag; TAB='board'; HILITE=null; render(); });
  app.querySelectorAll('[data-tgnew]').forEach(b=>b.onclick=()=>{ const t=b.dataset.tgnew;
    const i=NEW_TAGS.indexOf(t); if(i>=0) NEW_TAGS.splice(i,1); else NEW_TAGS.push(t); render(); });
  const bq=document.getElementById('bq'), bqGo=document.getElementById('bqGo');
  if(bq){
    const runQ=()=>{ BOARD_Q=bq.value.trim(); render();
      const el=document.getElementById('bq'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } };
    bq.onkeydown=e=>{ if(e.key==='Enter') runQ(); };
    bq.onchange=runQ; if(bqGo) bqGo.onclick=runQ;
  }
  const bs=document.getElementById('b_sort'); if(bs) bs.onchange=()=>{ BOARD_SORT=bs.value; render(); };
  app.querySelectorAll('[data-bd]').forEach(b=>b.onclick=()=>doBoard(b.dataset.bd,b.dataset.id,b.dataset.emoji,b.dataset.i));
  // 出典リンク：共有 → 元の相談へジャンプ／相談 → 昇格した共有へジャンプ
  app.querySelectorAll('[data-boardgo]').forEach(b=>b.onclick=()=>{
    const p=S.board.find(o=>o.id===b.dataset.boardgo); if(!p) return;
    TAB='board'; BOARD_FILTER='すべて'; HILITE=p.id; PROMOTE=null; NEW_SET=null; render(); });
  app.querySelectorAll('[data-sharego]').forEach(b=>b.onclick=()=>{
    const s=S.shares.find(o=>o.id===b.dataset.sharego); if(!s) return;
    TAB='share'; SHARE_FILTER=s.cat; VIEW_AS='owner'; HILITE=s.id; render(); });
  app.querySelectorAll('[data-mnew]').forEach(b=>b.onclick=()=>{ const t=b.dataset.mnew; const i=NEW_MENTIONS.indexOf(t);
    if(i>=0) NEW_MENTIONS.splice(i,1); else NEW_MENTIONS.push(t); render(); });
  app.querySelectorAll('[data-mrep]').forEach(b=>b.onclick=()=>{ const id=b.dataset.id, t=b.dataset.mrep;
    const cur=REPLY_MENTIONS[id]||[]; const i=cur.indexOf(t); if(i>=0) cur.splice(i,1); else cur.push(t);
    REPLY_MENTIONS[id]=cur; render(); const el=document.getElementById('rep-'+id); if(el) el.style.display='block'; });
  app.querySelectorAll('[data-mem]').forEach(b=>b.onclick=()=>toast(L('ts_resent')));
  const ib=document.getElementById('inviteBtn'); if(ib) ib.onclick=()=>{
    const name=val('m_name'); if(!name){alert(L('al_name'));return;}
    S.members.push({id:g(),name,store:val('m_store'),role:val('m_role'),auth:'invited',last:'—',joined:today()});
    save(); render(); toast(L('ts_invited'));
  };
  const pb=document.getElementById('postBoard'); if(pb) pb.onclick=()=>{
    const title=val('b_title'); if(!title){alert(L('al_title'));return;}
    S.board.unshift({id:g(),type:val('b_type'),title,body:val('b_body'),by:S.actor,date:today(),solved:false,to:NEW_MENTIONS.slice(),tags:NEW_TAGS.slice(),reactions:{},comments:[],photos:NEW_PHOTOS.slice()});
    NEW_MENTIONS=[]; NEW_TAGS=[]; NEW_PHOTOS=[]; save(); render(); toast(L('ts_posted')); };
  /* --- 写真（A3）：添付・取り消し・拡大 --- */
  bindPhotoInput('bPhotoBtn','bPhotoIn',d=>{ if(NEW_PHOTOS.length<PHOTO_MAX) NEW_PHOTOS.push(d); });
  bindPhotoInput('sPhotoBtn','sPhotoIn',d=>{ if(SHARE_PHOTOS.length<PHOTO_MAX) SHARE_PHOTOS.push(d); });
  S.board.forEach(p=>bindPhotoInput('rp-btn-'+p.id,'rp-in-'+p.id,d=>{
    const cur=REPLY_PHOTOS[p.id]||[]; if(cur.length<PHOTO_MAX) cur.push(d); REPLY_PHOTOS[p.id]=cur; }));
  app.querySelectorAll('[data-rmnew]').forEach(b=>b.onclick=e=>{ e.stopPropagation();
    NEW_PHOTOS.splice(Number(b.dataset.rmnew),1); render(); });
  app.querySelectorAll('[data-rmshare]').forEach(b=>b.onclick=e=>{ e.stopPropagation();
    SHARE_PHOTOS.splice(Number(b.dataset.rmshare),1); render(); });
  app.querySelectorAll('[data-rmrep]').forEach(b=>b.onclick=e=>{ e.stopPropagation();
    const id=b.dataset.id; (REPLY_PHOTOS[id]||[]).splice(Number(b.dataset.rmrep),1); render();
    const el=document.getElementById('rep-'+id); if(el) el.style.display='block'; });
  app.querySelectorAll('.pth').forEach(el=>el.onclick=()=>{
    const img=el.querySelector('img'); if(img) openLightbox(img.src); });
  app.querySelectorAll('[data-todo]').forEach(b=>b.onclick=()=>doTodo(b.dataset.todo,b.dataset.id));
  app.querySelectorAll('[data-rk]').forEach(b=>b.onclick=()=>{RELAY_KIND=b.dataset.rk; render();});
  app.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>doTransfer(b.dataset.tf,b.dataset.kind,b.dataset.id,b.dataset.role));
  const upBtn=document.getElementById('upBtn'), upFile=document.getElementById('upFile');
  if(upBtn&&upFile){ upBtn.onclick=()=>upFile.click();
    upFile.onchange=()=>{ const f=upFile.files&&upFile.files[0]; if(!f) return;
      S.uploads.unshift({name:f.name,date:today(),kind:/\.csv$/i.test(f.name)?'CSV':'Excel'}); save(); render();
      toast(L('ts_import',f.name)); }; }
  app.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{ const s=S.sources.find(o=>o.id===b.dataset.src); if(!s) return;
    s.status='ok'; s.last=today(); save(); render(); toast(L('ts_linked',L(s.nk))); });
  const pn=document.getElementById('postNotice'); if(pn) pn.onclick=()=>{
    const title=val('n_title'); if(!title){alert(L('al_subject'));return;}
    S.notices.unshift({id:g(),author:S.actor,target:val('n_target')||'all',priority:val('n_pri'),due:val('n_due'),title,body:val('n_body'),date:today(),reads:{}}); save(); render();
  };
  const ps=document.getElementById('postShare'); if(ps) ps.onclick=()=>{
    const title=val('s_title'); if(!title){alert(L('al_title'));return;}
    S.shares.unshift({id:g(),cat:val('s_cat'),title,body:val('s_body'),url:val('s_url'),pinned:val('s_pin')==='1',scope:val('s_scope')||'all',origin:'own',by:storeName(S.actor),date:today(),photos:SHARE_PHOTOS.slice()});
    SHARE_PHOTOS=[]; save(); render(); toast(L('ts_share'));
  };
  const pt=document.getElementById('postTodo'); if(pt) pt.onclick=()=>{
    const title=val('t_title'); if(!title){alert(L('al_content'));return;}
    S.todos.unshift({id:g(),target:val('t_target')||'all',due:val('t_due'),note:val('t_note'),title,done:{}}); save(); render();
  };
  const pg=document.getElementById('postGoods'); if(pg) pg.onclick=()=>{
    const item=val('f_item'); if(!item){alert(L('al_item'));return;}
    const type=val('f_type'),me=val('f_me');
    S.goods.push({id:g(),type,item,qty:num('f_qty',1),unit:val('f_unit')||'個',unitPrice:num('f_price',0),note:val('f_note'),status:'open',date:today(),from:type==='offer'?me:null,to:type==='need'?me:null}); save(); render();
  };
  const ph=document.getElementById('postHelp'); if(ph) ph.onclick=()=>{
    const type=val('f_type'),me=val('f_me');
    S.help.push({id:g(),type,people:num('f_people',1),hours:num('f_hours',8),wage:num('f_wage',12000),note:val('f_note'),status:'open',date:today(),from:type==='offer'?me:null,to:type==='need'?me:null}); save(); render();
  };
}
function doNotice(a,id){ const n=S.notices.find(o=>o.id===id); if(!n||n.author===S.actor) return; if(!n.reads)n.reads={};
  if(a==='read') n.reads[S.actor]={at:today(),handled:false}; if(a==='handle') n.reads[S.actor]={at:today(),handled:true}; save(); render(); }
function doShare(a,id){ const i=S.shares.findIndex(o=>o.id===id); if(i<0) return;
  if(a==='pin') S.shares[i].pinned=!S.shares[i].pinned; if(a==='del'){ if(!confirm(L('cf_del')))return; S.shares.splice(i,1);} save(); render(); }
function doTodo(a,id){ const o=S.todos.find(v=>v.id===id); if(!o) return; if(isHQ()){alert(L('al_hq_todo'));return;}
  if(a==='done'){ if(!o.done)o.done={}; o.done[S.actor]=today(); } save(); render(); }
function doTransfer(a,kind,id,role){ const arr=kind==='goods'?S.goods:S.help; const x=arr.find(o=>o.id===id); if(!x) return; const me=S.actor;
  if(a==='claim'){ let tgt=me; if(isHQ()){ const pick=prompt(`${role==='to'?'受け入れる':'提供する'}店舗（${S.stores.map(s=>s.name).join(' / ')}）`,''); const st=S.stores.find(s=>s.name===(pick||'').trim()); if(!st)return; tgt=st.id; }
      if(role==='to')x.to=tgt; else x.from=tgt; if(x.from&&x.to&&x.from===x.to){alert(L('al_same_store')); if(role==='to')x.to=null;else x.from=null;return;} x.status='matched'; }
  else if(a==='book'){ if(!x.from||!x.to){alert(L('al_need_both'));return;} x.status='booked'; }
  else if(a==='unmatch'){ if(x.type==='offer')x.to=null; else x.from=null; x.status='open'; }
  else if(a==='unbook') x.status='matched';
  else if(a==='cancel') x.status='cancelled';
  save(); render();
}

render();
</script>
</body>
