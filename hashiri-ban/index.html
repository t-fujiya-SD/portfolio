<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ハシリ板（ハシリバン）— 卸の朝の申し送り</title>
<meta name="description" content="市場・倉庫・車上・事務所で同時刻に一緒にいない人たちの間で、今朝の申し送りを確実に届けるためのボード。デモ（データはすべて架空）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --g:#16a34a; --g-d:#15803d; --g-l:#dcfce7; --g-bg:#f0fdf4;
  --ink:#111827; --sub:#6b7280; --line:#e5e7eb; --bg:#f6f7f9; --card:#fff;
  --red:#dc2626; --amber:#d97706; --blue:#2563eb; --purple:#7c3aed;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans JP","Noto Sans",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.65;
  padding-bottom:84px; overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* ---- header ---- */
header{background:var(--g);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 1px 8px rgba(0,0,0,.12)}
.hrow{display:flex;align-items:center;gap:8px;padding:10px 14px;max-width:720px;margin:0 auto}
.logo{font-weight:700;font-size:18px;letter-spacing:.02em;white-space:nowrap}
.logo small{display:block;font-size:10px;font-weight:400;opacity:.85;letter-spacing:.06em;line-height:1.2}
.hspace{flex:1}
.hbtn{background:rgba(255,255,255,.16);color:#fff;border-radius:9px;padding:6px 9px;font-size:13px;font-weight:500}
.hbtn:active{background:rgba(255,255,255,.3)}
.actorbar{background:var(--g-d);color:#fff;font-size:12.5px}
.actorbar .wrap{display:flex;align-items:center;gap:8px;padding:6px 14px;flex-wrap:wrap}
.actorbar select{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);
  border-radius:8px;padding:4px 6px;font-size:12.5px;max-width:46vw}
.actorbar select option{color:#111}

/* ---- cards ---- */
/* ★scroll-margin-top＝stickyヘッダーの高さぶん。無いとジャンプ先がヘッダーに隠れる */
.card{scroll-margin-top:120px;background:var(--card);border-radius:var(--radius);padding:14px;margin:12px 0;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card.acc{border-left:5px solid var(--g)}
.card.tome{border-left:5px solid var(--amber);background:#fffbeb}
.card.hi{outline:3px solid var(--amber);outline-offset:2px}
h2.sec{font-size:15px;margin:20px 0 6px;color:var(--sub);font-weight:700;letter-spacing:.02em}
.muted{color:var(--sub);font-size:13.5px}
.tiny{font-size:12px;color:var(--sub)}

/* ---- catch-up hero ---- */
.hero{background:linear-gradient(135deg,var(--g) 0%,var(--g-d) 100%);color:#fff;
  border-radius:var(--radius);padding:18px 16px;margin:14px 0}
.hero .n{font-size:27px;font-weight:700;line-height:1.25;margin:0 0 2px}
.hero .p{font-size:13px;opacity:.92;margin:0}
.hero.done .n{font-size:23px}
.streak{margin-top:10px;background:rgba(255,255,255,.16);border-radius:9px;padding:7px 10px;font-size:13px}

/* ---- routme panel ---- */
.rm{display:flex;gap:10px;margin:12px 0}
.rm .b{flex:1;background:var(--card);border-radius:var(--radius);padding:12px;text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.rm .b b{display:block;font-size:24px;line-height:1.2}
.rm .b.ok b{color:var(--g)}
.rm .b.warn{background:#fef2f2;border:1px solid #fecaca}
.rm .b.warn b{color:var(--red)}
.rm .b span{font-size:12px;color:var(--sub)}
.rm .b{cursor:pointer;transition:transform .1s}
.rm .b:active{transform:scale(.97)}
.rmfilter{display:flex;align-items:center;gap:8px;background:#dbeafe;border:1px solid #bfdbfe;
  border-radius:10px;padding:8px 12px;margin:10px 0;font-size:13.5px;color:#1d4ed8;font-weight:700}
.rmfilter button{margin-left:auto;background:#fff;border:1px solid #bfdbfe;border-radius:8px;
  padding:4px 10px;font-size:12.5px;color:#1d4ed8;font-weight:700}

/* ---- kind chips ---- */
.kinds{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kchip{border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;background:#fff}
.kchip.on{border-color:var(--g);background:var(--g-l);font-weight:700}
.kbadge{display:inline-block;border-radius:7px;padding:2px 8px;font-size:12.5px;font-weight:700;
  background:var(--g-l);color:var(--g-d);white-space:nowrap}
.kbadge.rm{background:#dbeafe;color:#1d4ed8}
.kbadge.cost{background:#fef3c7;color:#92400e}

/* ---- handoff card ---- */
.hd-top{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.hd-title{font-weight:700;font-size:16.5px;margin:6px 0 2px}
.hd-body{font-size:14.5px;white-space:pre-wrap;margin:2px 0 8px}
.reach{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.rpill{font-size:12px;border-radius:999px;padding:3px 9px;background:#f3f4f6;color:#374151;border:1px solid var(--line)}
.rpill.full{background:var(--g-l);color:var(--g-d);border-color:#bbf7d0;font-weight:700}
.rpill.zero{background:#fef2f2;color:var(--red);border-color:#fecaca;font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{background:var(--g);color:#fff;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700}
.btn:active{background:var(--g-d)}
.btn.ghost{background:#fff;color:var(--g-d);border:1.5px solid var(--g)}
.btn.gray{background:#fff;color:#374151;border:1.5px solid var(--line)}
.btn.blue{background:var(--blue)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;pointer-events:none}
.sent{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--g-d);font-weight:700}

/* ---- cost box ---- */
.costbox{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px;margin:6px 0}
.costbox table{width:100%;border-collapse:collapse;font-size:14px}
.costbox td{padding:2px 0}
.costbox td:first-child{color:var(--sub);width:5.5em;font-size:13px}
.costbox b{font-size:17px}

/* ---- forms ---- */
.f{margin:8px 0}
.f label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:3px;font-weight:500}
.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:9px 10px;font-size:15px;background:#fff}
.f textarea{min-height:74px;resize:vertical}
.f2{display:flex;gap:8px}.f2>*{flex:1}
.deptpick{display:flex;flex-wrap:wrap;gap:6px}
.deptpick button{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;background:#fff}
.deptpick button.on{border-color:var(--g);background:var(--g-l);font-weight:700}

/* ---- photos ---- */
.pgrid{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pth{width:104px;height:78px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;z-index:90}
.lb img{max-width:94vw;max-height:88vh;border-radius:8px}

/* ---- board ---- */
.tag{font-size:12px;background:#f3f4f6;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:#374151}
.cmt{border-left:3px solid var(--line);padding:6px 0 6px 10px;margin:8px 0}
.cmt.best{border-left-color:var(--g);background:var(--g-bg);border-radius:0 8px 8px 0;padding-right:8px}
.who{font-size:12.5px;color:var(--sub);font-weight:500}
.newbadge{background:var(--red);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px;font-weight:700}

/* ---- nav ---- */
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 2px 8px;font-size:11px;color:var(--sub);position:relative;font-weight:500}
nav button .i{display:block;font-size:21px;line-height:1.15}
nav button.on{color:var(--g);font-weight:700}
nav .bn{position:absolute;top:4px;left:50%;margin-left:6px;background:var(--red);color:#fff;
  font-size:10px;border-radius:999px;padding:0 5px;font-weight:700;min-width:16px}
nav .bn.soft{background:#9ca3af}

/* ---- misc ---- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#111827;color:#fff;
  padding:11px 17px;border-radius:11px;font-size:14px;z-index:95;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#cfx{position:fixed;inset:0;pointer-events:none;z-index:99}
.demo{background:#fef3c7;border:1px solid #fde68a;border-radius:10px;padding:9px 12px;font-size:12.5px;
  color:#92400e;margin:12px 0}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:16px 8px}
.jump{cursor:pointer}
.row{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .ic{font-size:19px;line-height:1.3}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14.5px;font-weight:600}
</style>
</head>

<script>
/* =========================================================================

let LANG = localStorage.getItem('hsr_lang') || 'ja';
function L(k,...a){ let s=(I18N[LANG]&&I18N[LANG][k])||I18N.ja[k]||k;
  a.forEach((v,i)=>s=s.replace('{'+i+'}',v)); return s; }
/* 本文層：書いた人の言語で保存し、読む人の言語で表示する */
function tx(o,f){ if(!o) return ''; const t=o.i18n&&o.i18n[LANG]&&o.i18n[LANG][f]; return t||o[f]||''; }
function isRaw(o){ return LANG!=='ja' && !(o.i18n&&o.i18n[LANG]); }

/* ---------- 持ち場 ---------- */
const DEPTS = [
  {key:'office',   ic:'🏢', ja:'事務所', en:'Office',   zh:'办公室', vi:'Văn phòng'},
  {key:'picking',  ic:'📦', ja:'倉庫',   en:'Warehouse',zh:'仓库',   vi:'Kho'},
  {key:'delivery', ic:'🚚', ja:'配送',   en:'Delivery', zh:'配送',   vi:'Giao hàng'},
  {key:'sales',    ic:'🤝', ja:'営業',   en:'Sales',    zh:'销售',   vi:'Kinh doanh'}
];
const dept = k => DEPTS.find(d=>d.key===k) || {ic:'•',ja:k,en:k,zh:k,vi:k};
const deptName = k => dept(k)[LANG] || dept(k).ja;

/* ---------- 申し送りの型（10種）---------- */

/* ---------- ダミー写真（実写は載せない） ---------- */
function PH(label,hue){
  const s=`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240">
  <rect width="320" height="240" fill="hsl(${hue},42%,86%)"/>
  <circle cx="160" cy="100" r="46" fill="hsl(${hue},40%,70%)"/>
  <text x="160" y="107" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle">${label}</text>
  <text x="160" y="205" font-family="sans-serif" font-size="13" fill="hsl(${hue},30%,40%)" text-anchor="middle">DUMMY PHOTO</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(s);
}

/* ---------- state ---------- */
let S, ME='m5', TAB='home', NEWK='shortage', NEWTO=[], NEWPH=[], SHOWFORM=false,
    DATE=TODAY, KFILT='', RMF='', HILITE=null, HL_T=null, REPLY={}, CELEBRATE=false;
/* KFILT=種別フィルタ／RMF=RoutMe送信状況フィルタ（''|'sent'|'pending'）。
   ★この2つは排他。片方を立てたらもう片方を落とす（両方かかると0件になって迷子になる） */

function load(){
  try{ const r=localStorage.getItem(LS_KEY); if(r){ S=JSON.parse(r); return; } }catch(e){}
  S=seed(); save();
}
function save(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }
  catch(e){ toast('写真が大きすぎて保存できませんでした'); }
}
const me   = () => S.members.find(m=>m.id===ME) || S.members[0];
const mem  = id => S.members.find(m=>m.id===id) || {name:'?',dept:'office'};
const inTo = h => h.to.includes(me().dept) || h.by===ME;

/* ---------- 既読・到達 ---------- */
function readState(h,id){ return (S.reads[h.id]||{})[id||ME] || {}; }
function markRead(h){
  if(h.by===ME) return;
  S.reads[h.id]=S.reads[h.id]||{};
  if(!S.reads[h.id][ME]) { S.reads[h.id][ME]={read:true}; save(); }
}
function markHandled(h){
  S.reads[h.id]=S.reads[h.id]||{}; S.reads[h.id][ME]=S.reads[h.id][ME]||{};
  S.reads[h.id][ME].read=true; S.reads[h.id][ME].handled=true; save(); render();
}
/* 持ち場ごとの到達＝その持ち場の何人中何人が読んだか */
function reachByDept(h){
  return h.to.map(dk=>{
    const ppl=S.members.filter(m=>m.dept===dk && m.id!==h.by);
    const n=ppl.filter(m=>readState(h,m.id).read).length;
    return {dk,n,t:ppl.length};
  });
}
const unreadFor = () => S.handoffs.filter(h=>h.date===DATE && inTo(h) && h.by!==ME && !readState(h).read);

/* ---------- 相談：自分が返す番か ---------- */
function boardTodo(p){
  if(p.solved || p.by===ME) return false;
  if(!(p.to.includes(me().dept))) return false;
  return !p.comments.some(c=>c.by===ME);      /* 自分がまだ1件も返していない */
}
const toReplyList = () => S.board.filter(boardTodo);

/* ---------- RoutMe（デモ）---------- */
const rmEligible = h => !!kind(h.kind).rm;
const rmPending  = () => S.handoffs.filter(h=>h.date===DATE && rmEligible(h) && h.rm==='pending');
const rmSent     = () => S.handoffs.filter(h=>h.date===DATE && rmEligible(h) && h.rm==='sent');
function sendToRoutMe(h){
  h.rm='sent'; h.rmAt=new Date().toISOString(); save();
  toast('RoutMeへ送りました → '+kind(h.kind).rm);
  render();
}

/* ---------- キャッチアップ ---------- */
function counts(){
  const u=unreadFor().length, r=toReplyList().length, p=rmPending().length;
  return {u,r,p,total:u+r};
}

/* =========================== 描画 =========================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),2400); }

function photoGrid(ps){
  if(!ps||!ps.length) return '';
  return '<div class="pgrid">'+ps.map(p=>`<img class="pth" src="${p}" data-lb="${p}" alt="">`).join('')+'</div>';
}

function head(){
  document.getElementById('logo').innerHTML =
    esc(APP_NAME[LANG]||APP_NAME.ja)+'<small>'+esc(APP_TAG[LANG]||APP_TAG.ja)+'</small>';
  document.getElementById('actorLbl').textContent = LANG==='ja'?'操作者':'View as';
  const sel=document.getElementById('actorSel');
  sel.innerHTML=S.members.map(m=>
    `<option value="${m.id}"${m.id===ME?' selected':''}>${esc(m.name)}</option>`).join('');
  document.getElementById('actorDept').textContent = dept(me().dept).ic+' '+deptName(me().dept);
}

function nav(){
  const c=counts();
  const items=[['home','🏠',L('home'),0],['hand','📣',L('hand'),c.u],
               ['board','💬',L('board'),c.r],['share','📚',L('share'),0]];
  document.getElementById('nav').innerHTML=items.map(([k,i,lb,n])=>
    `<button data-tab="${k}" class="${TAB===k?'on':''}"><span class="i">${i}</span>${esc(lb)}${
      n?`<span class="bn">${n}</span>`:''}</button>`).join('');
}

/* ---------- ホーム ---------- */
function viewHome(){
  const c=counts(), st=S.streaks[ME]||{days:0,best:0};
  let h='';
  if(c.total===0){
    h+=`<div class="hero done"><p class="n">${esc(L('done'))}</p><p class="p">${esc(L('doneSub'))}</p>`;
    if(st.days) h+=`<div class="streak">${esc(L('streak',st.days+1))} ・ ${esc(L('streakBest',Math.max(st.best,st.days+1)))}</div>`;
    h+='</div>';
  }else{
    h+=`<div class="hero"><p class="n">${esc(L('catch',c.total))}</p>
        <p class="p">${esc(L('unread'))} ${c.u} ・ ${esc(L('toReply'))} ${c.r}</p>`;
    if(st.days) h+=`<div class="streak">${esc(L('streakLeft',st.days+1,c.total))}</div>`;
    h+='</div>';
  }

  /* ★卸版固有：RoutMeへ届いているか。押すと申し送りタブの該当一覧へ飛ぶ
     （数字が押せそうに見えて押せない、を避ける）
     SHOW_ROUTME=false のあいだは丸ごと出さない */
  if(SHOW_ROUTME) h+=`<div class="rm">
      <div class="b ok" data-rmf="sent"><b>${rmSent().length}</b><span>${esc(L('rmSent'))}</span></div>
      <div class="b ${rmPending().length?'warn':''}" data-rmf="pending"><b>${rmPending().length}</b><span>${esc(L('rmPend'))}</span></div>
    </div>`;
  if(SHOW_ROUTME && rmPending().length){
    h+=`<div class="card acc"><div class="muted" style="margin-bottom:6px">⚠ ${esc(L('rmPend'))}</div>`;
    h+=rmPending().map(x=>`<div class="row jump" data-go="hand" data-hi="${x.id}">
        <span class="ic">${kind(x.kind).ic}</span><span class="tx"><b>${esc(tx(x,'title'))}</b>
        <span class="tiny">${esc(kindName(x.kind))} → ${esc(kind(x.kind).rm)}</span></span></div>`).join('');
    h+='</div>';
  }

  h+=`<h2 class="sec">📣 ${esc(L('unread'))}</h2><div class="card">`;
  const un=unreadFor();
  h+= un.length ? un.map(x=>`<div class="row jump" data-go="hand" data-hi="${x.id}">
        <span class="ic">${kind(x.kind).ic}</span><span class="tx"><b>${esc(tx(x,'title'))}</b>
        <span class="tiny">${esc(mem(x.by).name)} ・ ${esc(kindName(x.kind))}</span></span>
        <span class="newbadge">NEW</span></div>`).join('')
    : `<div class="empty">${esc(L('noUnread'))}</div>`;
  h+='</div>';

  h+=`<h2 class="sec">💬 ${esc(L('toReply'))}</h2><div class="card${toReplyList().length?' tome':''}">`;
  const tr=toReplyList();
  h+= tr.length ? tr.map(p=>`<div class="row jump" data-go="board" data-hi="${p.id}">
        <span class="ic">💬</span><span class="tx"><b>${esc(tx(p,'title'))}</b>
        <span class="tiny">${esc(mem(p.by).name)} ・ ${dept(mem(p.by).dept).ic} ${esc(deptName(mem(p.by).dept))}</span></span></div>`).join('')
    : `<div class="empty">${esc(L('noReply'))}</div>`;
  h+='</div>';

  h+=`<div class="demo">${esc(L('dummy'))}</div>`;
  return h;
}

  return `<div class="costbox"><table>
    <tr><td>${esc(L('item'))}</td><td><b>${esc(c.item)}</b></td></tr>
    <tr><td>${esc(L('qty'))}</td><td>${esc(c.qty)}</td></tr>
    <tr><td>${esc(L('price'))}</td><td><b>¥${Number(c.price).toLocaleString()}</b></td></tr>
    <tr><td>${esc(L('supplier'))}</td><td>${esc(c.supplier)}</td></tr>
  </table></div>`;
}

function handoffCard(x){
  const k=kind(x.kind), rs=readState(x), mine=x.by===ME;
  let h=`<div class="card acc${HILITE===x.id?' hi':''}" id="hd-${x.id}">
    <div class="hd-top">
      <span class="kbadge ${k.cost?'cost':(k.rm?'rm':'')}">${k.ic} ${esc(kindName(x.kind))}</span>
      <span class="tiny">${esc(mem(x.by).name)} ・ ${dept(mem(x.by).dept).ic} ${esc(deptName(mem(x.by).dept))}</span>
      ${isRaw(x)?'<span class="tag">原文のまま</span>':''}
    </div>
    <div class="hd-title">${esc(tx(x,'title'))}</div>
    <div class="hd-body">${esc(tx(x,'body'))}</div>`;
  if(x.cost) h+=costBox(x.cost);
  h+=photoGrid(x.photos);

  h+=`<div class="reach"><span class="tiny" style="align-self:center">${esc(L('reach'))}:</span>`;
  h+=reachByDept(x).map(r=>`<span class="rpill ${r.n===r.t&&r.t?'full':(r.n?'':'zero')}">${
      dept(r.dk).ic} ${esc(deptName(r.dk))} ${r.n}/${r.t}</span>`).join('');
  h+='</div>';

  h+='<div class="acts">';
  if(!mine){
    h+= rs.handled ? `<span class="sent">✓ ${esc(L('handledDone'))}</span>`
       : `<button class="btn sm ghost" data-handled="${x.id}">${esc(L('handled'))}</button>`;
  }
  if(SHOW_ROUTME && k.rm){
    h+= x.rm==='sent'
      ? `<span class="sent">🚚 ${esc(L('sent'))}</span>`
      : `<button class="btn sm blue" data-rm="${x.id}">🚚 ${esc(L('sendRm'))}</button>`;
    h+=`<div class="tiny" style="flex-basis:100%">→ ${esc(k.rm)}</div>`;
  }
  h+='</div></div>';
  return h;
}

function viewHand(){
  let h=`<div style="display:flex;gap:8px;margin:12px 0">
    <button class="kchip ${DATE===TODAY?'on':''}" data-date="${TODAY}">${esc(L('today'))}</button>
    <button class="kchip ${DATE===YEST?'on':''}" data-date="${YEST}">${esc(L('yest'))}</button>
    <span style="flex:1"></span>
    <button class="btn sm" data-form="1">＋ ${esc(L('post'))}</button>
  </div>`;

  if(SHOWFORM) h+=formHand();

  /* RoutMe送信状況で絞り込み中は、外せる帯を出す（何で絞られているか分からない状態を作らない） */
  if(RMF) h+=`<div class="rmfilter"><span>🚚 ${esc(L(RMF==='sent'?'onlySent':'onlyPending'))}</span>
      <button data-rmf="">✕ ${esc(L('clearFilter'))}</button></div>`;

  h+='<div class="kinds">';
  h+=`<button class="kchip ${KFILT===''&&!RMF?'on':''}" data-kf="">${LANG==='ja'?'すべて':'All'}</button>`;
  KINDS.forEach(k=>{ h+=`<button class="kchip ${KFILT===k.k?'on':''}" data-kf="${k.k}">${k.ic} ${esc(kindName(k.k))}</button>`; });
  h+='</div>';

  const list=S.handoffs.filter(x=>
      x.date===DATE
      && (!KFILT || x.kind===KFILT)
      && (!RMF   || (rmEligible(x) && x.rm===RMF)));
  h+= list.length ? list.map(handoffCard).join('') : `<div class="empty">${esc(L('noItems'))}</div>`;
  return h;
}

function formHand(){
  const k=kind(NEWK);
  let h=`<div class="card"><div class="f"><label>${esc(L('kind'))}</label><div class="kinds">`;
  KINDS.forEach(x=>{ h+=`<button class="kchip ${NEWK===x.k?'on':''}" data-nk="${x.k}">${x.ic} ${esc(kindName(x.k))}</button>`; });
  h+='</div></div>';

  h+=`<div class="f"><label>${esc(L('to'))}</label><div class="deptpick">`;
  DEPTS.forEach(d=>{ h+=`<button class="${NEWTO.includes(d.key)?'on':''}" data-nto="${d.key}">${d.ic} ${esc(deptName(d.key))}</button>`; });
  h+='</div></div>';

  if(k.cost){
    /* ★自由記述にしない。cost_snapshots に落とせる4欄に切る */
    h+=`<div class="tiny" style="margin:4px 0 8px">${esc(L('costHint'))}</div>
      <div class="f2">
        <div class="f"><label>${esc(L('item'))}</label>
          <input id="cItem" list="itemList" placeholder="大葉"><datalist id="itemList">${
            S.items.map(i=>`<option value="${esc(i)}">`).join('')}</datalist></div>
        <div class="f"><label>${esc(L('qty'))}</label><input id="cQty" placeholder="1ケース"></div>
      </div>
      <div class="f2">
        <div class="f"><label>${esc(L('price'))}</label><input id="cPrice" type="number" inputmode="numeric" placeholder="4200"></div>
        <div class="f"><label>${esc(L('supplier'))}</label>
          <input id="cSup" list="supList"><datalist id="supList">${
            S.suppliers.map(i=>`<option value="${esc(i)}">`).join('')}</datalist></div>
      </div>`;
  }

  h+=`<div class="f"><label>${esc(L('title'))}</label><input id="nTitle"></div>
      <div class="f"><label>${esc(L('body'))}</label><textarea id="nBody"></textarea></div>`;
  h+=photoGrid(NEWPH);
  h+=`<div class="acts">
      <button class="btn" data-submit="1">${esc(L('send'))}</button>
      <button class="btn gray" data-photo="1">📷 ${esc(L('addPhoto'))}</button>
      <button class="btn gray" data-form="0">${esc(L('cancel'))}</button>
    </div></div>`;
  return h;
}

/* ---------- 相談 ---------- */
function boardCard(p){
  const isNew=boardTodo(p);
  let h=`<div class="card${isNew?' tome':''}${HILITE===p.id?' hi':''}" id="bd-${p.id}">
    <div class="hd-top">
      <span class="kbadge">${p.solved?'✅ '+esc(L('solved')):'💬 '+(LANG==='ja'?'未解決':'Open')}</span>
      ${p.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}
      ${isNew?`<span class="newbadge">${LANG==='ja'?'あなたの番':'Your turn'}</span>`:''}
    </div>
    <div class="hd-title">${esc(tx(p,'title'))}</div>
    <div class="tiny">${esc(mem(p.by).name)} ・ ${dept(mem(p.by).dept).ic} ${esc(deptName(mem(p.by).dept))}</div>
    <div class="hd-body">${esc(tx(p,'body'))}</div>`;

  p.comments.forEach(c=>{
    const best=p.best===c.id;
    h+=`<div class="cmt${best?' best':''}">
      <div class="who">${esc(mem(c.by).name)} ・ ${dept(mem(c.by).dept).ic} ${esc(deptName(mem(c.by).dept))}
      ${best?`<span class="kbadge">⭐ ${esc(L('best'))}</span>`:''}</div>
      <div>${esc(tx(c,'body'))}</div>${photoGrid(c.photos)}`;
    if(!best && p.solved) h+=`<button class="btn sm gray" data-best="${p.id}|${c.id}">⭐ ${esc(L('best'))}</button>`;
    h+='</div>';
  });

  h+='<div class="acts">';
  if(!p.solved) h+=`<button class="btn sm ghost" data-solve="${p.id}">✅ ${esc(L('solved'))}</button>`;
  h+=`<button class="btn sm gray" data-rep="${p.id}">↩ ${esc(L('reply'))}</button>`;

  /* ★昇格先は共有タブではなく RoutMe の店舗マスタ */
  if(p.solved && p.best && !p.promoted)
    h+=`<button class="btn sm blue" data-promote="${p.id}">${SHOW_ROUTME?'📍':'📚'} ${
        esc(L(SHOW_ROUTME?'promote':'promote2'))}</button>`;
  if(p.promoted)
    h+=`<span class="sent">${SHOW_ROUTME?'📍':'📚'} ${esc(L(SHOW_ROUTME?'promoted':'promoted2'))}${
        SHOW_ROUTME?' → '+esc(p.promoted.field):''}</span>`;
  h+='</div>';

  if(REPLY[p.id]){
    h+=`<div class="f"><textarea id="rep-${p.id}" placeholder="${esc(L('replyPh'))}"></textarea></div>
      <div class="tiny">${esc(L('quick'))}</div><div class="kinds">`;
    ['了解しました','確認します','代替でOKです','うちでは無理です'].forEach(q=>{
      h+=`<button class="kchip" data-quick="${p.id}|${esc(q)}">${esc(q)}</button>`; });
    h+=`</div><div class="acts"><button class="btn sm" data-dorep="${p.id}">${esc(L('send'))}</button></div>`;
  }
  h+='</div>';
  return h;
}
function viewBoard(){
  return S.board.length ? S.board.map(boardCard).join('') : `<div class="empty">${esc(L('noItems'))}</div>`;
}

/* ---------- 共有 ---------- */
function viewShare(){
  return S.shares.map(s=>`<div class="card acc">
    <div class="hd-top"><span class="kbadge">${esc(s.cat)}</span>
      ${s.origin==='promoted'?'<span class="tag">💬 相談から</span>':''}
      ${SHOW_ROUTME&&s.routme?`<span class="tag">📍 RoutMe ${esc(s.routme.field)}</span>`:''}</div>
    <div class="hd-title">${esc(tx(s,'title'))}</div>
    <div class="hd-body">${esc(tx(s,'body'))}</div>
    ${SHOW_ROUTME&&s.routme?`<div class="tiny">→ ${esc(s.routme.store)} の ${esc(s.routme.field)} に登録済み。翌朝ドライバーの画面に出ます。</div>`:''}
  </div>`).join('');
}

/* ---------- render ---------- */
function render(){
  head(); nav();
  const app=document.getElementById('app');
  app.innerHTML = TAB==='home'?viewHome() : TAB==='hand'?viewHand()
                : TAB==='board'?viewBoard() : viewShare();
  bind();
  if(HILITE){
    const el=document.getElementById('hd-'+HILITE)||document.getElementById('bd-'+HILITE);
    if(el){
      scrollToCard(el);
      /* ★オレンジ枠を自動で解除する（放置するとナビを押すまで残り続ける）。
         再描画するとスクロール位置が飛ぶので、class を直接外す */
      clearTimeout(HL_T);
      HL_T=setTimeout(()=>{ HILITE=null; el.classList.remove('hi'); },3200);
    }else{
      /* 飛び先が無い＝フィルタ等で消えている。黙って迷子にせず知らせる */
      HILITE=null; toast(L('notFound'));
    }
  }
  /* 開いたら既読。その画面ではNEWが見えたまま残り、次に開くと消えている */
  if(TAB==='hand') setTimeout(()=>{ S.handoffs.filter(x=>x.date===DATE&&inTo(x)).forEach(markRead); },350);
  if(CELEBRATE){ CELEBRATE=false; confetti(); }
}

/* ジャンプ先へスクロールする
   ⚠ scrollIntoView({behavior:'smooth'}) は環境によって黙って何もしないことがある
     （実測：このデモの検証ブラウザでは完全に無視され、押しても画面が動かなかった）。
     なので「smoothを試す → 動いていなければ即時で確定させる」の二段にしてある。
   ⚠ 120px は sticky ヘッダー(62px)＋操作者バー(42px)ぶんの逃げ。CSSの
     .card{scroll-margin-top:120px} と同じ値なので、変えるときは両方直すこと。 */
function scrollToCard(el){
  const y=Math.max(0, window.scrollY + el.getBoundingClientRect().top - 120);
  try{ window.scrollTo({top:y,behavior:'smooth'}); }catch(e){}
  setTimeout(()=>{ if(Math.abs(window.scrollY-y)>8) window.scrollTo(0,y); },420);
}

/* ---------- events ---------- */
function bind(){
  const app=document.getElementById('app');
  app.querySelectorAll('[data-lb]').forEach(el=>el.onclick=()=>lightbox(el.dataset.lb));
  /* ★ジャンプ：飛び先が確実に見えている状態を作ってから飛ぶ。
     絞り込みが残ったまま飛ぶと、押した項目が飛び先に存在せず「何もないところ」に着地する */
  app.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{
    TAB=el.dataset.go;
    HILITE=el.dataset.hi||null;
    KFILT=''; RMF=''; SHOWFORM=false;          // 絞り込みを外す
    if(HILITE){                                 // 別の日の項目でも飛べるように日付を合わせる
      const h=S.handoffs.find(x=>x.id===HILITE);
      if(h) DATE=h.date;
    }
    render(); });
  app.querySelectorAll('[data-date]').forEach(el=>el.onclick=()=>{ DATE=el.dataset.date; HILITE=null; render(); });
  /* 種別フィルタとRoutMeフィルタは排他（両方かかると0件で迷子になる） */
  app.querySelectorAll('[data-kf]').forEach(el=>el.onclick=()=>{ KFILT=el.dataset.kf; RMF=''; render(); });
  app.querySelectorAll('[data-rmf]').forEach(el=>el.onclick=()=>{
    RMF=el.dataset.rmf; KFILT=''; SHOWFORM=false; HILITE=null; TAB='hand'; render(); });
  app.querySelectorAll('[data-nk]').forEach(el=>el.onclick=()=>{ NEWK=el.dataset.nk; render(); });
  app.querySelectorAll('[data-nto]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.nto; const i=NEWTO.indexOf(k);
    if(i<0) NEWTO.push(k); else NEWTO.splice(i,1); render(); });
  app.querySelectorAll('[data-form]').forEach(el=>el.onclick=()=>{
    SHOWFORM=el.dataset.form==='1'; if(SHOWFORM&&!NEWTO.length) NEWTO=['office','picking','delivery'];
    render(); });
  app.querySelectorAll('[data-photo]').forEach(el=>el.onclick=()=>{
    NEWPH.push(PH('現物',Math.floor(Math.random()*360))); render(); toast('写真を足しました（デモ用ダミー）'); });
  app.querySelectorAll('[data-submit]').forEach(el=>el.onclick=submitHand);
  app.querySelectorAll('[data-handled]').forEach(el=>el.onclick=()=>{
    const h=S.handoffs.find(x=>x.id===el.dataset.handled); markHandled(h); checkClear(); });
  app.querySelectorAll('[data-rm]').forEach(el=>el.onclick=()=>
    sendToRoutMe(S.handoffs.find(x=>x.id===el.dataset.rm)));
  app.querySelectorAll('[data-solve]').forEach(el=>el.onclick=()=>{
    S.board.find(p=>p.id===el.dataset.solve).solved=true; save(); render(); });
  app.querySelectorAll('[data-best]').forEach(el=>el.onclick=()=>{
    const [pid,cid]=el.dataset.best.split('|');
    S.board.find(p=>p.id===pid).best=cid; save(); render(); toast('ベストアンサーにしました'); });
  app.querySelectorAll('[data-rep]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.rep; REPLY[id]=!REPLY[id]; render(); });
  app.querySelectorAll('[data-quick]').forEach(el=>el.onclick=()=>{
    const [pid,q]=el.dataset.quick.split('|'); addComment(pid,q); });
  app.querySelectorAll('[data-dorep]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.dorep, v=(document.getElementById('rep-'+id)||{}).value;
    if(!v||!v.trim()){ toast('返信を入れてください'); return; } addComment(id,v.trim()); });
  app.querySelectorAll('[data-promote]').forEach(el=>el.onclick=()=>promote(el.dataset.promote));

  document.getElementById('actorSel').onchange=e=>{ ME=e.target.value; HILITE=null; render(); };
  document.getElementById('langBtn').onclick=cycleLang;
  document.getElementById('nav').querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{
    TAB=el.dataset.tab; HILITE=null; SHOWFORM=false; render(); });
}

function submitHand(){
  const t=(document.getElementById('nTitle')||{}).value||'';
  if(!t.trim()){ toast('ひとことを入れてください'); return; }
  if(!NEWTO.length){ toast('誰に届けるか選んでください'); return; }
  const k=kind(NEWK);
  const o={ id:'h'+(S.handoffs.length+1+Date.now()%1000), date:DATE, kind:NEWK, by:ME,
            to:NEWTO.slice(), title:t.trim(),
            body:((document.getElementById('nBody')||{}).value||'').trim(),
            photos:NEWPH.slice(), rm:k.rm?'pending':'none' };
  if(k.cost){
    const it=(document.getElementById('cItem')||{}).value||'';
    const pr=(document.getElementById('cPrice')||{}).value||'';
    if(!it.trim()||!pr){ toast('品名と単価を入れてください'); return; }
    o.cost={ item:it.trim(), qty:((document.getElementById('cQty')||{}).value||'').trim(),
             price:Number(pr), supplier:((document.getElementById('cSup')||{}).value||'').trim() };
    if(!S.items.includes(o.cost.item)) S.items.push(o.cost.item);
    if(o.cost.supplier && !S.suppliers.includes(o.cost.supplier)) S.suppliers.push(o.cost.supplier);
  }
  S.handoffs.unshift(o); NEWPH=[]; SHOWFORM=false; save();
  toast(k.cost?'仕入値を共有しました（cost_snapshots へ）':'申し送りを出しました');
  render();
}

function addComment(pid,body){
  const p=S.board.find(x=>x.id===pid);
  p.comments.push({id:'c'+Date.now(),by:ME,body:body});
  REPLY[pid]=false; save(); toast('返信しました'); checkClear(); render();
}

/* ★昇格先＝RoutMeの店舗マスタ（entry_note / parking_note / absent_note …）
   ここが飲食版デシャボとの一番の差。答えが「読み物」ではなく
   翌朝ドライバーの /today/[id] に出る「実行」に着地する。 */
const RM_FIELDS = [
  {f:'entry_note',      re:/裏口|入り|搬入|入口|エレベータ/, ja:'入り方',   en:'entry',   zh:'进入方式', vi:'lối vào'},
  {f:'parking_note',    re:/駐車|パーキング|停め/,           ja:'駐車',     en:'parking', zh:'停车',     vi:'chỗ đỗ'},
  {f:'absent_note',     re:/不在|留守|閉ま/,                 ja:'不在時',   en:'absence', zh:'不在时',   vi:'khi vắng'},
  {f:'collection_note', re:/回収|返品|空箱|コンテナ/,        ja:'回収物',   en:'pickup',  zh:'回收物',   vi:'thu hồi'},
  {f:'cargo_note',      re:/.*/,                             ja:'積み込み', en:'loading', zh:'装车',     vi:'xếp hàng'}
];
function promote(pid){
  const p=S.board.find(x=>x.id===pid);
  const best=p.comments.find(c=>c.id===p.best);
  const t=p.title||'';
  const fd=RM_FIELDS.find(x=>x.re.test(t)) || RM_FIELDS[RM_FIELDS.length-1];
  const store=(t.match(/[ぁ-んァ-ヶ一-龠A-Za-z]+(?:店|カフェ|ビストロ|ベーカリー|Cafe)[ぁ-んァ-ヶ一-龠]*/)||[])[0]
             || (t.split(/[、,]/)[0]||'').slice(0,12);
  p.promoted={field:fd.f,store};
  /* ★タイトルは相談文（疑問形）のままにしない。店舗メモの見出しとして整える */
  const mk=lg=>({ title: lg==='ja' ? `${store}の${fd.ja}`
                : lg==='en' ? `${store} — ${fd.en}`
                : lg==='zh' ? `${store} 的${fd.zh}` : `${fd.vi} — ${store}` });
  const src=best||p;
  S.shares.unshift({ id:'s'+Date.now(), cat:'取引先ルール',
    title:mk('ja').title, body:src.body||'',
    i18n:{ en:Object.assign(mk('en'),{body:tx2(src,'body','en')}),
           zh:Object.assign(mk('zh'),{body:tx2(src,'body','zh')}),
           vi:Object.assign(mk('vi'),{body:tx2(src,'body','vi')}) },
    origin:'promoted', src:{postId:pid}, routme:{field:fd.f,store} });
  save(); toast(SHOW_ROUTME ? 'RoutMeの '+store+' の '+fd.f+' に登録しました'
                             : '「'+store+'の'+fd.ja+'」として共有に残しました');
  TAB='share'; HILITE=null; render();
}
/* 指定言語の訳を取り出す（無ければ原文＝日本語のまま引き継ぐ） */
function tx2(o,f,lg){ return (o.i18n&&o.i18n[lg]&&o.i18n[lg][f]) || o[f] || ''; }

function checkClear(){ if(counts().total===0) CELEBRATE=true; }

function cycleLang(){
  const i=LANGS.findIndex(l=>l[0]===LANG);
  LANG=LANGS[(i+1)%LANGS.length][0];
  localStorage.setItem('hsr_lang',LANG);
  document.documentElement.lang=LANG;
  toast(LANGS.find(l=>l[0]===LANG)[1]);
  render();
}

function lightbox(src){
  const d=document.createElement('div'); d.className='lb';
  d.innerHTML=`<img src="${src}" alt="">`;
  d.onclick=()=>d.remove();
  document.addEventListener('keydown',function k(e){ if(e.key==='Escape'){ d.remove(); document.removeEventListener('keydown',k);} });
  document.body.appendChild(d);
}

/* 紙吹雪（外部ライブラリなし） */
function confetti(){
  const cv=document.getElementById('cfx'), ctx=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#16a34a','#4ade80','#facc15','#60a5fa','#f472b6'];
  const ps=Array.from({length:130},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,
    r:4+Math.random()*5,vy:2+Math.random()*3,vx:-1+Math.random()*2,
    c:cols[Math.floor(Math.random()*cols.length)],a:1}));
  let t=0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height); t++;
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; if(t>150) p.a-=.02;
      ctx.globalAlpha=Math.max(p.a,0); ctx.fillStyle=p.c;
      ctx.fillRect(p.x,p.y,p.r,p.r*1.6); });
    if(t<230) requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ---------- 起動 ---------- */
load();
document.documentElement.lang=LANG;
render();
window.__hsr = { reset(){ localStorage.removeItem(LS_KEY); location.reload(); }, S:()=>S };
