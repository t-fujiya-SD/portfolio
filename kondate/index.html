  $('#shBody').querySelectorAll('#rfProt button').forEach(b=>b.onclick=()=>{
    draft.protein = b.dataset.p;
    $('#shBody').querySelectorAll('#rfProt button').forEach(x=>x.classList.toggle('on', x.dataset.p===draft.protein));
  });
  const ai = $('#rfAdd');
  const addIng = ()=>{
    const v = ai.value.trim(); if(!v) return;
    if(!draft.ings.some(i=>i.name===v)) draft.ings.push({name:v, cat:classify(v).cat});
    ai.value=''; drawChips();
  };
  $('#rfAddBtn').onclick = addIng;
  ai.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); addIng(); } };

  $('#rfSave').onclick = saveRecipeDraft;
  const dl = $('#rfDel');
  if(dl) dl.onclick = ()=>{
    if(!confirm('このレシピを削除しますか？')) return;
    S.recipes = S.recipes.filter(r=>r.id!==draft.id);
    Object.values(S.weeks).forEach(w=>DAYS.forEach(d=>{
      if(w.days[d.k].mainId===draft.id) w.days[d.k].mainId=null;
      w.days[d.k].sideIds = (w.days[d.k].sideIds||[]).filter(id=>id!==draft.id);
    }));
    Object.values(S.settings.dayRules||{}).forEach(rule=>{
      if(rule.ids) rule.ids = rule.ids.filter(id=>id!==draft.id);
    });
    save(); closeSheet(); render(); toast('削除しました');
  };
}

function drawChips(){
  const ig = $('#rfIngs'), sg = $('#rfSeas');
  ig.innerHTML = draft.ings.length ? draft.ings.map((i,idx)=>
    '<span class="chip"><button class="cat" data-cyc="'+idx+'">'+catIc(i.cat)+'</button>'+esc(i.name)+
    '<button class="x" data-rm="'+idx+'">✕</button></span>').join('')
    : '<span class="tiny">なし</span>';
  sg.innerHTML = draft.seasonings.length ? draft.seasonings.map((s,idx)=>
    '<button class="chip seas" data-toing="'+idx+'">🧂 '+esc(s)+'</button>').join('')
    : '<span class="tiny">なし</span>';

  ig.querySelectorAll('[data-cyc]').forEach(b=>b.onclick=()=>{
    const i = draft.ings[+b.dataset.cyc];
    const ks = CATS.map(c=>c.k);
    i.cat = ks[(ks.indexOf(i.cat)+1) % ks.length];
    drawChips(); toast(catNm(i.cat));
  });
  ig.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    draft.ings.splice(+b.dataset.rm,1); drawChips();
  });
  sg.querySelectorAll('[data-toing]').forEach(b=>b.onclick=()=>{
    const nm = draft.seasonings.splice(+b.dataset.toing,1)[0];
    if(!draft.ings.some(i=>i.name===nm)) draft.ings.push({name:nm, cat:classify(nm).cat==='other'?'other':classify(nm).cat});
    drawChips();
  });
}

function saveRecipeDraft(){
  const nm = $('#rfName').value.trim();
  if(!nm){ toast('料理名を入れてください'); $('#rfName').focus(); return; }
  const minRaw = parseInt($('#rfMin').value,10);
  const payload = {
    name:nm,
    kind:draft.kind||'main',
    protein:draft.protein,
    minutes: (minRaw>0 && minRaw<600) ? minRaw : null,
    ings: draft.ings.map(i=>({name:i.name, cat:i.cat})),
    seasonings: draft.seasonings.slice()
  };
  let rid = draft.id;
  if(rid){
    Object.assign(recipeById(rid), payload);
  }else{
    rid = uid();
    S.recipes.push(Object.assign({id:rid, lastCooked:null, cookCount:0,
      ratingSum:0, ratingCount:0, archived:false}, payload));
  }
  assignRecipeToDay(rid, payload.kind==='side' ? null : (draft.day||null));
  save(); closeSheet(); render(); toast('保存しました');
}

/* ---------- 常備品の編集 ---------- */
function openStapleEdit(id){
  const st = id ? S.staples.find(x=>x.id===id) : null;
  const d = st || {name:'', cat:'daily', cycleDays:14, lastBought:null, enabled:true};
  const body =
    '<label class="lb">名前</label><input class="f" id="sfName" value="'+esc(d.name)+'" placeholder="例）紙オムツ">'+
    '<label class="lb">売り場カテゴリ</label><select class="f" id="sfCat">'+
      CATS.map(c=>'<option value="'+c.k+'"'+(d.cat===c.k?' selected':'')+'>'+c.ic+' '+c.nm+'</option>').join('')+'</select>'+
    '<label class="lb">目安サイクル（何日でなくなるか）</label>'+
    '<input class="f" id="sfCyc" type="number" inputmode="numeric" min="1" max="365" value="'+(d.cycleDays||14)+'">'+
    '<div class="tiny" style="margin-top:5px">正確でなくて大丈夫です。「買った」を2〜3回押すと、実際の間隔から自動で補正されます。</div>'+
    '<label class="lb">最後に買った日</label>'+
    '<input class="f" id="sfDate" type="date" value="'+(d.lastBought||'')+'">'+
    '<label class="lb" style="margin-bottom:8px">この品目を使う</label>'+
    '<div class="seg" id="sfEn">'+
      '<button data-en="1" class="'+(d.enabled!==false?'on':'')+'">有効</button>'+
      '<button data-en="0" class="'+(d.enabled===false?'on':'')+'">停止（リストに出さない）</button></div>'+
    (st && st.history && st.history.length ? '<div class="tiny" style="margin-top:12px">購入履歴：'+
      st.history.concat([st.lastBought]).filter(Boolean).map(x=>md(parseISO(x))).join(' → ')+'</div>' : '')+
    '<div style="height:10px"></div>';
  sheet(st?'常備品を編集':'常備品を追加', body,
    (st?'<button class="btn sub" id="sfDel" style="flex:none;padding:12px 15px;color:var(--r)">削除</button>':'')+
    '<button class="btn" id="sfSave">保存</button>');

  let en = d.enabled!==false;
  $('#shBody').querySelectorAll('#sfEn button').forEach(b=>b.onclick=()=>{
    en = b.dataset.en==='1';
    $('#shBody').querySelectorAll('#sfEn button').forEach(x=>x.classList.toggle('on',(x.dataset.en==='1')===en));
  });
  $('#sfSave').onclick = ()=>{
    const nm = $('#sfName').value.trim();
    if(!nm){ toast('名前を入れてください'); return; }
    const cyc = Math.max(1, Math.min(365, parseInt($('#sfCyc').value,10)||14));
    const dt  = $('#sfDate').value || null;
    if(st){ Object.assign(st,{name:nm, cat:$('#sfCat').value, cycleDays:cyc, lastBought:dt, enabled:en, snoozeUntil:null}); }
    else { S.staples.push({id:uid(), name:nm, cat:$('#sfCat').value, cycleDays:cyc, lastBought:dt,
                           history:[], snoozeUntil:null, enabled:en}); }
    save(); closeSheet(); render(); toast('保存しました');
  };
  const sd = $('#sfDel');
  if(sd) sd.onclick = ()=>{
    if(!confirm('「'+st.name+'」を削除しますか？')) return;
    S.staples = S.staples.filter(x=>x.id!==st.id);
    save(); closeSheet(); render(); toast('削除しました');
  };
}


/* ---------- 曜日ルールの編集 ---------- */
const RULE_NM = {free:'気分（自動で提案）', rotate:'ローテーション', pool:'定番から選ぶ'};
function ruleSummary(k){
  const rule = dayRule(k);
  if(rule.type==='free') return RULE_NM.free;
  const names = (rule.ids||[]).map(id=>(recipeById(id)||{}).name).filter(Boolean);
  if(!names.length) return RULE_NM[rule.type]+'（未設定 → 気分）';
  return RULE_NM[rule.type]+'：'+names.join(' → ');
}
function openDayRule(dk){
  const w = DAYS.find(d=>d.k===dk).w;
  const rule = dayRule(dk);
  const draftRule = {type:rule.type, ids:(rule.ids||[]).slice(), next:rule.next||0};

  function body(){
    const list = mainPool().slice().sort((a,b)=>a.name.localeCompare(b.name,'ja'));
    let b = '<label class="lb">'+w+'曜日の決め方</label>'+
      '<div class="seg" id="drType">'+
        ['free','rotate','pool'].map(t=>'<button data-t="'+t+'" class="'+(draftRule.type===t?'on':'')+'">'+
          (t==='free'?'気分':(t==='rotate'?'ローテ':'定番'))+'</button>').join('')+
      '</div>'+
      '<div class="tiny" style="margin-top:7px">'+
        (draftRule.type==='free'  ? '全レシピから、連続や傷みやすさを考えて自動で選びます。'
        :draftRule.type==='rotate'? '選んだ順にぐるぐる回します（例：ししゃも → 赤魚 → ホッケ）。買い物を終えるたびに次へ進みます。'
        :                           '選んだ候補の中から、最近作っていないものを選びます。')+'</div>';
    if(draftRule.type!=='free'){
      b += '<label class="lb">対象のレシピ（'+draftRule.ids.length+'件選択中）</label>'+
           '<div class="card" style="margin:0;padding:2px 13px">'+
           (list.length ? list.map(r=>{
             const i = draftRule.ids.indexOf(r.id);
             return '<div class="chk'+(i>=0?' on':'')+'" data-rid="'+r.id+'"><div class="cb"></div>'+
               '<div class="nm3">'+esc(r.name)+'</div>'+
               (i>=0 && draftRule.type==='rotate' ? '<div class="ordn">'+(i+1)+'</div>' : '')+'</div>';
           }).join('') : '<div class="tiny" style="padding:14px 0">主菜がありません</div>')+
           '</div>';
      if(draftRule.type==='rotate' && draftRule.ids.length){
        const nx = recipeById(draftRule.ids[draftRule.next % draftRule.ids.length]);
        b += '<div class="tiny" style="margin-top:8px">次に出るのは <b>'+esc(nx?nx.name:'—')+'</b>'+
             ' <button class="sideadd" id="drNext" style="margin-left:6px">1つ進める</button></div>';
      }
    }
    return b + '<div style="height:12px"></div>';
  }
  function bind(){
    $('#shBody').querySelectorAll('#drType button').forEach(b=>b.onclick=()=>{
      draftRule.type = b.dataset.t; redraw();
    });
    $('#shBody').querySelectorAll('[data-rid]').forEach(b=>{
      b.onclick = ()=>{
        const id = b.dataset.rid, i = draftRule.ids.indexOf(id);
        if(i>=0) draftRule.ids.splice(i,1); else draftRule.ids.push(id);
        if(draftRule.next >= draftRule.ids.length) draftRule.next = 0;
        redraw();
      };
    });
    const nb = $('#drNext');
    if(nb) nb.onclick = ()=>{ draftRule.next = (draftRule.next+1) % draftRule.ids.length; redraw(); };
  }
  function redraw(){ $('#shBody').innerHTML = body(); bind(); }

  sheet(w+'曜日のルール', body(),
    '<button class="btn sub" id="drCancel">やめる</button><button class="btn" id="drSave">保存</button>');
  bind();
  $('#drCancel').onclick = openSettings;
  $('#drSave').onclick = ()=>{
    S.settings.dayRules[dk] = draftRule.type==='free'
      ? {type:'free', ids:[]}
      : {type:draftRule.type, ids:draftRule.ids, next:draftRule.next};
    save(); render(); openSettings(); toast(w+'曜日のルールを保存しました');
  };
}

/* ---------- 設定 ---------- */
function openSettings(){
  const body =
    '<label class="lb">曜日ごとの決め方</label>'+
    '<div class="card" style="margin:0">'+
      DAYS.map(d=>'<div class="ruleRow" data-rule="'+d.k+'"><div class="w2">'+d.w+'</div>'+
        '<div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:700;line-height:1.4">'+
        esc(ruleSummary(d.k))+'</div></div><div style="color:#c3c7cd;font-size:18px">›</div></div>').join('')+
    '</div>'+
    '<label class="lb">副菜</label>'+
    '<div class="seg" id="cfSides">'+
      [0,1,2].map(n=>'<button data-n="'+n+'" class="'+((S.settings.sidesPerDay|0)===n?'on':'')+'">'+
        (n===0?'提案しない':n+'品')+'</button>').join('')+
    '</div>'+
    '<div class="tiny" style="margin-top:7px">主菜と食材がかぶらないもの、手早くできるものを優先して選びます。'+
    '副菜は「📖 レシピ → 副菜」で足せます。</div>'+
    '<label class="lb">1週間の流れ</label>'+
    '<div class="tiny" style="line-height:2">'+
      '土曜 '+PLAN_HOUR+':00　来週の献立が提案される（アプリを開いた時点で生成）<br>'+
      '日曜 '+DEADLINE_HOUR+':00　承認の締切<br>'+
      '日曜 '+SHOP_HOUR+':00　買い物リストを見ながら買い物<br>'+
      '月〜金　作って、任意で評価（👍😐👎）</div>'+
    '<label class="lb">共有（奥さんの端末と同期）</label>'+ shareSectionHTML() +
    '<label class="lb">データ</label>'+
    '<div class="tiny" style="margin-bottom:9px">保存先はこの端末のブラウザ内です。'+
      (syncCfg ? '共有をつないでいるので、GitHubの<b>非公開Gist</b>にも同じ内容が保存されています。'
               : '共有をつながないかぎり、外部には一切送信しません。')+
      'まるごと持ち出すときは書き出し → 読み込みしてください。</div>'+
    '<div style="display:flex;gap:8px">'+
      '<button class="btn sub" style="flex:1" id="cfExp">⬇︎ 書き出し</button>'+
      '<button class="btn sub" style="flex:1" id="cfImp">⬆︎ 読み込み</button></div>'+
    '<input type="file" id="cfFile" accept="application/json,.json" style="display:none">'+
    '<label class="lb">共有</label>'+
    '<button class="btn sub full" id="cfShare">📤 献立＋買い物リストをコピー</button>'+
    '<label class="lb" style="color:var(--r)">リセット</label>'+
    '<button class="btn sub full" id="cfReset" style="color:var(--r)">すべてのデータを消去</button>'+
    '<div style="height:14px"></div>'+
    '<div class="tiny">コンダテ / 端末内保存（localStorage）'+
      (syncCfg ? '＋GitHub Gist 同期' : '・外部通信なし')+'</div>'+
    '<div style="height:8px"></div>';
  sheet('設定', body, '<button class="btn" id="cfClose">閉じる</button>');

  $('#cfClose').onclick = closeSheet;
  $('#shBody').querySelectorAll('[data-rule]').forEach(b=>b.onclick=()=>openDayRule(b.dataset.rule));
  $('#shBody').querySelectorAll('#cfSides button').forEach(b=>b.onclick=()=>{
    S.settings.sidesPerDay = +b.dataset.n; save();
    $('#shBody').querySelectorAll('#cfSides button').forEach(x=>x.classList.toggle('on', +x.dataset.n===S.settings.sidesPerDay));
    render();
  });
  $('#cfExp').onclick = ()=>{
    const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kondate-'+iso(today())+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  $('#cfImp').onclick = ()=>$('#cfFile').click();
  $('#cfFile').onchange = e => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      try{
        const o = JSON.parse(fr.result);
        if(!o || !Array.isArray(o.recipes)) throw 0;
        if(!confirm('読み込むと今のデータは置き換わります。よろしいですか？')) return;
        S = migrate(o); normalize(); save(); closeSheet(); render(); toast('読み込みました');
      }catch(err){ toast('読み込めませんでした'); }
    };
    fr.readAsText(f);
    e.target.value='';
  };
  bindShareSection();
  $('#cfShare').onclick = copyList;
  $('#cfReset').onclick = ()=>{
    if(!confirm('レシピ・常備品・献立をすべて消します。よろしいですか？')) return;
    if(!confirm('本当に消してよいですか？この操作は取り消せません。')) return;
    try{ localStorage.removeItem(KEY); }catch(e){}
    S = defaultState(); normalize(); seedRecipes(); save();
    closeSheet(); render(); toast('初期化しました');
  };
}

/* ---------- 設定：共有セクション ---------- */
function shareSectionHTML(){
  if(syncCfg){
    const ago = syncCfg.lastSyncAt
      ? Math.max(0, Math.round((Date.now()-syncCfg.lastSyncAt)/60000))+'分前' : '—';
    return '<div class="card" style="margin:0;padding:13px">'+
      '<div style="font-size:14px;font-weight:800;color:var(--g-d)">☁️ 接続済み</div>'+
      '<div class="tiny" style="margin-top:4px">最終同期 '+ago+'　／　Gist '+esc(syncCfg.gistId.slice(0,8))+'…</div>'+
      '<div style="display:flex;gap:8px;margin-top:11px">'+
        '<button class="btn sub sm" style="flex:1" id="shSync">今すぐ同期</button>'+
        '<button class="btn sub sm" style="flex:1" id="shCopyPair">ペア設定をコピー</button></div>'+
      '<div class="tiny" style="margin-top:9px">もう1台に貼り付けると同じデータが見えます。'+
        '<b>この文字列にはトークンが入っています</b>ので、送り先に気をつけてください。</div>'+
      '<button class="btn sub sm full" style="margin-top:11px;color:var(--r)" id="shUnpair">接続を解除</button>'+
    '</div>';
  }
  return '<div class="card" style="margin:0;padding:13px">'+
    '<div class="tiny" style="line-height:1.9">'+
      'サーバーは使わず、GitHubの<b>非公開Gist</b>を置き場所にして2台で同じデータを見ます。'+
      '平日に「切らしてる」を入れたり、土日に献立を承認したりが、どちらの端末からでもできます。</div>'+
    '<div class="tiny" style="margin-top:10px;font-weight:800;color:var(--ink)">1台目（この端末のデータを共有する）</div>'+
    '<div class="tiny" style="margin:4px 0 7px">'+
      '<a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=kondate" target="_blank" rel="noopener" '+
      'style="color:var(--p-d);font-weight:800">こちらでトークンを発行</a>'+
      '（scope は <b>gist</b> だけ。有効期限は No expiration が楽です）して貼り付けてください。</div>'+
    '<input class="f" id="shToken" placeholder="ghp_..." autocapitalize="off" autocorrect="off" spellcheck="false">'+
    '<button class="btn full sm" style="margin-top:8px" id="shCreate">共有をはじめる</button>'+
    '<div class="tiny" style="margin-top:14px;font-weight:800;color:var(--ink)">2台目（すでにある共有に参加する）</div>'+
    '<div class="tiny" style="margin:4px 0 7px">1台目で「ペア設定をコピー」した文字列を貼り付けてください。'+
      '<b>この端末の献立・レシピ・常備品は置き換わります。</b></div>'+
    '<input class="f" id="shPair" placeholder="kondate1...." autocapitalize="off" autocorrect="off" spellcheck="false">'+
    '<button class="btn sub full sm" style="margin-top:8px" id="shJoin">参加する</button>'+
  '</div>';
}
function bindShareSection(){
  const sy = $('#shSync');
  if(sy){
    sy.onclick = async ()=>{ sy.textContent='同期中…'; await syncNow({loud:true}); openSettings(); };
    $('#shCopyPair').onclick = ()=>{
      const t = pairString();
      if(navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(t).then(()=>toast('コピーしました'),()=>fallbackCopy(t));
      else fallbackCopy(t);
    };
    $('#shUnpair').onclick = ()=>{
      if(!confirm('接続を解除します。この端末のデータは残りますが、以後は同期されません。')) return;
      unpair(); openSettings(); toast('接続を解除しました');
    };
    return;
  }
  const cb = $('#shCreate');
  if(!cb) return;
  cb.onclick = async ()=>{
    const tk = $('#shToken').value.trim();
    if(!tk){ toast('トークンを貼り付けてください'); return; }
    cb.textContent = '接続中…'; cb.disabled = true;
    try{ await pairCreate(tk); openSettings(); toast('共有をはじめました'); }
    catch(e){ cb.textContent='共有をはじめる'; cb.disabled=false; toast(syncErrMsg(e)); }
  };
  const jb = $('#shJoin');
  jb.onclick = async ()=>{
    const pr = parsePair($('#shPair').value);
    if(!pr){ toast('ペア設定の文字列が正しくありません'); return; }
    if(!confirm('この端末の献立・レシピ・常備品は、共有側の内容に置き換わります。よろしいですか？')) return;
    jb.textContent = '参加中…'; jb.disabled = true;
    try{ await pairJoin(pr.token, pr.gistId); render(); openSettings(); toast('共有に参加しました'); }
    catch(e){ jb.textContent='参加する'; jb.disabled=false; toast(syncErrMsg(e)); }
  };
}

/* =========================================================================
   タブ・週移動・起動
   ========================================================================= */
function switchTab(t){
  tab = t;
  $$('.tabbar button').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  $$('.pane').forEach(p=>p.classList.toggle('on', p.id==='pane-'+t));
  window.scrollTo(0,0);
}
$$('.tabbar button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
$('#btnSet').onclick = openSettings;
$('#btnSync').onclick = ()=>syncNow({loud:true});
$('#btnPrevWk').onclick = ()=>{ viewWeek = iso(addDays(parseISO(viewWeek),-7)); getWeek(viewWeek); save(); render(); };
$('#btnNextWk').onclick = ()=>{ viewWeek = iso(addDays(parseISO(viewWeek), 7)); getWeek(viewWeek); save(); render(); };

/* 日付・時刻が変わったらフェーズを追従させる */
let lastStamp = iso(today())+':'+phaseNow();
function tick(){
  const now = iso(today())+':'+phaseNow();
  if(now !== lastStamp){
    lastStamp = now;
    const wasCurrent = (viewWeek === currentWeekStart());
    if(wasCurrent) viewWeek = currentWeekStart();
    getWeek(viewWeek); reconcileCooked(); autoPlan(); save(); render();
  }
}
setInterval(tick, 60000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){ tick(); render(); syncNow(); }
});

load();
loadSyncCfg();
setSyncState(syncCfg ? 'ok' : 'off',
  syncCfg && syncCfg.lastSyncAt ? '最終同期 '+new Date(syncCfg.lastSyncAt).toLocaleTimeString('ja-JP') : '');
render();
if(syncCfg){ syncNow(); setInterval(()=>{ if(document.visibilityState==='visible') syncNow(); }, 60000); }
</script>
