<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>コンダテ — 平日5日の献立・買い物・常備品</title>
<meta name="theme-color" content="#c25a28">
<link rel="icon" type="image/png" sizes="180x180" href="/kondate/icon-180.png">
<link rel="apple-touch-icon" href="/kondate/icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="/kondate/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="コンダテ">
<style>
:root{
  --p:#e2703a; --p-d:#c25a28; --p-l:#fdf1e9; --p-ll:#fff8f4;
  --g:#2f9e5f; --g-l:#e7f6ed; --g-d:#237a48;
  --r:#d64545; --r-l:#fdeceb;
  --a:#c98a12; --a-l:#fdf5e2;
  --b:#3a72c2; --b-l:#eaf1fb;
  --ink:#20242b; --sub:#6f7580; --sub2:#9aa0aa;
  --line:#e7e5e0; --bg:#f7f6f3; --card:#fff;
  --rad:14px; --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(74px + var(--sb));overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea,select{outline:none}
.wrap{max-width:660px;margin:0 auto;padding:0 14px}

/* header */
header{background:linear-gradient(135deg,var(--p),var(--p-d));color:#fff;position:sticky;top:0;z-index:40;
  box-shadow:0 1px 10px rgba(0,0,0,.10);padding-top:env(safe-area-inset-top,0px)}
.hrow{display:flex;align-items:center;gap:9px;padding:11px 14px;max-width:660px;margin:0 auto}
.logo{font-weight:800;font-size:17px;letter-spacing:.04em;line-height:1.15}
.logo small{display:block;font-size:10px;font-weight:500;opacity:.85;letter-spacing:.08em}
.hsp{flex:1}
.hbtn{background:rgba(255,255,255,.17);color:#fff;border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600}
.hbtn:active{background:rgba(255,255,255,.33)}
.wkbar{background:rgba(0,0,0,.13);color:#fff;font-size:12.5px;font-weight:600}
.wkbar .wrap{display:flex;align-items:center;gap:8px;padding:6px 14px}
.wkbar .nav{background:rgba(255,255,255,.18);border-radius:7px;padding:2px 9px;font-size:12px;font-weight:700}

/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);
  display:flex;padding-bottom:var(--sb);box-shadow:0 -2px 12px rgba(0,0,0,.05)}
.tabbar button{flex:1;padding:9px 2px 8px;font-size:10.5px;font-weight:700;color:var(--sub2);
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabbar button .ic{font-size:20px;line-height:1}
.tabbar button.on{color:var(--p-d)}
.tabbar .cnt{position:absolute;top:4px;right:calc(50% - 22px);background:var(--r);color:#fff;
  border-radius:999px;min-width:17px;height:17px;line-height:17px;font-size:10px;font-weight:800;padding:0 4px}
.pane{display:none}
.pane.on{display:block}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);margin:11px 0;overflow:hidden}
.sec{font-size:12.5px;font-weight:800;color:var(--sub);letter-spacing:.05em;margin:20px 2px 6px;
  display:flex;align-items:center;gap:7px}
.sec .line{flex:1;height:1px;background:var(--line)}
.muted{color:var(--sub);font-size:13px}
.tiny{color:var(--sub2);font-size:11.5px;line-height:1.5}
.btn{background:var(--p);color:#fff;border-radius:11px;padding:12px 16px;font-size:14.5px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:active{background:var(--p-d)}
.btn.full{display:flex;width:100%}
.btn.sub{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-weight:700}
.btn.sub:active{background:#f1efeb}
.btn.gr{background:var(--g)} .btn.gr:active{background:var(--g-d)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.meat{background:#fbeaea;color:#b03a3a}
.pill.fish{background:#e6f0fa;color:#2f63a8}
.pill.other{background:#eef1ec;color:#5b6b5f}
.pill.min{background:#f2efe9;color:#7a6a52}
.pill.g{background:var(--g-l);color:var(--g-d)}
.pill.a{background:var(--a-l);color:var(--a)}
.pill.r{background:var(--r-l);color:var(--r)}
.pill.b{background:var(--b-l);color:var(--b)}
.empty{text-align:center;padding:34px 18px;color:var(--sub2);font-size:13.5px;line-height:1.9}
.empty .big{font-size:34px;display:block;margin-bottom:6px}
input.f,textarea.f,select.f{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;
  font-size:15px;background:#fff}
input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(226,112,58,.13)}
textarea.f{min-height:160px;line-height:1.7;resize:vertical;font-size:14px}
label.lb{display:block;font-size:12px;font-weight:800;color:var(--sub);margin:14px 0 5px;letter-spacing:.03em}

/* today hero */
.hero{background:linear-gradient(135deg,#3b3f46,#22262c);color:#fff;border-radius:var(--rad);padding:16px;margin:13px 0}
.hero .lb2{font-size:11px;font-weight:700;opacity:.7;letter-spacing:.1em}
.hero .nm{font-size:24px;font-weight:800;line-height:1.3;margin:3px 0 7px}
.hero .ing{font-size:12.5px;opacity:.82;line-height:1.7}
.hero.rest .nm{font-size:19px;opacity:.85}

/* day cards */
.day{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:none}
.day.today{background:var(--p-ll)}
.dcol{flex:none;width:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12px 0;border-right:1px solid var(--line);background:#fbfaf8}
.day.today .dcol{background:var(--p-l)}
.dcol .w{font-size:17px;font-weight:800;line-height:1.1}
.dcol .d{font-size:10.5px;color:var(--sub2);font-weight:600}
.day.today .dcol .w{color:var(--p-d)}
.dbody{flex:1;padding:10px 12px;min-width:0}
.dname{font-size:16px;font-weight:700;line-height:1.35;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dname.none{color:var(--sub2);font-weight:600;font-size:14.5px}
.ding{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.55}
.dacts{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.dacts button{border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--sub);background:#fff}
.dname[data-pick],.ding[data-pick]{cursor:pointer}
.dacts button:active{background:#f3f1ee}
.mode3{display:flex;gap:0;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.mode3 button{padding:5px 8px;font-size:11.5px;font-weight:800;color:var(--sub2);border:none;border-radius:0;background:#fff}
.mode3 button+button{border-left:1.5px solid var(--line)}
.mode3 button.on{background:var(--p);color:#fff}
.mode3 button.on.out{background:var(--b)}
.mode3 button.on.left{background:var(--a)}

/* shopping */
.shopsec{margin:14px 0 0}
.shophd{display:flex;align-items:center;gap:8px;padding:9px 13px;background:#f1efeb;border-radius:11px 11px 0 0;
  border:1px solid var(--line);border-bottom:none;font-size:13px;font-weight:800}
.shophd .n{margin-left:auto;font-size:11.5px;color:var(--sub);font-weight:700}
.shopbody{background:#fff;border:1px solid var(--line);border-radius:0 0 11px 11px;overflow:hidden}
.row{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-bottom:1px solid #f0eeea}
.row:last-child{border-bottom:none}
.row:active{background:#fbfaf8}
.cb{width:24px;height:24px;border:2px solid #cfd3d8;border-radius:7px;flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;transition:.13s}
.row.ck .cb{background:var(--g);border-color:var(--g)}
.row.ck .cb::after{content:"";width:6px;height:11px;border:2.5px solid #fff;border-top:none;border-left:none;
  transform:rotate(42deg) translateY(-1.5px)}
.rmain{flex:1;min-width:0}
.rname{font-size:15px;font-weight:700;line-height:1.35}
.row.ck .rname{color:var(--sub2);text-decoration:line-through}
.rwhy{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.5;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.row.ck .rwhy{opacity:.45}
.rdel{flex:none;color:var(--sub2);font-size:17px;padding:0 2px;align-self:center}
.rnote{flex:none;color:var(--sub2);font-size:14px;padding:2px 4px;align-self:center;opacity:.5}
.rnote.has{opacity:1;color:var(--p-d)}
.qty{display:inline-block;font-size:12.5px;font-weight:800;color:var(--p-d);background:var(--p-l);
  border-radius:6px;padding:1px 7px;margin-left:7px;vertical-align:1px}
.row.ck .qty{background:#f0eeea;color:var(--sub2)}
.addrow{display:flex;gap:7px;padding:10px 12px;background:#fbfaf8;border-top:1px solid var(--line)}
.addrow input{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14.5px;background:#fff}

/* staples */
.stp{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid #f0eeea}
.stp:last-child{border-bottom:none}
.stpm{flex:1;min-width:0}
.stpn{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bar{height:5px;background:#eeece8;border-radius:99px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.stpa{display:flex;gap:5px;flex:none}
.stpa button{border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11.5px;font-weight:800;color:var(--sub);background:#fff}
.stpa button.buy{background:var(--g);color:#fff;border-color:var(--g)}

/* recipes */
.rc{display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid #f0eeea}
.rc:last-child{border-bottom:none}
.rcm{flex:1;min-width:0}
.rcn{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rci{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* sheet / modal */
.ov{position:fixed;inset:0;background:rgba(20,22,26,.5);z-index:100;display:none;align-items:flex-end;
  justify-content:center;backdrop-filter:blur(2px)}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:660px;max-height:92vh;border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.shhd{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line);background:#fff;
  border-radius:20px 20px 0 0}
.shhd h3{font-size:16px;font-weight:800;flex:1}
.shhd .x{font-size:22px;color:var(--sub2);line-height:1;padding:0 3px}
.shbd{overflow-y:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch}
.shft{padding:12px 16px calc(14px + var(--sb));background:#fff;border-top:1px solid var(--line);display:flex;gap:9px}
.shft .btn{flex:1}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);
  border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700}
.chip .cat{font-size:14px}
.chip .x{color:var(--sub2);font-size:15px;line-height:1;margin-left:1px}
.chip.off{opacity:.45;text-decoration:line-through}
.chip.seas{background:#f2f0ec;border-style:dashed;color:var(--sub);font-weight:600;font-size:12.5px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.pickgrid button{background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:10px 11px;text-align:left}
.pickgrid button.on{border-color:var(--p);background:var(--p-ll)}
.pickgrid .pn{font-size:14px;font-weight:700;line-height:1.3}
.pickgrid .pi{font-size:11px;color:var(--sub2);margin-top:3px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{flex:1;padding:10px 4px;font-size:13.5px;font-weight:800;color:var(--sub);white-space:nowrap;min-width:0}
#rfDay button:first-child{flex:1.8;font-size:12.5px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button.on{background:var(--p);color:#fff}
.note{background:var(--p-ll);border:1px solid #f2ddcd;border-radius:11px;padding:11px 13px;font-size:12.5px;
  color:#8a5a34;line-height:1.65;margin:11px 0}
.note b{color:#6e4526}
#btnSync{font-size:14px;padding:7px 9px;transition:.2s}
#btnSync.syncing{opacity:.55}
#btnSync.err{background:rgba(255,255,255,.35)}
.synced{font-size:11.5px;color:var(--sub2);font-weight:700}
.pairbox{background:#f4f2ee;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;word-break:break-all;line-height:1.6}
.phase{background:#fff;color:var(--ink)}
.phase .wrap{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12.5px;font-weight:800}
.phase .dot{width:8px;height:8px;border-radius:99px;flex:none}
.phase .sub{margin-left:auto;color:var(--sub2);font-size:11px;font-weight:700;letter-spacing:.02em}
.phase .go{background:var(--p);color:#fff;border-radius:8px;padding:4px 11px;font-size:11.5px;font-weight:800;margin-left:auto}

/* 承認 */
.day.appr{background:#f5fbf7}
.day.appr .dcol{background:#e9f6ee}
.day.other{background:#fafafa}
.dcol .st{font-size:9px;font-weight:800;margin-top:4px;padding:1px 6px;border-radius:99px;letter-spacing:.02em}
.appr3{display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.appr3 button{padding:6px 11px;font-size:12px;font-weight:800;color:var(--sub);background:#fff;border-radius:0}
.appr3 button+button{border-left:1.5px solid var(--line)}
.appr3 button.on{background:var(--g);color:#fff}
.appr3 button.rej:active{background:var(--a-l);color:var(--a)}
.sides{margin-top:5px;display:flex;flex-direction:column;gap:2px}
.side{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--sub);line-height:1.5}
.side .nm2{font-weight:600;color:#4b5560}
.side .x{color:var(--sub2);font-size:13px;margin-left:2px}
.sideadd{font-size:12px;font-weight:700;color:var(--p-d);padding:2px 0;text-align:left;align-self:flex-start}
.rate{display:flex;gap:6px;margin-top:8px;align-items:center}
.rate button{border:1.5px solid var(--line);border-radius:9px;padding:4px 10px;font-size:15px;background:#fff;line-height:1.3}
.rate button.on{border-color:var(--p);background:var(--p-l)}
.rate .lb3{font-size:11.5px;font-weight:700;color:var(--sub2)}
.filt{display:flex;gap:6px;margin:12px 0 0}
.filt button{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:8px;font-size:13px;font-weight:800;color:var(--sub);background:#fff}
.filt button.on{background:var(--p);color:#fff;border-color:var(--p)}
.ruleRow{display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid #f0eeea}
.ruleRow:last-child{border-bottom:none}
.ruleRow .w2{width:26px;font-size:16px;font-weight:800;flex:none}
.chk{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #f0eeea}
.chk:last-child{border-bottom:none}
.chk .cb{width:22px;height:22px}
.chk .nm3{flex:1;font-size:14.5px;font-weight:600}
.chk.on .cb{background:var(--g);border-color:var(--g)}
.chk.on .cb::after{content:"";width:6px;height:11px;border:2.5px solid #fff;border-top:none;border-left:none;transform:rotate(42deg) translateY(-1.5px)}
.ordn{flex:none;width:22px;height:22px;border-radius:99px;background:var(--p);color:#fff;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--sb));background:#2b2f36;color:#fff;
  padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:700;z-index:200;opacity:0;pointer-events:none;
  transition:.25s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-5px)}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="logo">コンダテ<small>WEEKLY MEAL &amp; SHOPPING</small></div>
    <div class="hsp"></div>
    <button class="hbtn" id="btnSync" hidden>☁️</button>
    <button class="hbtn" id="btnSet">⚙️</button>
  </div>
  <div class="phase" id="phaseBar"></div>
  <div class="wkbar"><div class="wrap">
    <span id="wkLabel">—</span>
    <div class="hsp"></div>
    <button class="nav" id="btnPrevWk">前の週</button>
    <button class="nav" id="btnNextWk">次の週</button>
  </div></div>
</header>

<main class="wrap">
  <section class="pane on" id="pane-week"></section>
  <section class="pane" id="pane-shop"></section>
  <section class="pane" id="pane-stock"></section>
  <section class="pane" id="pane-recipe"></section>
</main>

<nav class="tabbar">
  <button data-tab="week" class="on"><span class="ic">🍳</span>献立<span class="cnt" id="cntWeek" hidden>0</span></button>
  <button data-tab="shop"><span class="ic">🛒</span>買い物<span class="cnt" id="cntShop" hidden>0</span></button>
  <button data-tab="stock"><span class="ic">📦</span>常備品<span class="cnt" id="cntStock" hidden>0</span></button>
  <button data-tab="recipe"><span class="ic">📖</span>レシピ</button>
</nav>

<div class="ov" id="ov"><div class="sheet">
  <div class="shhd"><h3 id="shTitle">—</h3><button class="x" id="shClose">✕</button></div>
  <div class="shbd" id="shBody"></div>
  <div class="shft" id="shFoot"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   コンダテ — 平日5日の献立 → 買い物リスト → 常備品 を一直線につなぐ
   単一HTML / localStorage / 外部通信なし
   ========================================================================= */

/* ---------- カテゴリ定義（＝スーパーの売り場順） ---------- */
const CATS = [
  {k:'veg',   ic:'🥬', nm:'野菜'},
  {k:'meat',  ic:'🥩', nm:'肉'},
  {k:'fish',  ic:'🐟', nm:'魚'},
  {k:'dairy', ic:'🥚', nm:'豆腐・卵・乳製品'},
  {k:'dry',   ic:'🍜', nm:'乾物・麺・缶詰'},
  {k:'seas',  ic:'🧂', nm:'調味料'},
  {k:'frozen',ic:'❄️', nm:'冷凍'},
  {k:'daily', ic:'🧴', nm:'日用品'},
  {k:'other', ic:'🧺', nm:'その他'},
];
const CAT = {}; CATS.forEach(c=>CAT[c.k]=c);
const catIc = k => (CAT[k]||CAT.other).ic;
const catNm = k => (CAT[k]||CAT.other).nm;

/* ---------- 食材辞書（カテゴリ自動判定用） ---------- */

let toastT;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1900);
}

/* 月曜始まり。土日は「翌週」を見る（土曜に提案 → 日曜に買い物のため） */
function currentWeekStart(){
  const t = today(), w = t.getDay();
  if(w===0) return iso(addDays(t,1));
  if(w===6) return iso(addDays(t,2));
  return iso(addDays(t,1-w));
}

/* 今どのフェーズか */
function phaseNow(){
  const n = new Date(), d = n.getDay(), h = n.getHours();
  if(d===PLAN_DOW)     return h < PLAN_HOUR ? 'pre' : 'review';
  if(d===DEADLINE_DOW) return h < DEADLINE_HOUR ? 'review' : 'shop';
  return 'cook';
}

function mkRecipe(name, kind, minutes, names){
  const ings = [], seas = [];
  names.forEach(n=>{
    const c = classify(n);
    if(c.seasoning) seas.push(n); else ings.push({name:n, cat:c.cat});
  });
  return {id:uid(), name, kind, protein:proteinOf(ings), minutes,
          ings, seasonings:seas, lastCooked:null, cookCount:0, ratingSum:0, ratingCount:0, archived:false};
}
/** 初回だけ、主菜（月曜ローテ・金曜定番）と副菜を入れる */
function seedRecipes(){
  S.seeded = S.seeded || {};
  if(!S.seeded.mains && !S.recipes.some(r=>r.kind!=='side')){
    MAIN_SEED.forEach(([n,mi,g]) => S.recipes.push(mkRecipe(n,'main',mi,g)));
    const idOf = n => (S.recipes.find(r=>r.name===n)||{}).id;
    S.settings.dayRules.mon = {type:'rotate', ids:MON_ROTATION.map(idOf).filter(Boolean), next:0};
    S.settings.dayRules.fri = {type:'pool',   ids:FRI_POOL.map(idOf).filter(Boolean)};
    S.seeded.mains = true;
  }
  if(!S.seeded.sides && !S.recipes.some(r=>r.kind==='side')){
    SIDE_SEED.forEach(([n,mi,g]) => S.recipes.push(mkRecipe(n,'side',mi,g)));
    S.seeded.sides = true;
  }
}

/** v1（主菜のみ・承認なし）→ v2 */
function migrate(o){
  if(!o || o.version >= 2) return o;
  (o.recipes||[]).forEach(r=>{
    r.kind = r.kind || 'main';
    r.ratingSum = r.ratingSum||0; r.ratingCount = r.ratingCount||0;
  });
  Object.values(o.weeks||{}).forEach(w=>{
    DAYS.forEach(d=>{
      const day = w.days && w.days[d.k];
      if(!day) return;
      day.mainId  = day.mainId || day.recipeId || null;
      day.sideIds = day.sideIds || [];
      day.status  = day.status || (day.mode==='cook' ? 'approved' : 'other');
      if(day.rating===undefined) day.rating = null;
      if(day.cooked===undefined) day.cooked = false;
      delete day.recipeId;
    });
    if(w.generatedAt===undefined) w.generatedAt = null;
  });
  const st = o.settings || {};
  const ns = defaultSettings();
  if(st.fixedFish){ ns.dayRules[st.fixedFish] = {type:'rotate', ids:[], next:0}; }
  o.settings = ns;
  o.seeded = o.seeded || {};
  o.version = 2;
  return o;
}

function normalize(){
  S.recipes  = S.recipes  || [];
  S.staples  = S.staples  || [];
  S.weeks    = S.weeks    || {};
  S.leftovers= S.leftovers|| [];
  S.ingNotes = S.ingNotes || {};
  S.seeded   = S.seeded   || {};
  S.settings = Object.assign(defaultSettings(), S.settings||{});
  S.settings.dayRules = Object.assign(defaultSettings().dayRules, S.settings.dayRules||{});
  S.recipes.forEach(r=>{
    r.ings = r.ings||[]; r.seasonings = r.seasonings||[];
    r.kind = r.kind || 'main';
    r.protein = r.protein || proteinOf(r.ings);
    r.ratingSum = r.ratingSum||0; r.ratingCount = r.ratingCount||0;
  });
  Object.values(S.weeks).forEach(w=>{
    w.days = w.days || {}; w.checked = w.checked||{}; w.extras = w.extras||[];
    DAYS.forEach(d=>{ w.days[d.k] = Object.assign(blankDay(), w.days[d.k]||{}); });
  });
  // 古い週は落とす（共有するデータを小さく保つ。両端末で同じ基準になるよう日付で切る）
  const cutoff = iso(addDays(today(), -70));
  Object.keys(S.weeks).forEach(k=>{ if(k < cutoff) delete S.weeks[k]; });
  viewWeek = currentWeekStart();
  getWeek(viewWeek);
}

function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  try{ S = raw ? migrate(JSON.parse(raw)) : defaultState(); }catch(e){ S = defaultState(); }
  if(!S || typeof S!=='object') S = defaultState();
  normalize();
  seedRecipes();
  reconcileCooked();
  autoPlan();
  save();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('保存できませんでした'); }
  schedulePush();
}

/** 過ぎた日の「作った」を自動で記録する（ボタンを押させないための処理） */
function reconcileCooked(){
  const t = iso(today());
  Object.values(S.weeks).forEach(w=>{
    DAYS.forEach(d=>{
      const day = w.days[d.k];
      if(day.cooked || day.mode!=='cook' || day.status!=='approved') return;
      if(iso(dayDate(w.start, d.k)) >= t) return;      // まだ来ていない日は触らない
      markCooked(w, d.k);
    });
  });
}
function markCooked(w, dk){
  const day = w.days[dk], dt = iso(dayDate(w.start, dk));
  [day.mainId].concat(day.sideIds||[]).filter(Boolean).forEach(id=>{
    const r = recipeById(id); if(!r) return;
    if(!r.lastCooked || r.lastCooked < dt){ r.lastCooked = dt; r.cookCount = (r.cookCount||0)+1; }
  });
  day.cooked = true;
}

/** 土日にアプリを開いたら、まだ提案が無ければ自動で作る（＝土曜12時に提案が出る運用） */
function autoPlan(){
  const dow = new Date().getDay();
  if(dow!==PLAN_DOW && dow!==DEADLINE_DOW) return;
  const wk = getWeek(currentWeekStart());
  if(wk.generatedAt) return;
  if(!S.recipes.some(r=>r.kind!=='side' && !r.archived)) return;
  const keep = viewWeek; viewWeek = currentWeekStart();
  suggestWeek();
  viewWeek = keep;
}

/* =========================================================================
   共有（GitHub Gist 同期）
   奥さんの端末と同じデータを見るための同期。サーバーは持たず、
   非公開Gist 1ファイルを共有の置き場所として使う。

   同期の肝は「3方向マージ」。前回同期した時点のスナップショット（base）を
   残しておき、base / 自分 / 相手 の3つを比べる。
     ・自分が触っていない → 相手の変更を採用
     ・相手が触っていない → 自分の変更を採用
     ・両方が別々に変更   → 相手を採用（相手の変更を消さない）
   こうすると「平日に奥さんが入れた『シャンプー切らしてる』を、
   数日前の画面を開いたままのこちらが上書きして消す」事故が起きない。
   ========================================================================= */
const SYNC_KEY = 'kondate.sync';    // {token, gistId, lastSyncAt} ※本体とは別に保存（Gistに載せないため）
const BASE_KEY = 'kondate.base';    // 前回同期時のスナップショット
const GIST_FILE = 'kondate.json';
const PAIR_PREFIX = 'kondate1';

let syncCfg = null, syncState = 'off', pushTimer = null, syncing = false;

function loadSyncCfg(){
  try{ syncCfg = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); }catch(e){ syncCfg = null; }
  if(!syncCfg || !syncCfg.token || !syncCfg.gistId) syncCfg = null;
  return syncCfg;
}
function saveSyncCfg(c){
  syncCfg = c;
  try{ c ? localStorage.setItem(SYNC_KEY, JSON.stringify(c)) : localStorage.removeItem(SYNC_KEY); }catch(e){}
}
function loadBase(){
  try{ return JSON.parse(localStorage.getItem(BASE_KEY) || 'null'); }catch(e){ return null; }
}
function saveBase(o){
  try{ localStorage.setItem(BASE_KEY, JSON.stringify(o)); }catch(e){}
}

/* ---------- 3方向マージ ---------- */
function deepEq(a,b){
  if(a===b) return true;
  if(a===null || b===null || a===undefined || b===undefined) return false;
  if(typeof a!=='object' || typeof b!=='object') return false;
  if(Array.isArray(a)!==Array.isArray(b)) return false;
  if(Array.isArray(a)){
    if(a.length!==b.length) return false;
    for(let i=0;i<a.length;i++) if(!deepEq(a[i],b[i])) return false;
    return true;
  }
  const ka=Object.keys(a), kb=Object.keys(b);
  if(ka.length!==kb.length) return false;
  for(const k of ka){ if(!(k in b) || !deepEq(a[k],b[k])) return false; }
  return true;
}
const isPlainObj = v => v && typeof v==='object' && !Array.isArray(v);
const isIdArray  = v => Array.isArray(v) && v.every(x=>x && typeof x==='object' && typeof x.id==='string');
function byId(a){ const m={}; (a||[]).forEach(x=>{ m[x.id]=x; }); return m; }

function mergeObj(base, local, remote){
  const out = {};
  const keys = {};
  [base, local, remote].forEach(o=>{ if(isPlainObj(o)) Object.keys(o).forEach(k=>{ keys[k]=1; }); });
  Object.keys(keys).forEach(k=>{
    const b = isPlainObj(base)   ? base[k]   : undefined;
    const l = isPlainObj(local)  ? local[k]  : undefined;
    const r = isPlainObj(remote) ? remote[k] : undefined;
    const inB = b!==undefined, inL = l!==undefined, inR = r!==undefined;
    if(inB && !inL) return;                  // 自分が消した
    if(inB && !inR) return;                  // 相手が消した
    if(!inL){ out[k] = r; return; }          // 相手が追加した
    if(!inR){ out[k] = l; return; }          // 自分が追加した
    out[k] = merge3(b, l, r);
  });
  return out;
}
function mergeIdArray(base, local, remote){
  const m = mergeObj(byId(base), byId(local), byId(remote));
  const order = [], seen = {};
  [local, remote].forEach(arr=>(arr||[]).forEach(x=>{
    if(m[x.id] && !seen[x.id]){ seen[x.id]=1; order.push(x.id); }
  }));
  return order.map(id=>m[id]);
}
function merge3(base, local, remote){
  if(deepEq(local, remote)) return local;
  if(deepEq(base, local))   return remote;   // 自分は触っていない
  if(deepEq(base, remote))  return local;    // 相手は触っていない
  if(isIdArray(local) && isIdArray(remote)) return mergeIdArray(base, local, remote);
  if(isPlainObj(local) && isPlainObj(remote)) return mergeObj(base, local, remote);
  return remote;                             // 衝突したスカラー／並び順は相手を優先
}

/* ---------- Gist API ---------- */
async function gistCall(cfg, path, method, body){
  const h = {
    'Authorization':'Bearer '+cfg.token,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  };
  if(body) h['Content-Type'] = 'application/json';
  const res = await fetch('https://api.github.com'+path,
    {method:method||'GET', headers:h, body: body ? JSON.stringify(body) : undefined});
  if(!res.ok){ const e = new Error('HTTP '+res.status); e.status = res.status; throw e; }
  return res.json();
}
async function gistRead(cfg){
  const g = await gistCall(cfg, '/gists/'+cfg.gistId);
  const f = g.files && g.files[GIST_FILE];
  if(!f) return null;
  if(f.truncated && f.raw_url){ const r = await fetch(f.raw_url); return JSON.parse(await r.text()); }
  return JSON.parse(f.content);
}
async function gistWrite(cfg, data){
  const files = {}; files[GIST_FILE] = {content: JSON.stringify(data)};
  await gistCall(cfg, '/gists/'+cfg.gistId, 'PATCH', {files});
}
async function gistCreate(cfg, data){
  const files = {}; files[GIST_FILE] = {content: JSON.stringify(data)};
  const g = await gistCall(cfg, '/gists', 'POST',
    {description:'コンダテ 共有データ', public:false, files});
  return g.id;
}

/* ---------- 同期の実行 ---------- */
function snapshot(){ return JSON.parse(JSON.stringify(S)); }

function setSyncState(st, msg){
  syncState = st;
  const b = $('#btnSync');
  if(!b) return;
  b.hidden = !syncCfg;
  b.classList.toggle('syncing', st==='syncing');
  b.classList.toggle('err', st==='error');
  b.textContent = st==='syncing' ? '⏳' : (st==='error' ? '⚠️' : '☁️');
  b.title = msg || '';
}
function syncErrMsg(e){
  if(e && e.status===401) return 'トークンが無効です。設定から入れ直してください';
  if(e && e.status===403) return 'GitHubへのアクセスが拒否されました（トークンの権限を確認）';
  if(e && e.status===404) return '共有データが見つかりません（Gist IDを確認）';
  return 'つながりませんでした。あとで自動で再試行します';
}

/** 入力中・シート表示中に裏で同期して画面を描き直すと、書きかけが消える */
function busyEditing(){
  if($('#ov').classList.contains('on')) return true;      // シートを開いている
  const a = document.activeElement;
  if(!a || (a.tagName!=='INPUT' && a.tagName!=='TEXTAREA')) return false;
  return !!(a.value && a.value.trim());                   // 書きかけがあるときだけ止める
}

/** 今週の買い物リストに載っている品名（表示中の週に関係なく今週で見る） */
function shoppingNames(){
  const keep = viewWeek;
  viewWeek = currentWeekStart();
  const out = {};
  try{ buildShopping().forEach(g=>g.items.forEach(it=>{ out[it.name]=1; })); }catch(e){}
  viewWeek = keep;
  return out;
}

async function syncNow(opts){
  opts = opts || {};
  if(!loadSyncCfg() || syncing) return false;
  if(!opts.loud && busyEditing()) return false;
  syncing = true; setSyncState('syncing');
  try{
    const remote = await gistRead(syncCfg);
    const base   = loadBase();
    let changed = false;
    // 買い物中に相手が足した品を見落とさないよう、増えたぶんを知らせる
    const namesBefore = (remote && base) ? shoppingNames() : null;
    if(remote){
      const before = JSON.stringify(S);
      const merged = merge3(base || {}, snapshot(), remote);
      const keepWeek = viewWeek;
      S = merged; normalize();
      if(!Array.isArray(S.recipes)) S.recipes = [];
      // 別の週を見ている最中に裏で同期しても、表示中の週は動かさない
      if(keepWeek && S.weeks[keepWeek]) viewWeek = keepWeek;
      changed = JSON.stringify(S) !== before;
    }
    await gistWrite(syncCfg, S);
    saveBase(snapshot());
    syncCfg.lastSyncAt = Date.now(); saveSyncCfg(syncCfg);
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    setSyncState('ok', '最終同期 '+new Date().toLocaleTimeString('ja-JP'));
    if(changed || opts.loud) render();
    let told = false;
    if(namesBefore){
      const after = shoppingNames();
      const added = Object.keys(after).filter(n=>!namesBefore[n]);
      if(added.length){
        toast('相手が追加：'+added.slice(0,3).join('、')+(added.length>3 ? ' ほか'+(added.length-3)+'件' : ''));
        told = true;
      }
    }
    if(opts.loud && !told) toast('同期しました');
    return true;
  }catch(e){
    setSyncState('error', syncErrMsg(e));
    if(opts.loud) toast(syncErrMsg(e));
    return false;
  }finally{ syncing = false; }
}

/* =========================================================================
   食材の分類
   ========================================================================= */
function longestHit(name, list){
  let best='';
  for(const w of list){ if(w && name.indexOf(w)>=0 && w.length>best.length) best=w; }
  return best;
}
/** 食材名 → {cat:'veg'|..., seasoning:bool} */
function classify(name){
  const n = String(name).trim();
  if(!n) return {cat:'other', seasoning:false};
  let bestCat='', bestLen=0;
  for(const k of Object.keys(DICT)){
    const hit = longestHit(n, DICT[k]);
    if(hit.length > bestLen){ bestLen = hit.length; bestCat = k; }
  }
  const sHit = longestHit(n, SEAS);
  // 「ごま油」(調味料3) > 「ごま」(乾物2) のように、長く一致したほうを採用
  if(sHit.length > bestLen) return {cat:'seas', seasoning:true};
  return {cat: bestCat || 'other', seasoning:false};
}
/** 食材リスト → タンパク源タグ */
function proteinOf(ings){
  if(ings.some(i=>i.cat==='fish')) return 'fish';
  if(ings.some(i=>i.cat==='meat')) return 'meat';
  return 'other';
}
const PROT = {meat:{nm:'肉',ic:'🥩'}, fish:{nm:'魚',ic:'🐟'}, other:{nm:'その他',ic:'🍚'}};
/** 傷みやすさ（大きいほど早く使いたい） */
const perishOf = r => r.protein==='fish' ? 2 : (r.protein==='meat' ? 1 : 0);

/* =========================================================================
   貼り付けパーサー（レシピサイト / YouTube概要欄）
   ========================================================================= */
const RE_MAT_START = /(材\s*料|ざいりょう|ingredients)/i;
const RE_MAT_END   = /(作\s*り\s*方|つくり方|手\s*順|下ごしらえ|下準備|調理法|ポイント|コツ|使用した|チャンネル登録|登録はこちら|twitter|instagram|tiktok|x\.com|https?:\/\/|【?レシピ動画|楽曲|BGM|音楽|提供|関連動画)/i;
const RE_URLONLY   = /^\s*https?:\/\/\S+\s*$/i;

function zen2han(s){
  return s.replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
          .replace(/[Ａ-Ｚａ-ｚ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
          .replace(/／/g,'/').replace(/～/g,'~');
}

/** 1行 → 食材名（取れなければ ''） */
function cleanLine(raw){
  let s = zen2han(raw);
  s = s.replace(/^[\s　]+|[\s　]+$/g,'');
  if(!s) return '';
  // 箇条書き記号・番号
  s = s.replace(/^[・･\-‐−ー–—*＊#■□◆◇●○▲△▼▽☆★→>＞\|｜\s　]+/,'');
  s = s.replace(/^(\d{1,2}[\.\):、]|[①-⑳])[\s　]*/,'');
  s = s.replace(/^[ABCＡ][\s　:：\.]+/,'');          // 「A 醤油」のグループ記号
  // 区切りで前半だけ取る（… ： タブ 連続スペース）
  const parts = s.split(/[…‥]+|\.{3,}|[:：]|\t|[\s　]{2,}/);
  if(parts.length>1 && parts[0].trim()) s = parts[0];
  // カッコ内・分量・単位
  s = s.replace(/[（(\[【][^）)\]】]*[）)\]】]/g,' ');
  s = s.replace(/(大さじ|小さじ|カップ|適量|適宜|少々|少量|ひとつまみ|ひとかけ|お好み|好みで|各適量|各少々).*$/,'');
  s = s.replace(/[\s　]*[約]?[0-9½¼¾⅓⅔].*$/,'');    // 数字が出たら以降を切る
  s = s.replace(/[\s　]*[〜~\-]+$/,'');            // ※「ー」は長音符なので削らない
  s = s.replace(/^[\s　]+|[\s　、,\.。]+$/g,'');
  if(!s) return '';
  if(s.length>14) return '';                              // 説明文っぽい行は捨てる
  if(/^(材料|以上|など|その他|調味料|合わせ調味料|トッピング|仕上げ|下味|タレ|たれ|ソース類|作り方|手順)$/.test(s)) return '';
  if(/[。！？!?]/.test(s)) return '';
  if(!/[ぁ-んァ-ヶ一-龯a-zA-Z]/.test(s)) return '';
  return s;
}

/** 貼り付けテキスト → {title, minutes, ings:[{name,cat}], seasonings:[name], matched} */
function parsePaste(text){
  const out = {title:'', minutes:null, ings:[], seasonings:[], urlOnly:false, matched:false};
  if(!text || !text.trim()) return out;
  if(RE_URLONLY.test(text)){ out.urlOnly = true; return out; }

  const lines = text.replace(/\r\n?/g,'\n').split('\n');

  // --- 材料ブロックの範囲 ---
  let from = -1, to = lines.length;
  for(let i=0;i<lines.length;i++){
    const l = lines[i];
    if(RE_MAT_START.test(l) && l.replace(/\s/g,'').length <= 24){ from = i+1; break; }
  }
  if(from >= 0){
    out.matched = true;
    let blank = 0;
    for(let i=from;i<lines.length;i++){
      const l = lines[i].trim();
      if(!l){ if(++blank>=2 && i-from>2){ to=i; break; } continue; }
      blank = 0;
      if(RE_MAT_END.test(l)){ to = i; break; }
    }
  }else{
    from = 0;   // 「材料」見出しが無い＝食材の羅列を貼られたとみなす
  }

  // --- タイトル推測（材料ブロックより前の行から） ---
  for(let i=0;i<Math.max(from-1,0) && i<12;i++){
    let l = lines[i].trim();
    if(!l || /^https?:/i.test(l)) continue;
    l = l.replace(/^[\s#＃]+/,'');
    l = l.replace(/^([【\[（(][^】\]）)]{0,20}[】\]）)])+/,'');   // 先頭の【15分レシピ】などは中身ごと除去
    l = l.replace(/[【】「」『』\[\]]/g,'').trim();
    l = l.replace(/(の作り方|の作りかた|レシピ|作り方|【簡単】|超簡単|絶品|プロが教える|人気|殿堂入り)/g,'').trim();
    l = l.replace(/[｜\|].*$/,'').trim();
    if(l.length>=2 && l.length<=22 && !RE_MAT_START.test(l)){ out.title = l; break; }
  }

  // --- 所要時間 ---
  const mm = text.match(/(\d{1,3})\s*分/g);
  if(mm){
    const nums = mm.map(x=>parseInt(x,10)).filter(n=>n>=3 && n<=120);
    if(nums.length) out.minutes = Math.min.apply(null, nums);
  }

  // --- 食材抽出 ---
  const seen = new Set();
  for(let i=from;i<to;i++){
    // 1行に「・A ・B」と並ぶケースを分割
    const chunks = lines[i].split(/[、,]/).length>1 && lines[i].length<40
      ? lines[i].split(/[、,]/) : [lines[i]];
    for(const ch of chunks){
      const nm = cleanLine(ch);
      if(!nm || seen.has(nm)) continue;
      seen.add(nm);
      const c = classify(nm);
      if(c.seasoning) out.seasonings.push(nm);
      else out.ings.push({name:nm, cat:c.cat});
    }
  }
  return out;
}


/* =========================================================================
   URLからの取り込み
   ブラウザは他サイトを直接読めない（CORS）ため、公開の読み取り中継
   サービスを順に試す。取れたHTMLからは、まず schema.org/Recipe の
   JSON-LD（クックパッド・クラシル・ナディアなど大半のレシピサイトが
   埋めている）を探し、無ければ YouTube の概要欄、最後に本文テキストを
   既存のパーサーに通す。全滅したら従来どおりコピペ案内に落とす。
   ========================================================================= */
const FETCH_RELAYS = [
  {name:'allorigins', kind:'html', mk:u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)},
  {name:'jina',       kind:'text', mk:u=>'https://r.jina.ai/'+u},
  {name:'corsproxy',  kind:'html', mk:u=>'https://corsproxy.io/?url='+encodeURIComponent(u)},
];

function isoMinutes(v){
  const m = String(v||'').match(/PT(?:(\d+)H)?(?:(\d+)M)?/i);
  if(!m) return null;
  const n = (parseInt(m[1]||0,10)*60 + parseInt(m[2]||0,10)) || 0;
  return (n>=3 && n<=180) ? n : null;
}
function tidyTitle(t){
  if(!t) return '';
  t = zen2han(String(t));
  t = t.replace(/^([【\[（(][^】\]）)]{0,20}[】\]）)])+/,'');
  t = t.replace(/[｜\|].*$/,'').replace(/\s*-\s*(YouTube|cookpad|クックパッド|クラシル|Nadia).*$/i,'');
  t = t.replace(/(の作り方|の作りかた|レシピ|【簡単】|超簡単|絶品|プロが教える|人気|殿堂入り)/g,'').trim();
  return t.slice(0,24);
}
function stripTags(html){
  let t = String(html)
    .replace(/<script[\s\S]*?<\/script>/gi,' ')
    .replace(/<style[\s\S]*?<\/style>/gi,' ')
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/<\/(p|div|li|tr|dd|dt|h[1-6]|section|span)>/gi,'\n')
    .replace(/<[^>]+>/g,' ');
  return t.replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<')
          .replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#0?39;/g,"'");
}
/** schema.org/Recipe の JSON-LD から材料を取り出す */
function jsonLdRecipe(html){
  const re = /<script[^>]*type=["']?application\/ld\+json["']?[^>]*>([\s\S]*?)<\/script>/gi;
  let m, found = null;
  const visit = o => {
    if(!o || typeof o!=='object' || found) return;
    if(Array.isArray(o)){ o.forEach(visit); return; }
    const t = o['@type'], types = Array.isArray(t) ? t : [t];
    if(types.indexOf('Recipe')>=0 && Array.isArray(o.recipeIngredient) && o.recipeIngredient.length){
      found = o; return;
    }
    if(o['@graph']) visit(o['@graph']);
    if(o.mainEntity) visit(o.mainEntity);
    if(o.mainEntityOfPage && typeof o.mainEntityOfPage==='object') visit(o.mainEntityOfPage);
  };
  while((m = re.exec(html))){
    try{ visit(JSON.parse(m[1].trim())); }catch(e){ /* 壊れたJSON-LDは無視 */ }
    if(found) break;
  }
  if(!found) return null;
  const out = {title:tidyTitle(found.name), minutes:isoMinutes(found.totalTime)||isoMinutes(found.cookTime),
               ings:[], seasonings:[], matched:true, urlOnly:false};
  const seen = new Set();
  found.recipeIngredient.forEach(line=>{
    // 「☆醤油」「A 砂糖」のようなグループ記号も cleanLine が落とす
    const nm = cleanLine(String(line).replace(/^[☆★◎●○◇◆],?\s*/,''));
    if(!nm || seen.has(nm)) return;
    seen.add(nm);
    const c = classify(nm);
    if(c.seasoning) out.seasonings.push(nm); else out.ings.push({name:nm, cat:c.cat});
  });
  return (out.ings.length || out.seasonings.length) ? out : null;
}
/** YouTube のページHTMLから概要欄を取り出す */
function ytDescription(html){
  const m = String(html).match(/"shortDescription":"((?:[^"\\]|\\.)*)"/);
  if(!m) return null;
  try{ return JSON.parse('"'+m[1]+'"'); }catch(e){ return null; }
}
function ogTitle(html){
  const m = String(html).match(/og:title["'][^>]*content=["']([^"']{2,80})["']/) ||
            String(html).match(/content=["']([^"']{2,80})["'][^>]*og:title/) ||
            String(html).match(/<title[^>]*>([^<]{2,80})</i);
  return m ? m[1] : '';
}
const hasIngs = p => p && (p.ings.length || p.seasonings.length);

async function importFromUrl(url){
  let lastErr = null;
  for(const relay of FETCH_RELAYS){
    let txt = null;
    try{
      const ctl = new AbortController();
      const timer = setTimeout(()=>ctl.abort(), 12000);
      const res = await fetch(relay.mk(url), {signal:ctl.signal});
      clearTimeout(timer);
      if(!res.ok) throw new Error('HTTP '+res.status);
      txt = await res.text();
    }catch(e){ lastErr = e; continue; }
    if(!txt || txt.trim().length < 40){ lastErr = new Error('empty'); continue; }

    let p = null;
    if(relay.kind==='html'){
      p = jsonLdRecipe(txt);
      if(!hasIngs(p)){
        const yd = ytDescription(txt);
        if(yd){
          p = parsePaste(yd);
          // 概要欄の1行目は挨拶のことが多いので、動画タイトルを優先する
          if(p){ p.title = tidyTitle(ogTitle(txt)) || p.title; }
        }
      }
      if(!hasIngs(p)) p = parsePaste(stripTags(txt));
      if(p && !p.title) p.title = tidyTitle(ogTitle(txt));
    }else{
      const body = String(txt).replace(/^Title:\s*(.*)$/m, '$1');
      p = parsePaste(body);
    }
    if(hasIngs(p)) return p;
    lastErr = new Error('no-ingredients');
  }
  throw lastErr || new Error('fetch-failed');
}

/* =========================================================================
   献立の自動提案
   曜日ごとに3つのルールを持てる:
     rotate … 決めた順に回す（例：月曜の魚 ししゃも→赤魚→ホッケ）
     pool   … 決めた候補の中から選ぶ（例：金曜の定番）
     free   … 気分（全レシピからルールに沿って提案）
   free の日には次を効かせる:
     ・同じタンパク源を2日連続にしない
     ・傷みやすいもの（魚→肉→その他）を週の前半へ
     ・最近作ったもの／評価の低いものは出しにくい
     ・余っている食材を使うレシピを優先
   ========================================================================= */
function scoreRecipe(r, ctx){
  let sc = 0;
  const ds = daysSince(r.lastCooked);
  sc += ds===null ? 45 : Math.min(ds, 70);
  sc -= (r.cookCount||0) * 0.6;
  const av = avgRating(r);
  if(av !== null) sc += (av - 2) * 26;                  // 👍で出やすく、👎で出にくく
  if(ctx.leftNames.size) r.ings.forEach(i=>{ if(ctx.leftNames.has(i.name)) sc += 22; });
  sc += Math.random()*14;
  return sc;
}
const mainPool = () => S.recipes.filter(r=>!r.archived && r.kind!=='side');
/** ローテーション・定番ルールに割り当てられたレシピの id。
    これらはその曜日の専用枠として扱い、「気分」の日の候補には出さない。
    （出すと「月曜の魚が水曜に来る」「金曜の定番が火曜に来る」が起きる） */
function reservedMainIds(){
  const set = new Set();
  Object.values(S.settings.dayRules||{}).forEach(rule=>{
    if(rule && (rule.type==='rotate' || rule.type==='pool'))
      (rule.ids||[]).forEach(id=>set.add(id));
  });
  return set;
}
/** このレシピが割り当てられている曜日（無ければ null） */
function assignedDayOf(rid){
  for(const d of DAYS){
    const rule = dayRule(d.k);
    if((rule.type==='rotate' || rule.type==='pool') && (rule.ids||[]).indexOf(rid)>=0) return d.k;
  }
  return null;
}
/** レシピの曜日割り当てを付け替える。dayK=null なら「おまかせ（気分）」に戻す。
    割り当て先の曜日が「気分」ルールだった場合は「定番から選ぶ」に切り替える */
function assignRecipeToDay(rid, dayK){
  DAYS.forEach(d=>{
    const rule = S.settings.dayRules[d.k];
    if(rule && rule.ids){
      rule.ids = rule.ids.filter(id=>id!==rid);
      if(rule.type==='rotate' && (rule.next||0) >= rule.ids.length) rule.next = 0;
    }
  });
  if(!dayK) return;
  const rule = S.settings.dayRules[dayK];
  if(!rule || rule.type==='free') S.settings.dayRules[dayK] = {type:'pool', ids:[rid]};
  else if(rule.ids.indexOf(rid)<0) rule.ids.push(rid);
}

/** 気分の日に出せる主菜（＝ルール未割り当てのもの）。1品も無ければ全体にフォールバック */
function freeMainPool(){
  const reserved = reservedMainIds();
  const free = mainPool().filter(r=>!reserved.has(r.id));
  return free.length ? free : mainPool();
}
const sidePool = () => S.recipes.filter(r=>!r.archived && r.kind==='side');

function pickRotate(rule, used, exclude){
  const list = (rule.ids||[]).map(recipeById).filter(r=>r && !r.archived);
  if(!list.length) return null;
  const start = ((rule.next||0) % list.length + list.length) % list.length;
  for(let i=0;i<list.length;i++){
    const c = list[(start+i)%list.length];
    if(!used.has(c.id) && c.id!==exclude) return c;
  }
  return null;
}
function pickPool(rule, used, ctx, exclude){
  const list = (rule.ids||[]).map(recipeById)
    .filter(r=>r && !r.archived && !used.has(r.id) && r.id!==exclude);
  if(!list.length) return null;
  return list.map(r=>({r,sc:scoreRecipe(r,ctx)})).sort((a,b)=>b.sc-a.sc)[0].r;
}

function suggestWeek(opts){
  opts = opts || {};
  const wk = W(), mains = mainPool();
  if(!mains.length) return false;
  const ctx = { leftNames:new Set(S.leftovers.map(l=>l.name)) };

  // 触ってよい日：「その他」にした日は動かさない。承認済みも既定では動かさない
  const editable = DAYS.map(d=>d.k).filter(k=>{
    const day = wk.days[k];
    if(day.status==='other') return false;
    if(!opts.redoApproved && day.status==='approved') return false;
    return true;
  });
  if(!editable.length){ save(); return true; }

  const used = new Set();
  DAYS.forEach(d=>{ if(editable.indexOf(d.k)<0 && wk.days[d.k].mainId) used.add(wk.days[d.k].mainId); });

  // 1) 曜日ルールで決まる日を先に埋める
  const fixed = {}, freeDays = [];
  editable.forEach(k=>{
    const rule = dayRule(k);
    let r = null;
    if(rule.type==='rotate') r = pickRotate(rule, used);
    else if(rule.type==='pool') r = pickPool(rule, used, ctx);
    if(r){ fixed[k] = r; used.add(r.id); } else freeDays.push(k);
  });

  // 2) 土台（動かさない日＋ルールで決まった日）
  const base = {};
  DAYS.forEach(d=>{
    const day = wk.days[d.k];
    if(day.status==='other' || day.mode!=='cook'){ base[d.k] = null; return; }
    base[d.k] = fixed[d.k] || (editable.indexOf(d.k)<0 ? recipeById(day.mainId) : null);
  });

  // 3) 空いている曜日を、連続を避けながら埋める
  const freePool = freeMainPool();
  const filled = fillFreeDays(freeDays, base, freePool, ctx, used);
  Object.keys(filled).forEach(k=>{ base[k] = filled[k]; });
  ensureFish(base, freeDays, freePool, ctx, used);

  // 4) 書き戻し
  editable.forEach(k=>{
    wk.days[k].mainId = base[k] ? base[k].id : null;
    wk.days[k].mode   = 'cook';
    wk.days[k].status = 'pending';
    wk.days[k].sideIds = [];
  });
  assignSides(wk, editable, ctx);
  if(!wk.generatedAt) wk.generatedAt = new Date().toISOString();
  save();
  return true;
}

/** 空いている曜日を埋める。
    「同じタンパク源を2日連続にしない」を満たす組み合わせを深さ優先で探す。
    選んでから並べ替えるのではなく、選ぶ段階で並びを見るのがポイント。
    （月＝魚固定・金＝肉の定番、のように両端が埋まっていると、
      スコア順に選んでから並べ替える方式では条件を満たす組み合わせを引けないため） */
function fillFreeDays(freeDays, base, pool, ctx, used){
  const order = DAYS.map(d=>d.k);
  const idxOf = {}; order.forEach((k,i)=>idxOf[k]=i);
  const slots = freeDays.slice().sort((a,b)=>idxOf[a]-idxOf[b]);
  const isSlot = {}; slots.forEach(k=>isSlot[k]=true);
  const cand = pool.filter(r=>!used.has(r.id));
  if(!slots.length || !cand.length) return {};

  const sc = new Map(); cand.forEach(r=>sc.set(r.id, scoreRecipe(r, ctx)));
  // 登録レシピが日数より少ないときは使い回しを許す（連続はさせない）
  const allowRepeat = cand.length < slots.length;
  const assign = {}, taken = new Set();
  let budget = 8000;

  const protAt = k => assign[k] ? assign[k].protein : (base[k] ? base[k].protein : null);
  function ok(k, r){
    const i = idxOf[k];
    if(i>0 && protAt(order[i-1])===r.protein) return false;
    // 次の曜日が固定なら、そこともぶつからないようにする
    if(i<order.length-1 && !isSlot[order[i+1]] && protAt(order[i+1])===r.protein) return false;
    return true;
  }
  /** その曜日での並び順：スコア＋「傷みやすいものを週の前半へ」 */
  function sortedFor(k){
    const w = (DAYS.length-1-idxOf[k]) * 6;
    return cand.filter(r=>allowRepeat || !taken.has(r.id))
      .map(r=>({r, s: sc.get(r.id) + perishOf(r)*w}))
      .sort((a,b)=>b.s-a.s).map(x=>x.r);
  }
  function dfs(si){
    if(si>=slots.length) return true;
    if(--budget<=0) return false;
    const k = slots[si];
    let tried = 0;
    for(const r of sortedFor(k)){
      if(!ok(k,r)) continue;
      assign[k]=r; taken.add(r.id);
      if(dfs(si+1)) return true;
      delete assign[k]; taken.delete(r.id);
      if(++tried>=8) break;              // 各曜日 上位8件まで試す
    }
    return false;
  }
  if(!dfs(0)){
    // 条件を満たす組み合わせが無い（レシピがタンパク源に偏っている）
    // → 連続を最小限に抑えつつスコア順で埋める
    slots.forEach(k=>{ delete assign[k]; });
    taken.clear();
    slots.forEach(k=>{
      const list = sortedFor(k);
      const pick = list.find(r=>ok(k,r)) || list[0];
      if(pick){ assign[k]=pick; taken.add(pick.id); }
    });
  }
  return assign;
}

/** 週に魚が1回も無ければ、前半の空き曜日に入れる */
function ensureFish(base, freeDays, pool, ctx, used){
  if(DAYS.some(d=>base[d.k] && base[d.k].protein==='fish')) return;
  const order = DAYS.map(d=>d.k);
  const idxOf = {}; order.forEach((k,i)=>idxOf[k]=i);
  const taken = new Set(DAYS.map(d=>base[d.k] && base[d.k].id).filter(Boolean));
  const fish = pool.filter(r=>r.protein==='fish' && !used.has(r.id) && !taken.has(r.id))
    .map(r=>({r, s:scoreRecipe(r,ctx)})).sort((a,b)=>b.s-a.s);
  if(!fish.length) return;
  const slots = freeDays.slice().sort((a,b)=>idxOf[a]-idxOf[b]);
  for(const k of slots){
    const i = idxOf[k];
    const prev = i>0 ? base[order[i-1]] : null;
    const next = i<order.length-1 ? base[order[i+1]] : null;
    if((prev && prev.protein==='fish') || (next && next.protein==='fish')) continue;
    base[k] = fish[0].r; return;
  }
  if(slots.length) base[slots[0]] = fish[0].r;
}

/** 副菜を割り当てる。主菜と食材がかぶるもの・手間のかかるものは避ける */
function assignSides(wk, dayKeys, ctx){
  const n = S.settings.sidesPerDay|0;
  const sides = sidePool();
  if(!n || !sides.length){ dayKeys.forEach(k=>{ wk.days[k].sideIds = []; }); return; }
  const used = new Set();
  DAYS.forEach(d=>{ if(dayKeys.indexOf(d.k)<0) (wk.days[d.k].sideIds||[]).forEach(id=>used.add(id)); });
  dayKeys.forEach(k=>{
    const day = wk.days[k];
    if(day.mode!=='cook' || !day.mainId){ day.sideIds = []; return; }
    const main = recipeById(day.mainId);
    const mainNames = new Set(main ? main.ings.map(i=>i.name) : []);
    const ranked = sides.filter(r=>!used.has(r.id)).map(r=>{
      let sc = scoreRecipe(r, ctx);
      if(r.ings.some(i=>mainNames.has(i.name))) sc -= 30;   // 主菜と食材がかぶると量が読みにくい
      sc -= (r.minutes||10) * 0.6;                          // 平日なので手早いものを優先
      return {r, sc};
    }).sort((a,b)=>b.sc-a.sc);
    const chosen = ranked.slice(0, n).map(x=>x.r);
    chosen.forEach(r=>used.add(r.id));
    day.sideIds = chosen.map(r=>r.id);
  });
}

/** 1日ぶん引き直す（曜日ルールを尊重する） */
function shuffleMain(dk){
  const wk = W(), day = wk.days[dk], cur = day.mainId;
  const ctx = { leftNames:new Set(S.leftovers.map(l=>l.name)) };
  const used = new Set(DAYS.filter(d=>d.k!==dk).map(d=>wk.days[d.k].mainId).filter(Boolean));
  const rule = dayRule(dk);
  let next = null;

  if(rule.type==='rotate')      next = pickRotate(rule, used, cur);
  else if(rule.type==='pool')   next = pickPool(rule, used, ctx, cur);
  if(!next){
    const idx  = DAYS.findIndex(d=>d.k===dk);
    const prev = idx>0 ? recipeById(wk.days[DAYS[idx-1].k].mainId) : null;
    const nxt  = idx<DAYS.length-1 ? recipeById(wk.days[DAYS[idx+1].k].mainId) : null;
    const fp = freeMainPool();
    let cands = fp.filter(r=>!used.has(r.id) && r.id!==cur);
    const strict = cands.filter(r=>(!prev||r.protein!==prev.protein) && (!nxt||r.protein!==nxt.protein));
    if(strict.length) cands = strict;
    if(!cands.length) cands = fp.filter(r=>r.id!==cur);
    if(!cands.length) cands = fp;
    if(!cands.length) return false;
    const ranked = cands.map(r=>({r,sc:scoreRecipe(r,ctx)})).sort((a,b)=>b.sc-a.sc);
    const top = ranked.slice(0, Math.min(4, ranked.length));
    next = top[Math.floor(Math.random()*top.length)].r;
  }
  day.mainId = next.id;
  day.mode = 'cook';
  assignSides(wk, [dk], ctx);
  return true;
}
function shuffleSides(dk){
  const wk = W();
  wk.days[dk].sideIds = [];
  assignSides(wk, [dk], { leftNames:new Set(S.leftovers.map(l=>l.name)) });
}

/* ---------- 承認・差戻し・その他 ---------- */
function approveDay(dk){
  const wk = W(), day = wk.days[dk];
  if(!day.mainId){ toast('先に主菜を決めてください'); return; }
  day.mode = 'cook'; day.status = 'approved';
  save(); render();
}
function rejectDay(dk){
  const wk = W(), day = wk.days[dk];
  if(!shuffleMain(dk)){ toast('ほかに出せるレシピがありません'); return; }
  day.status = 'pending';
  day.rejects = (day.rejects||0) + 1;
  save(); render(); toast('別の案に差し替えました');
}
function setOther(dk, mode){
  const wk = W(), day = wk.days[dk];
  day.mode = mode; day.status = 'other'; day.sideIds = [];
  save(); render();
}
function approveAll(){
  const wk = W(); let n = 0;
  DAYS.forEach(d=>{
    const day = wk.days[d.k];
    if(day.status==='pending' && day.mainId){ day.status='approved'; day.mode='cook'; n++; }
  });
  save(); render();
  toast(n ? n+'日ぶん承認しました' : '承認できる日がありません');
}
function rateDay(dk, val){
  const wk = W(), day = wk.days[dk], r = recipeById(day.mainId);
  if(r){
    if(day.rating){ r.ratingSum -= day.rating; r.ratingCount -= 1; }
    if(day.rating === val){ day.rating = null; }             // もう一度押したら取り消し
    else { day.rating = val; r.ratingSum += val; r.ratingCount += 1; }
  }else{ day.rating = (day.rating===val ? null : val); }
  if(!day.cooked && day.status==='approved') markCooked(wk, dk);
  save(); render();
}

/* =========================================================================
   常備品：サイクルからの残日数推定
   ========================================================================= */
function stapleStatus(st){
  const cyc = Math.max(1, st.cycleDays||14);
  if(st.needBuy) return {left:0, ratio:0, level:'out', text:'切らしてる'};
  if(!st.lastBought) return {left:0, ratio:0, level:'unknown', text:'未設定'};
  let used = daysSince(st.lastBought);
  let left = cyc - used;
  if(st.snoozeUntil){
    const sl = -daysSince(st.snoozeUntil);   // snoozeUntil までの残り日数
    if(sl > left) left = sl;
  }
  const ratio = Math.max(0, Math.min(1, left/cyc));
  let level = 'ok';
  if(left <= 0) level = 'out';
  else if(left <= 2) level = 'soon';
  else if(left <= Math.max(3, cyc*0.25)) level = 'near';
  return {left, ratio, level, text: left<=0 ? '切れてるかも' : 'あと約'+left+'日'};
}
/* 買い物リストに載る条件：「切らしてる」印か、サイクル的にもうすぐ切れる。
   購入日が未設定のものは推定できないので載せない（常備品タブで初期設定する） */
const stapleNeeded = st => st.enabled!==false &&
  (st.needBuy === true ||
   (!!st.lastBought && ['out','soon'].indexOf(stapleStatus(st).level)>=0));
const stapleUnset = st => st.enabled!==false && !st.lastBought && !st.needBuy;

function buyStaple(st){
  const d = iso(today());
  if(st.lastBought){
    st.history = (st.history||[]).concat([st.lastBought]).slice(-6);
    const gap = diffDays(d, st.lastBought);
    if(gap>=1 && gap<=400){
      // 実績の間隔でサイクルを補正（直近を重めに）
      st.cycleDays = Math.max(1, Math.round(st.cycleDays*0.5 + gap*0.5));
    }
  }
  st.lastBought = d;
  st.snoozeUntil = null;
  st.needBuy = false;
}
function markOut(st){ st.needBuy = true; st.snoozeUntil = null; }
function snoozeStaple(st){
  // 「まだある」→ サイクルを少し長めに学習しつつ先送り
  const cyc = Math.max(1, st.cycleDays||14);
  st.cycleDays = Math.round(cyc * 1.12);
  st.snoozeUntil = iso(addDays(today(), Math.max(2, Math.round(cyc*0.3))));
  st.needBuy = false;
}


/* =========================================================================
   買い物リストの生成
   承認した日の主菜＋副菜の食材だけを載せる（未承認・外食・残り物は載せない）
   ========================================================================= */
function buildShopping(){
  const wk = W();
  const map = new Map();
  DAYS.forEach(d=>{
    const day = wk.days[d.k];
    if(day.mode!=='cook' || day.status!=='approved') return;
    const list = [day.mainId].concat(day.sideIds||[]).filter(Boolean);
    list.forEach((id,li)=>{
      const r = recipeById(id); if(!r) return;
      r.ings.forEach(i=>{
        const key = 'ing:'+i.name;
        if(!map.has(key)) map.set(key, {key, name:i.name, cat:i.cat, kind:'ing', uses:[]});
        map.get(key).uses.push({w:d.w, recipe:r.name, side: li>0});
      });
    });
  });
  const items = Array.from(map.values());
  S.leftovers.forEach(l=>{ const it = items.find(x=>x.name===l.name); if(it) it.leftover = true; });

  S.staples.filter(stapleNeeded).forEach(st=>{
    const stt = stapleStatus(st);
    const why = (st.needBuy ? '切らしてる' : (stt.level==='out' ? '切れてるかも' : 'そろそろ')) +
                (st.lastBought ? '・前回'+daysSince(st.lastBought)+'日前' : '');
    const dup = items.find(x=>x.kind==='ing' && x.name===st.name);
    if(dup){ dup.staple = st; dup.why = why; return; }
    items.push({key:'stp:'+st.id, name:st.name, cat:st.cat, kind:'staple', staple:st, why});
  });
  (wk.extras||[]).forEach(e=>{
    items.push({key:'ext:'+e.id, name:e.name, cat:e.cat, kind:'extra', extra:e});
  });

  const groups = CATS.map(c=>({k:c.k, ic:c.ic, nm:c.nm, items:[]}));
  const gmap = {}; groups.forEach(g=>gmap[g.k]=g);
  items.forEach(it=>{ (gmap[it.cat]||gmap.other).items.push(it); });
  groups.forEach(g=>g.items.sort((a,b)=>{
    const ka = a.kind==='ing'?0:(a.kind==='staple'?1:2), kb = b.kind==='ing'?0:(b.kind==='staple'?1:2);
    return ka-kb || a.name.localeCompare(b.name,'ja');
  }));
  return groups.filter(g=>g.items.length);
}

function listAsText(){
  const ws = parseISO(viewWeek), wk = W();
  let out = '🛒 買い物リスト '+md(ws)+'〜'+md(addDays(ws,4))+'\n\n【今週の献立】\n';
  DAYS.forEach(d=>{
    const day = wk.days[d.k];
    if(day.mode!=='cook'){ out += d.w+'：'+MODES[day.mode]+'\n'; return; }
    const r = recipeById(day.mainId);
    const sides = (day.sideIds||[]).map(recipeById).filter(Boolean);
    out += d.w+'：'+(r?r.name:'未定')+(sides.length?'（＋'+sides.map(x=>x.name).join('、')+'）':'')+
           (day.status==='pending'?' ※未承認':'')+'\n';
  });
  buildShopping().forEach(g=>{
    const items = g.items.filter(it=>!isChecked(it.key));
    if(!items.length) return;
    out += '\n'+g.ic+' '+g.nm+'\n'+items.map(it=>'□ '+it.name).join('\n')+'\n';
  });
  return out;
}
function copyList(){
  const txt = listAsText();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('コピーしました'),()=>fallbackCopy(txt));
  }else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('コピーしました'); }
  catch(e){ toast('コピーできませんでした'); }
  document.body.removeChild(ta);
}
function finishShopping(){
  const wk = W();
  const bought = new Set();
  buildShopping().forEach(g=>g.items.forEach(it=>{ if(it.staple && wk.checked[it.key]) bought.add(it.staple.id); }));
  let n = 0;
  S.staples.forEach(st=>{ if(bought.has(st.id)){ buyStaple(st); n++; } });
  // 月曜ローテーションを1つ進める
  DAYS.forEach(d=>{
    const rule = dayRule(d.k), day = wk.days[d.k];
    if(rule.type!=='rotate' || !rule.ids || !rule.ids.length) return;
    if(day.status!=='approved' || !day.mainId) return;
    const i = rule.ids.indexOf(day.mainId);
    if(i>=0) rule.next = (i+1) % rule.ids.length;
  });
  wk.done = true;
  save(); render();
  toast(n ? '常備品を'+n+'件 更新しました' : '買い物おつかれさまでした');
}

  const list = S.staples.slice().sort((a,b)=>{
    const la = a.needBuy ? -999 : (a.lastBought ? stapleStatus(a).left : 9999);
    const lb = b.needBuy ? -999 : (b.lastBought ? stapleStatus(b).left : 9999);
    return la-lb || a.name.localeCompare(b.name,'ja');
  });
  const need  = list.filter(stapleNeeded);
  const unset = list.filter(stapleUnset);
  const rest  = list.filter(st=>!stapleNeeded(st) && !stapleUnset(st));

  let h = '<div class="note">在庫は<b>数えません</b>。「買った日 ＋ 目安サイクル」から切れそうな時期を推定し、'+
          '買い物リストに自動で載せます。実際に見て残っていたら <b>まだある</b> を押すだけ。'+
          'その実績からサイクルを自動で補正していきます。</div>';

  h += '<div class="sec">⚠️ 買い物リストに載っているもの（'+need.length+'）<span class="line"></span></div>';
  h += '<div class="card">' + (need.length ? need.map(stapleRow).join('') :
        '<div class="empty" style="padding:22px"><span class="big">👍</span>いま切れそうなものはありません</div>') + '</div>';

  if(unset.length){
    h += '<div class="sec">🔰 最初に設定するもの（'+unset.length+'）<span class="line"></span></div>'+
         '<div class="card"><div class="tiny" style="padding:11px 13px 2px">'+
         '冷蔵庫や棚を見て、<b>今ある</b>か<b>切らしてる</b>かを押してください。押した時点からサイクルの推定が始まります。'+
         '使わないものは行をタップして「停止」にできます。</div>'+
         unset.map(stapleRow).join('')+'</div>';
  }

  h += '<div class="sec">📦 在庫あり（'+rest.length+'）<span class="line"></span></div>';
  h += '<div class="card">' + (rest.length ? rest.map(stapleRow).join('') :
        '<div class="empty" style="padding:20px">—</div>') + '</div>';

  h += '<button class="btn sub full" style="margin:14px 0" id="btnAddStaple">＋ 常備品を追加</button>';
  el.innerHTML = h;

  el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const st = S.staples.find(x=>x.id===b.dataset.buy); if(!st) return;
    const first = !st.lastBought;
    buyStaple(st); save(); render();
    toast(first ? st.name+' のサイクル推定を開始しました' : st.name+' の購入日を今日に更新しました');
  });
  el.querySelectorAll('[data-out]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const st = S.staples.find(x=>x.id===b.dataset.out); if(!st) return;
    markOut(st); save(); render(); toast(st.name+' を買い物リストに追加しました');
  });
  el.querySelectorAll('[data-snz]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const st = S.staples.find(x=>x.id===b.dataset.snz); if(!st) return;
    snoozeStaple(st); save(); render(); toast('まだあるので先送りしました');
  });
  el.querySelectorAll('[data-edstp]').forEach(b=>b.onclick=()=>openStapleEdit(b.dataset.edstp));
  $('#btnAddStaple').onclick = ()=>openStapleEdit(null);
}
function stapleRow(st){
  const s = stapleStatus(st);
  const col = LEVEL_COLOR[s.level];
  return '<div class="stp"><div class="stpm" data-edstp="'+st.id+'" style="cursor:pointer">'+
    '<div class="stpn">'+catIc(st.cat)+' '+esc(st.name)+
      (st.enabled===false?' <span class="pill">停止中</span>':'')+
      ' <span class="pill" style="background:'+(s.level==='ok'?'var(--g-l)':s.level==='out'?'var(--r-l)':s.level==='unknown'?'#eeecea':'var(--a-l)')+
      ';color:'+col+'">'+s.text+'</span></div>'+
    (s.level==='unknown' ? '' : '<div class="bar"><i style="width:'+Math.round(s.ratio*100)+'%;background:'+col+'"></i></div>')+
    '<div class="tiny" style="margin-top:4px">サイクル約'+st.cycleDays+'日'+
      (st.lastBought ? '・前回 '+md(parseISO(st.lastBought))+'（'+daysSince(st.lastBought)+'日前）' : '・購入日 未設定')+'</div>'+
    '</div><div class="stpa">'+
      (st.lastBought || st.needBuy
        ? '<button data-snz="'+st.id+'">まだある</button><button class="buy" data-buy="'+st.id+'">買った</button>'
        : '<button data-out="'+st.id+'">切らしてる</button><button class="buy" data-buy="'+st.id+'">今ある</button>')+
    '</div></div>';
}


/* ---------- レシピタブ ---------- */
let recipeFilter = 'main';
function renderRecipes(){
  const el = $('#pane-recipe');
  const all = S.recipes.filter(r=>recipeFilter==='all' ? true
    : (recipeFilter==='side' ? r.kind==='side' : r.kind!=='side'));
  const list = all.slice().sort((a,b)=>{
    const da = daysSince(a.lastCooked), db = daysSince(b.lastCooked);
    return (db===null?9999:db) - (da===null?9999:da);
  });
  const nMain = S.recipes.filter(r=>r.kind!=='side').length;
  const nSide = S.recipes.filter(r=>r.kind==='side').length;

  let h = '<div style="display:flex;gap:8px;margin:12px 0 2px">'+
    '<button class="btn" style="flex:1" id="btnPaste">📋 貼り付けて取り込む</button>'+
    '<button class="btn sub" id="btnNewRecipe" style="flex:none;padding:12px 15px">＋ 手入力</button></div>'+
    '<div class="tiny" style="margin:0 2px 4px">レシピサイトの材料欄やYouTubeの概要欄をコピーして貼るだけ。分量と調味料は自動で落とし、食材だけ取り込みます。</div>'+
    '<div class="filt">'+
      '<button data-f="main" class="'+(recipeFilter==='main'?'on':'')+'">主菜 '+nMain+'</button>'+
      '<button data-f="side" class="'+(recipeFilter==='side'?'on':'')+'">副菜 '+nSide+'</button>'+
      '<button data-f="all"  class="'+(recipeFilter==='all'?'on':'')+'">すべて</button>'+
    '</div>';

  if(!list.length){
    h += '<div class="empty"><span class="big">📖</span>まだありません<br>'+
         (recipeFilter==='side'?'副菜を足すと献立と一緒に提案されます':'うちの定番を20〜30品いれると提案が効きはじめます')+'</div>';
  }else{
    h += '<div class="sec">最後に作った順<span class="line"></span></div><div class="card">';
    const ruleBadge = {};
    DAYS.forEach(d=>{
      const rule = dayRule(d.k);
      if(rule.type==='rotate' || rule.type==='pool')
        (rule.ids||[]).forEach(id=>{ ruleBadge[id] = d.w + (rule.type==='rotate'?'ローテ':'定番'); });
    });
    list.forEach(r=>{
      const ds = daysSince(r.lastCooked), av = avgRating(r);
      h += '<div class="rc" data-edrec="'+r.id+'"><div class="rcm">'+
        '<div class="rcn">'+esc(r.name)+
          (r.kind==='side'?' <span class="pill">副菜</span>':' <span class="pill '+r.protein+'">'+PROT[r.protein].ic+'</span>')+
          (r.minutes?' <span class="pill min">'+r.minutes+'分</span>':'')+
          (ruleBadge[r.id]?' <span class="pill b">'+ruleBadge[r.id]+'</span>':'')+
          (av!==null?' <span class="pill '+(av>=2.5?'g':(av<1.7?'r':'a'))+'">'+
            (av>=2.5?'👍':(av<1.7?'👎':'😐'))+' '+av.toFixed(1)+'</span>':'')+
          (ds===null?' <span class="pill">未調理</span>':(ds<0?' <span class="pill b">今週</span>':' <span class="pill">'+ds+'日前</span>'))+
        '</div>'+
        '<div class="rci">'+(r.ings.length?r.ings.map(i=>esc(i.name)).join('・'):'食材の登録なし')+
          (r.cookCount?'　／　通算'+r.cookCount+'回':'')+'</div>'+
      '</div><div style="color:#c3c7cd;font-size:18px">›</div></div>';
    });
    h += '</div>';
  }
  el.innerHTML = h;
  $('#btnPaste').onclick = openPaste;
  $('#btnNewRecipe').onclick = ()=>openRecipeEdit(null);
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ recipeFilter=b.dataset.f; renderRecipes(); });
  el.querySelectorAll('[data-edrec]').forEach(b=>b.onclick=()=>openRecipeEdit(b.dataset.edrec));
}

function sheet(title, bodyHTML, footHTML){
  $('#shTitle').textContent = title;
  $('#shBody').innerHTML = bodyHTML;
  $('#shFoot').innerHTML = footHTML || '';
  $('#ov').classList.add('on');

function closeSheet(){ $('#ov').classList.remove('on'); }
$('#shClose').onclick = closeSheet;

/* ---------- 主菜／副菜を選ぶ ---------- */
function openPicker(dk, kind, sideIdx){
  const pool = kind==='side' ? sidePool() : mainPool();
  if(!pool.length){
    toast(kind==='side'?'副菜が登録されていません':'先にレシピを登録してください');
    closeSheet(); switchTab('recipe'); return;
  }
  const wk = W(), day = wk.days[dk];
  const cur = kind==='side' ? (sideIdx>=0 ? day.sideIds[sideIdx] : null) : day.mainId;
  const list = pool.slice().sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  const w = DAYS.find(d=>d.k===dk).w;
  const body = '<div class="tiny" style="margin:12px 0 2px">'+w+'曜日の'+(kind==='side'?'副菜':'主菜')+'を選んでください。</div>'+
    '<div class="pickgrid">'+ list.map(r=>{
      const ds = daysSince(r.lastCooked);
      return '<button data-r="'+r.id+'" class="'+(r.id===cur?'on':'')+'"><div class="pn">'+esc(r.name)+'</div>'+
      '<div class="pi">'+(r.kind==='side'?'副菜':PROT[r.protein].ic)+(r.minutes?' '+r.minutes+'分':'')+
      (ds===null?'':' ・'+ds+'日前')+'</div></button>';
    }).join('') +'</div>';
  sheet((kind==='side'?'副菜':'主菜')+'を選ぶ', body,
    '<button class="btn sub" id="pkClear">'+(kind==='side'?'副菜なし':'未設定にする')+'</button>'+
    '<button class="btn" id="pkClose">閉じる</button>');
  $('#shBody').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    if(kind==='side'){
      day.sideIds = day.sideIds||[];
      if(sideIdx>=0) day.sideIds[sideIdx] = b.dataset.r;
      else if(day.sideIds.indexOf(b.dataset.r)<0) day.sideIds.push(b.dataset.r);
    }else{
      day.mainId = b.dataset.r; day.mode='cook';
      if(day.status==='other') day.status='pending';
    }
    save(); closeSheet(); render();
  });
  $('#pkClear').onclick = ()=>{
    if(kind==='side'){ if(sideIdx>=0) day.sideIds.splice(sideIdx,1); else day.sideIds=[]; }
    else day.mainId = null;
    save(); closeSheet(); render();
  };
  $('#pkClose').onclick = closeSheet;
}

/* ---------- 食材の買う量メモ ----------
   分量はレシピ側で管理しない方針だが、一人で買いに行くと「玉ねぎ何個？」で迷う。
   そこで、迷った食材だけその場でメモを残せるようにする。
   メモは食材名に紐づけて覚えるので、次の週からはずっと表示される。 */
function openIngNote(name){
  const cur = (S.ingNotes||{})[name] || '';
  const body =
    '<div class="tiny" style="margin:12px 0 10px">'+
      '<b>'+esc(name)+'</b> を買うときの目安を書いておくと、次の週からもここに出ます。'+
      '一人で買いに行くときに迷わなくなります。</div>'+
    '<input class="f" id="inNote" value="'+esc(cur)+'" placeholder="例）3個入りネット / 大きめ1本 / 2パック" enterkeyhint="done">'+
    '<div class="chips" style="margin-top:10px">'+
      ['1袋','1パック','2パック','1本','2本','1個','3個','1玉','半玉','1束','大きめ','少なめ']
        .map(x=>'<button class="chip" data-q="'+x+'">'+x+'</button>').join('')+
    '</div><div style="height:10px"></div>';
  sheet('買う量のメモ', body,
    (cur ? '<button class="btn sub" id="inDel" style="flex:none;padding:12px 15px;color:var(--r)">消す</button>' : '')+
    '<button class="btn" id="inSave">保存</button>');
  const inp = $('#inNote');
  $('#shBody').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
    inp.value = (inp.value.trim() ? inp.value.trim()+' ' : '') + b.dataset.q;
  });
  const commit = ()=>{
    const v = inp.value.trim();
    S.ingNotes = S.ingNotes || {};
    if(v) S.ingNotes[name] = v; else delete S.ingNotes[name];
    save(); closeSheet(); renderShop();
  };
  $('#inSave').onclick = commit;
  inp.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); commit(); } };
  const d = $('#inDel');
  if(d) d.onclick = ()=>{ delete S.ingNotes[name]; save(); closeSheet(); renderShop(); };
  setTimeout(()=>{ if($('#inNote')) $('#inNote').focus(); }, 150);
}

/* ---------- 貼り付けて取り込む ---------- */
let draft = null;
function openPaste(){
  const body =
    '<div class="note"><b>URLを貼るだけ</b>でも、<b>材料欄・概要欄のコピペ</b>でも取り込めます。'+
    '分量・調味料は自動で取り除き、<b>食材名だけ</b>にします。<br>'+
    '<span style="opacity:.8">※ URLの場合は公開の読み取りサービス経由でページを取得します（数秒かかります）。'+
    '取得できないサイトのときは、材料欄をコピーして貼ってください。</span></div>'+
    '<label class="lb">貼り付け</label>'+
    '<textarea class="f" id="pasteTA" placeholder="https://cookpad.com/recipe/... のようなURL、または&#10;&#10;【材料】2人分&#10;・豚ひき肉…200g&#10;・春雨…100g&#10;・にら…1束&#10;・醤油…大さじ2&#10;&#10;【作り方】&#10;..."></textarea>';
  sheet('貼り付けて取り込む', body,
    '<button class="btn sub" id="pxCancel">やめる</button><button class="btn" id="pxGo">解析する</button>');
  $('#pxCancel').onclick = closeSheet;
  const applyParsed = p => {
    draft = {
      id:null, kind:'main', day:null, title:p.title, minutes:p.minutes,
      ings: p.ings.map(i=>({name:i.name, cat:i.cat})),
      seasonings: p.seasonings.slice()
    };
    draft.protein = proteinOf(draft.ings);
    openRecipeForm('取り込みの確認', true);
  };
  $('#pxGo').onclick = async ()=>{
    const txt = $('#pasteTA').value;
    const p = parsePaste(txt);
    // URLだけ貼られた／テキストから食材が取れずURLが含まれる → ページを取りに行く
    const um = String(txt).match(/https?:\/\/\S+/);
    if(p.urlOnly || (!hasIngs(p) && um)){
      const btn = $('#pxGo');
      btn.textContent = '取得中…'; btn.disabled = true;
      try{
        applyParsed(await importFromUrl(p.urlOnly ? txt.trim() : um[0]));
      }catch(e){
        btn.textContent = '解析する'; btn.disabled = false;
        toast('ページを取得できませんでした。材料欄をコピーして貼ってください');
      }
      return;
    }
    if(!hasIngs(p)){ toast('食材が見つかりませんでした。材料欄を含めて貼ってください'); return; }
    applyParsed(p);
  };
  setTimeout(()=>{ const t=$('#pasteTA'); if(t) t.focus(); },120);
}

/* ---------- レシピ編集フォーム（新規／取り込み確認／編集 共通） ---------- */
function openRecipeEdit(id){
  const r = id ? recipeById(id) : null;
  draft = r ? {
    id:r.id, kind:r.kind||'main', title:r.name, minutes:r.minutes, protein:r.protein,
    day:assignedDayOf(r.id),
    ings:r.ings.map(i=>({name:i.name,cat:i.cat})), seasonings:(r.seasonings||[]).slice()
  } : { id:null, kind:(recipeFilter==='side'?'side':'main'), title:'', minutes:null,
        protein:'other', day:null, ings:[], seasonings:[] };
  openRecipeForm(r ? 'レシピを編集' : 'レシピを追加', false);
}

function openRecipeForm(title, fromPaste){

    (fromPaste ? '<div class="note" style="background:var(--g-l);border-color:#c9e8d6;color:#1f6b43">'+

    '<div class="seg" id="rfKind">'+
      '<button data-k="main" class="'+(draft.kind!=='side'?'on':'')+'">🍖 主菜</button>'+
      '<button data-k="side" class="'+(draft.kind==='side'?'on':'')+'">🥗 副菜</button>'+
    '</div>'+
    '<div id="rfDayWrap"'+(draft.kind==='side'?' hidden':'')+'>'+
      '<label class="lb">出す曜日</label>'+
      '<div class="seg" id="rfDay">'+
        '<button data-d="" class="'+(!draft.day?'on':'')+'">おまかせ</button>'+
        DAYS.map(d=>'<button data-d="'+d.k+'" class="'+(draft.day===d.k?'on':'')+'">'+d.w+'</button>').join('')+
      '</div>'+
      '<div class="tiny" style="margin-top:6px" id="rfDayHint"></div>'+
    '</div>'+
    '<label class="lb">タンパク源（献立の並べ方に使います）</label>'+
    '<div class="seg" id="rfProt">'+
      ['meat','fish','other'].map(p=>'<button data-p="'+p+'" class="'+(draft.protein===p?'on':'')+'">'+PROT[p].ic+' '+PROT[p].nm+'</button>').join('')+
    '</div>'+
    '<label class="lb">だいたいの所要時間（分）</label>'+
    '<input class="f" id="rfMin" type="number" inputmode="numeric" min="3" max="180" value="'+(draft.minutes||'')+'" placeholder="例）15">'+
    '<label class="lb">買う食材　<span style="font-weight:600;color:var(--sub2)">絵文字タップでカテゴリ変更 / ✕ で削除</span></label>'+
    '<div class="chips" id="rfIngs"></div>'+
    '<div class="addrow" style="background:transparent;border:none;padding:9px 0 0">'+
      '<input id="rfAdd" placeholder="食材を追加" enterkeyhint="done"><button class="btn sm" id="rfAddBtn">追加</button></div>'+
    '<label class="lb">調味料（買い物リストには出しません）</label>'+
    '<div class="chips" id="rfSeas"></div>'+

    '<div style="height:10px"></div>';
  sheet(title, body,
    (draft.id ? '<button class="btn sub" id="rfDel" style="flex:none;padding:12px 15px;color:var(--r)">削除</button>' : '')+
    '<button class="btn" id="rfSave">保存</button>');

    const w = DAYS.find(d=>d.k===draft.day).w;
    const rule = dayRule(draft.day);
    const already = (rule.ids||[]).filter(id=>id!==draft.id).map(id=>(recipeById(id)||{}).name).filter(Boolean);
