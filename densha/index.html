<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>でんしゃすごろく — のりかえて まちへ いこう</title>
<meta name="description" content="ほんものの路線・種別・乗り換えで遊ぶ、親子向けの電車すごろく。">
<meta name="theme-color" content="#1a6fb5">
<link rel="icon" type="image/png" sizes="180x180" href="/densha/icon-180.png">
<link rel="apple-touch-icon" href="/densha/icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="/densha/icon-512.png">
<link rel="manifest" href="/densha/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="でんしゃすごろく">
<style>
:root{
  --bg:#e9eef4; --card:#fff; --card2:#f6f8fb;
  --ink:#14202c; --sub:#5b6a7a; --sub2:#8b98a6; --line:#dbe3ec;
  --led:#101720; --led-ink:#ffc23a; --led-green:#6ee787;
  --pri:#1a6fb5; --pri-d:#125a96;
  --gold:#e0a415; --coin:#f0b429; --danger:#d64545;
  --rad:18px; --rad-s:12px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --kana:1;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e141b; --card:#18212c; --card2:#131b24;
    --ink:#e8eef5; --sub:#9aabbc; --sub2:#6d7d8e; --line:#26323f;
    --pri:#3b8fd8; --pri-d:#2a6fae;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141b; --card:#18212c; --card2:#131b24;
  --ink:#e8eef5; --sub:#9aabbc; --sub2:#6d7d8e; --line:#26323f;
  --pri:#3b8fd8; --pri-d:#2a6fae;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.hide{display:none!important}

/* 漢字/かな 切り替え */
.kj{display:none} .kn{display:inline}
body.adult .kj{display:inline} body.adult .kn{display:none}
.only-adult{display:none} body.adult .only-adult{display:block}
.only-kid{display:block} body.adult .only-kid{display:none}

/* ---------- 共通パーツ ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;
  padding:12px 18px;border-radius:var(--rad);font-weight:800;font-size:18px;
  background:var(--card);box-shadow:0 2px 0 var(--line),0 4px 14px rgba(20,32,44,.07);
  transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--line)}
.btn.pri{background:linear-gradient(180deg,var(--pri),var(--pri-d));color:#fff;
  box-shadow:0 3px 0 rgba(0,0,0,.22),0 8px 20px rgba(26,111,181,.32)}
.btn.big{min-height:76px;font-size:22px;border-radius:22px}
.btn:disabled{opacity:.42;box-shadow:none}
.card{background:var(--card);border-radius:var(--rad);padding:14px;
  box-shadow:0 1px 3px rgba(20,32,44,.07),0 6px 18px rgba(20,32,44,.05)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  font-size:12px;font-weight:800;background:var(--card2);color:var(--sub)}

/* ---------- タイトル ---------- */
#screen-title{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;padding:calc(24px + var(--st)) 18px calc(24px + var(--sb));
  background:radial-gradient(120% 80% at 50% 0%,#2a83cf 0%,#1a6fb5 40%,#0f4e82 100%);color:#fff;text-align:center}
#screen-title h1{font-size:30px;font-weight:900;letter-spacing:.02em;line-height:1.25;text-shadow:0 2px 8px rgba(0,0,0,.25)}
#screen-title p{opacity:.9;font-size:14px;max-width:26em}
.title-train{width:min(280px,72vw)}
#screen-title .btn{width:min(320px,86vw)}
#screen-title .btn:not(.pri){background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}

/* ---------- ミッション選択 ---------- */
.head{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);
  padding-top:var(--st);box-shadow:0 2px 12px rgba(20,32,44,.06)}
.head-row{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:560px;margin:0 auto}
.head-row h2{font-size:17px;font-weight:900;flex:1;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  font-size:20px;background:var(--card2);flex:none}
.mlist{display:flex;flex-direction:column;gap:10px;padding:14px 0 calc(28px + var(--sb))}
.mrow{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.mrow .no{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;
  font-weight:900;font-size:18px;color:#fff;background:var(--pri)}
.mrow .tt{flex:1;min-width:0}
.mrow .tt b{display:block;font-size:17px;font-weight:800;line-height:1.35}
.mrow .tt small{color:var(--sub);font-size:12.5px}
.stars{letter-spacing:1px;font-size:14px;color:var(--gold)}
.lv1{background:#3fa46a}.lv2{background:#e08a1a}.lv3{background:#cf4b4b}

/* ---------- ゲーム ヘッダー ---------- */
#screen-game{padding-bottom:calc(178px + var(--sb))}
.ghead{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);
  padding-top:var(--st)}
.ghead-in{max-width:560px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:8px}
.goal-box{flex:1;min-width:0}
.goal-box .lbl{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.06em}
.goal-box .nm{font-size:20px;font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gstats{display:flex;gap:6px;flex:none}
.stat{background:var(--card2);border-radius:12px;padding:5px 9px;text-align:center;min-width:52px}
.stat b{display:block;font-size:17px;font-weight:900;line-height:1.1}
.stat span{font-size:10px;color:var(--sub);font-weight:700}
.goalstrip{display:flex;gap:4px;padding:0 12px 8px;max-width:560px;margin:0 auto}
.gchip{flex:1;height:6px;border-radius:99px;background:var(--line)}
.gchip.done{background:#3fa46a}.gchip.now{background:var(--coin)}

/* ---------- 乗っている電車 ---------- */
.nowtrain{display:flex;align-items:center;gap:12px;margin:12px 0 10px;padding:12px 14px;
  border-radius:var(--rad);background:var(--led);color:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,.22);position:relative;overflow:hidden}
.nowtrain::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 2px,transparent 2px 4px)}
.nowtrain .tsvg{width:62px;flex:none}
.nowtrain .ti{flex:1;min-width:0}
.nowtrain .lnm{font-size:13px;font-weight:800;opacity:.85;display:flex;align-items:center;gap:6px}
.nowtrain .lnm i{width:10px;height:10px;border-radius:3px;flex:none}
.led{font-size:20px;font-weight:900;color:var(--led-ink);letter-spacing:.02em;
  text-shadow:0 0 12px rgba(255,194,58,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svbadge{display:inline-block;padding:2px 8px;border-radius:7px;font-size:13px;font-weight:900;margin-right:7px;color:#fff;vertical-align:1px}
.sv-local{background:#4a5d70}.sv-rapid{background:#0a7ad1}.sv-exp{background:#d9451f}.sv-ltd{background:#b1268f}

/* ---------- 車内路線図ストリップ ---------- */
.striphead{display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:0 2px}
.striphead b{font-size:12px;font-weight:800;color:var(--sub);flex:1;min-width:0;line-height:1.35}
.sh-right{display:flex;gap:6px;flex:none}
.striphead .pill{white-space:nowrap}
.strip{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  background:var(--card);border-radius:var(--rad);padding:16px 0 12px;
  box-shadow:0 1px 3px rgba(20,32,44,.07),0 6px 18px rgba(20,32,44,.05);
  scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.track{display:flex;align-items:flex-start;position:relative;padding:0 24px;min-width:max-content}
.track::before{content:"";position:absolute;left:24px;right:24px;top:30px;height:8px;border-radius:99px;
  background:var(--c,#999);opacity:.9}
.node{position:relative;display:flex;flex-direction:column;align-items:center;flex:none;padding-top:8px}
.node.stop{width:82px}
.node.skip{width:46px}
.node .dot{width:22px;height:22px;border-radius:50%;background:var(--card);
  box-shadow:0 0 0 5px var(--c,#999);z-index:2;margin-top:11px}
.node.skip .dot{width:9px;height:9px;box-shadow:0 0 0 3px var(--c,#999);opacity:.5;margin-top:17px}
.node .nm{margin-top:9px;font-size:12px;font-weight:800;text-align:center;line-height:1.22;
  width:100%;white-space:normal;overflow-wrap:anywhere}
.node.skip .nm{font-size:10.5px;color:var(--sub2);font-weight:600}
.node.goal .dot{background:var(--coin);box-shadow:0 0 0 5px var(--c,#999),0 0 0 9px rgba(240,180,41,.45)}
.node.owned .nm::after{content:" ●";color:#3fa46a}
.node.here .dot{background:#fff;box-shadow:0 0 0 6px #14202c,0 0 0 11px rgba(20,32,44,.18)}
.node .me{position:absolute;top:-16px;font-size:22px;line-height:1;animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.node .xf{display:flex;gap:2px;margin-top:6px;flex-wrap:wrap;justify-content:center;max-width:78px}
.node .xf i{width:13px;height:5px;border-radius:2px}
.passmark{position:absolute;top:24px;font-size:10px;font-weight:900;color:var(--sub2)}
.hintbtn{background:#fff3d4;color:#a06a08;font-weight:900;padding:5px 11px;min-height:30px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hintbtn{background:#3d2f10;color:#ffc95e}}
.btn.best-step{box-shadow:0 3px 0 rgba(0,0,0,.22),0 0 0 3px var(--coin),0 8px 20px rgba(26,111,181,.32)}

/* ---------- のりかえリスト ---------- */
.sec{margin:14px 0 0}
.sec > .sh{font-size:13px;font-weight:900;color:var(--sub);margin:0 2px 8px;display:flex;align-items:center;gap:8px}
.xlist{display:flex;flex-direction:column;gap:8px}
.xgroup{background:var(--card);border-radius:var(--rad-s);overflow:hidden;
  box-shadow:0 1px 3px rgba(20,32,44,.08);border-left:8px solid var(--c,#999)}
.xgroup.best{box-shadow:0 0 0 3px var(--coin),0 1px 3px rgba(20,32,44,.08)}
.xchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 11px}
.xchip{font-size:13px;font-weight:900;padding:7px 12px;border-radius:9px;min-height:40px;
  background:var(--card2);color:var(--sub);display:flex;align-items:center;gap:5px}
.xchip.on{color:#fff}
.xchip.on.sv-local{background:#4a5d70}.xchip.on.sv-rapid{background:#0a7ad1}
.xchip.on.sv-exp{background:#d9451f}.xchip.on.sv-ltd{background:#b1268f}
.xchip:disabled{opacity:.4}
.xchip .hi{font-size:14px}
.xmore{width:100%;min-height:52px;font-size:14.5px;font-weight:900;color:var(--sub);
  background:var(--card);border-radius:var(--rad-s);box-shadow:0 1px 3px rgba(20,32,44,.08)}
.xrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:11px 12px;min-height:60px;transition:transform .08s}
.xrow:active{transform:scale(.985)}
.xrow .xi{flex:1;min-width:0}
.xrow .xl{font-size:15.5px;font-weight:900;line-height:1.25}
.xrow .xd{font-size:12.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xrow .xc{flex:none;font-size:11.5px;font-weight:900;padding:4px 8px;border-radius:8px;
  background:var(--card2);color:var(--sub)}
.xrow .xc.free{background:#e3f6ea;color:#207a46}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .xrow .xc.free{background:#123524;color:#7fd8a4}}

/* ---------- 下部の操作バー ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
  border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(20,32,44,.12);
  padding:10px 14px calc(10px + var(--sb))}
.dock-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.pips{display:flex;align-items:center;justify-content:center;gap:7px;min-height:26px}
.pips .p{width:17px;height:17px;border-radius:50%;background:var(--coin);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.14)}
.pips .p.used{background:var(--line);box-shadow:none}
.pips .lb{font-size:12.5px;font-weight:900;color:var(--sub);margin-right:3px}
.dock-row{display:flex;gap:9px}
.dock-row .btn{flex:1}
.dice{font-size:34px;line-height:1}
.dice.rolling{animation:sh .28s linear infinite}
@keyframes sh{0%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}100%{transform:rotate(-14deg)}}

/* ---------- モーダル ---------- */
.mask{position:fixed;inset:0;z-index:70;background:rgba(10,18,26,.55);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:18px;
  padding-top:calc(18px + var(--st));padding-bottom:calc(18px + var(--sb));animation:fi .18s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);border-radius:24px;width:100%;max-width:440px;
  max-height:100%;overflow-y:auto;padding:22px 20px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pu .24s cubic-bezier(.2,1.2,.3,1)}
@keyframes pu{from{transform:translateY(18px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:23px;font-weight:900;line-height:1.3;margin-bottom:6px}
.sheet .em{font-size:58px;line-height:1.1;margin-bottom:4px}
.sheet p{color:var(--sub);font-size:14.5px;margin-bottom:14px}
.sheet .btn{width:100%;margin-top:9px}
.bignum{font-size:46px;font-weight:900;color:var(--coin);line-height:1.1;
  text-shadow:0 2px 0 rgba(0,0,0,.08)}
.ledger{text-align:left;background:var(--card2);border-radius:14px;padding:12px;margin:12px 0;
  max-height:38vh;overflow-y:auto}
.ledger .lr{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;
  border-bottom:1px dashed var(--line)}
.ledger .lr:last-child{border:none}
.ledger .lr b{font-weight:900}
.ledger .tot{border-top:2px solid var(--line);margin-top:6px;padding-top:9px;font-size:17px;font-weight:900}

/* ---------- 車両カード / 図鑑 ---------- */
.tcard{background:linear-gradient(170deg,var(--card2),var(--card));border-radius:18px;padding:14px;
  box-shadow:0 2px 6px rgba(20,32,44,.1);text-align:center}
.tcard .tsvg{width:100%;max-width:190px;margin:0 auto 8px;display:block}
.tcard .tn{font-size:16px;font-weight:900;line-height:1.3}
.tcard .tk{font-size:11.5px;color:var(--sub);margin-top:2px}
.tcard .tnote{font-size:12.5px;color:var(--sub);margin-top:7px;text-align:left;line-height:1.5}
.rare{display:inline-block;margin-top:6px;font-size:11px;font-weight:900;padding:2px 9px;border-radius:99px}
.r1{background:#e8eef4;color:#5b6a7a}.r2{background:#dcedfb;color:#1a6fb5}.r3{background:#fbeede;color:#b8761a}
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;
  padding:14px 0 calc(28px + var(--sb))}
.bookgrid .tcard.locked{opacity:.5;filter:grayscale(1)}
.bookgrid .tcard .tnote{display:none}
.bookcount{text-align:center;font-size:14px;font-weight:800;color:var(--sub);padding:12px 0 0}

/* ---------- 設定 ---------- */
.setrow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);text-align:left}
.setrow:last-child{border:none}
.setrow .si{flex:1}
.setrow .si b{display:block;font-size:15.5px;font-weight:800}
.setrow .si small{color:var(--sub);font-size:12px;line-height:1.4;display:block}
.sw{width:56px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28);transition:transform .18s}
.sw.on{background:#3fa46a}.sw.on::after{transform:translateX(24px)}
.note{font-size:12px;color:var(--sub2);line-height:1.6;padding:14px 4px calc(28px + var(--sb))}
.note a{color:var(--pri)}
</style>
</head>
<body>

<!-- タイトル -->
<section id="screen-title">
  <svg class="title-train" viewBox="0 0 200 120" aria-hidden="true"></svg>
  <h1>でんしゃすごろく</h1>
  <p>サイコロを ふって、のりかえて、いろんな まちへ いこう。<br>ほんものの ろせんと しゅべつで あそべます。</p>
  <button class="btn pri big" id="btn-start">▶ はじめる</button>
  <button class="btn" id="btn-book-t">📖 しゃりょうずかん</button>
  <button class="btn" id="btn-set-t">⚙️ せってい</button>
</section>

<!-- ミッション選択 -->
<section id="screen-select" class="hide">
  <div class="head"><div class="head-row">
    <button class="iconbtn" id="sel-back">◀</button>
    <h2>きょうは どこへ いく？</h2>
    <button class="iconbtn" id="sel-book">📖</button>
  </div></div>
  <div class="wrap"><div class="mlist" id="mlist"></div></div>
</section>

<!-- ゲーム -->
<section id="screen-game" class="hide">
  <div class="ghead">
    <div class="ghead-in">
      <button class="iconbtn" id="g-menu">≡</button>
      <div class="goal-box">
        <div class="lbl">つぎの もくてきち</div>
        <div class="nm" id="g-goal">—</div>
      </div>
      <div class="gstats">
        <div class="stat"><b id="g-turn">—</b><span>のこり</span></div>
        <div class="stat"><b id="g-coin">—</b><span>コイン</span></div>
      </div>
    </div>
    <div class="goalstrip" id="g-chips"></div>
  </div>
  <div class="wrap">
    <div class="nowtrain">
      <svg class="tsvg" viewBox="0 0 200 120" id="g-tsvg" aria-hidden="true"></svg>
      <div class="ti">
        <div class="lnm"><i id="g-lcolor"></i><span id="g-lname">—</span></div>
        <div class="led" id="g-led">—</div>
      </div>
    </div>
    <div class="striphead">
      <b id="g-striplbl">この でんしゃが とまる えき</b>
      <span class="sh-right">
        <span class="pill" id="g-here">—</span>
        <button class="pill hintbtn" id="g-hint">💡 ヒント</button>
      </span>
    </div>
    <div class="strip" id="g-strip"><div class="track" id="g-track"></div></div>
    <div class="sec">
      <div class="sh" id="g-xhead">のりかえられる でんしゃ</div>
      <div class="xlist" id="g-xlist"></div>
    </div>
  </div>
  <div class="dock"><div class="dock-in">
    <div class="pips" id="g-pips"></div>
    <div class="dock-row" id="g-actions"></div>
  </div></div>
</section>

<!-- 図鑑 -->
<section id="screen-book" class="hide">
  <div class="head"><div class="head-row">
    <button class="iconbtn" id="book-back">◀</button>
    <h2>しゃりょうずかん</h2>
  </div></div>
  <div class="wrap">
    <div class="bookcount" id="book-count"></div>
    <div class="bookgrid" id="bookgrid"></div>
  </div>
</section>

<div id="modal-root"></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
